        <div class="toolbar"><label class="switch"><input type="checkbox" id="bSkills" ${b.useSkills ? 'checked' : ''}> ${t('Boleh menghitung')}</label><label class="switch"><input type="checkbox" id="bKB" ${b.useKB ? 'checked' : ''}> ${t('Boleh memakai pengetahuan umum Galaxy')}</label></div></div>
      <div class="panel"><h2>${t('Daftar tanya-jawab ({n})', { n: b.qa.length })}</h2><div class="qa-list">${b.qa.map((x, i) => `<div class="qa-row"><label class="field"><span>${t('Pertanyaan (satu per baris)')}</span><textarea class="textarea qa-q" rows="3">${esc(x.q.join('\n'))}</textarea></label><label class="field"><span>${t('Jawaban')}</span><textarea class="textarea qa-a" rows="3">${esc(x.a)}</textarea></label><button class="icon-btn" type="button" data-qadel="${i}" aria-label="${esc(t('Hapus'))}">${icon('trash')}</button></div>`).join('')}</div>
        <div class="toolbar"><button class="btn" type="button" id="addQA">${icon('plus')}${t('Tambah tanya-jawab')}</button></div>
        <details><summary>${t('Tempel banyak sekaligus (format T: / J:)')}</summary><textarea class="textarea" id="qaBulk" rows="6" placeholder="T: jam buka perpustakaan&#10;J: Perpustakaan buka pukul 07.00–15.00."></textarea><div class="toolbar"><button class="btn small" type="button" id="qaImport">${t('Tambahkan')}</button></div></details></div>
      <div class="toolbar"><button class="btn primary" type="button" id="bSave">${t('Simpan chatbot')}</button><button class="btn" type="button" id="bCancel">${t('Batal')}</button></div>`;
    const collect = () => {
      b.name = $('#bName').value.trim() || 'Chatbot';
      b.hue = +$('#bHue').value;
      b.persona = $('#bPersona').value;
      b.greeting = $('#bGreet').value.trim();
      b.fallback = $('#bFall').value.trim();
      b.useSkills = $('#bSkills').checked;
      b.useKB = $('#bKB').checked;
      b.qa = $$('.qa-row', el).map((r) => ({ q: $('.qa-q', r).value.split('\n').map((s) => s.trim()).filter(Boolean), a: $('.qa-a', r).value.trim() })).filter((x) => x.q.length && x.a);
    };
    $('#addQA').onclick = () => {
      collect();
      b.qa.push({ q: [''], a: '' });
      renderBotEditor(el);
      const rows = $$('.qa-q', el);
      rows[rows.length - 1].focus();
    };
    $('#qaImport').onclick = () => {
      collect();
      const add = N.bots.parseQAText($('#qaBulk').value);
      if (!add.length) return A().toast(t('Format belum dikenali. Awali pertanyaan dengan "T:" dan jawaban dengan "J:".'));
      b.qa.push(...add);
      renderBotEditor(el);
    };
    $$('[data-qadel]', el).forEach((d) => (d.onclick = () => {
      collect();
      b.qa.splice(+d.dataset.qadel, 1);
      renderBotEditor(el);
    }));
    $('#bSave').onclick = () => {
      collect();
      if (!b.qa.length) return A().toast(t('Isi minimal satu tanya-jawab.'));
      b.updated = Date.now();
      mem.set('bots', [b, ...mem.get('bots', []).filter((x) => x.id !== b.id)]);
      editing = null;
      N.bots.brainFor(b);
      renderBots();
      A().toast(t('Chatbot tersimpan.'));
    };
    $('#bCancel').onclick = () => {
      editing = null;
      renderBots();
    };
  }

  // ============================================================== KONEKSI
  async function renderConnections(params) {
    const el = $('#view-koneksi .page-in');
    const okApp = params && params.get('ok');
    if (params && params.get('err')) A().toast(params.get('err'));
    if (params && (okApp || params.get('err'))) history.replaceState(null, '', '#koneksi');
    const me = A().me;
    el.innerHTML = `<div class="page-head"><div class="grow"><h1>${t('Koneksi aplikasi')}</h1><p>${t('Sambungkan Galaxy ke aplikasi lain dengan izinmu. Kamu memberi izin langsung di halaman resmi tiap aplikasi, dan bisa memutusnya kapan saja. Token disimpan terenkripsi di server dan tidak pernah dibagikan.')}</p></div></div>
      ${N.net.mode === 'direct' ? `<div class="panel notice">${icon('globe')}<div class="grow"><b>${t('Butuh server Galaxy')}</b><p class="note">${t('Koneksi aplikasi, login Google, dan sinkron akun memakai server Galaxy. Isi alamat server di Pengaturan.')}</p></div><button class="btn primary" type="button" id="toSrv">${t('Pengaturan')}</button></div>` : !A().config.features.connectors ? `<div class="empty">${t('Koneksi aplikasi sedang dimatikan oleh developer.')}</div>` : !me ? `<div class="panel notice">${icon('user')}<div class="grow"><b>${t('Masuk dengan Google dulu')}</b><p class="note">${t('Koneksi aplikasi disimpan di akunmu, jadi perlu login.')}</p></div><button class="btn primary" type="button" data-go="akun">${t('Masuk')}</button></div>` : ''}
      <div class="app-grid" id="appGrid"><div class="empty">${t('Memuat…')}</div></div>
      <div id="appOut"></div>`;
    if (N.net.mode === 'direct') {
      $('#toSrv').onclick = () => settingsModal();
      $('#appGrid').innerHTML = '';
      return;
    }
    const list = await A().refreshApps();
    if (okApp) A().toast(t('{a} berhasil tersambung.', { a: (list.find((x) => x.id === okApp) || { name: okApp }).name }));
    const grid = $('#appGrid');
    grid.innerHTML = list.map((a) => `<div class="panel app-card ${a.connected ? 'on' : ''}"><div class="app-head"><span class="app-logo">${esc(a.name.charAt(0))}</span><div class="grow"><h2>${esc(a.name)}</h2><span class="dm">${a.connected ? t('Tersambung') + (a.account ? ' · ' + esc(a.account) : '') : !a.oauth ? t('Lewat impor/ekspor') : a.configured ? t('Belum tersambung') : t('Belum diatur developer')}</span></div></div>
      <ul class="perms">${(a.perms || []).map((p) => `<li>${esc(t(p))}</li>`).join('')}</ul>${a.note ? `<p class="note">${esc(t(a.note))}</p>` : ''}
      <div class="toolbar">${!a.oauth ? `<button class="btn small" type="button" data-send="${esc(t('buat 5 soal tentang tata surya'))}">${t('Buat kuis lalu ekspor')}</button>` : a.connected ? `<button class="btn small primary" type="button" data-try="${a.id}">${t('Coba')}</button><button class="btn small danger" type="button" data-dis="${a.id}">${t('Putuskan')}</button>` : `<button class="btn small primary" type="button" data-con="${a.id}" ${!a.configured || !me ? 'disabled' : ''}>${t('Izinkan & sambungkan')}</button>`}</div></div>`).join('');
    $$('[data-con]', grid).forEach((b) => (b.onclick = () => permissionModal(list.find((a) => a.id === b.dataset.con))));
    $$('[data-dis]', grid).forEach((b) => (b.onclick = async () => {
      await N.net.connect.disconnect(b.dataset.dis);
      A().toast(t('Koneksi diputus.'));
      renderConnections();
    }));
    $$('[data-try]', grid).forEach((b) => (b.onclick = () => tryApp(b.dataset.try)));
  }
  function permissionModal(app) {
    A().modal(`<h2>${t('Izinkan Galaxy terhubung ke {a}?', { a: esc(app.name) })}</h2><p>${t('Galaxy akan meminta izin berikut:')}</p><ul class="perms">${(app.perms || []).map((p) => `<li>${esc(t(p))}</li>`).join('')}</ul><p class="note">${t('Kamu akan diarahkan ke halaman resmi {a} untuk menyetujui. Galaxy tidak pernah melihat kata sandimu. Aksi yang memposting atas namamu selalu meminta konfirmasi lagi.', { a: esc(app.name) })}</p><div class="row-end"><button class="btn" type="button" data-close>${t('Batal')}</button><button class="btn primary" type="button" id="pmGo">${t('Lanjutkan ke {a}', { a: esc(app.name) })}</button></div>`, (m) => {
      $('#pmGo', m).onclick = async (e) => {
        e.target.disabled = true;
        try {
          await N.net.connect.start(app.id);
        } catch (err) {
          e.target.disabled = false;
          A().toast(err.message);
        }
      };
    });
  }
  const linkList = (items, fmt) => (items && items.length ? items.map(fmt).join('\n') : t('_Tidak ada data._'));
  async function tryApp(id) {
    const out = $('#appOut');
    const show = (md) => (out.innerHTML = `<div class="panel content">${N.md.render(md)}</div>`);
    const act = (a, p) => N.net.connect.act(id, a, p);
    try {
      if (id === 'googledrive') return driveModal((att) => {
        A().saveFile(att);
        A().go('obrolan');
        A().send(t('Ringkas berkas ini'), { atts: [att] });
      });
      if (id === 'googledocs') return show(t('Google Docs siap. Buat dokumen Word di obrolan/Studio, lalu tekan **Kirim ke Google Docs** pada kartunya.'));
      if (id === 'googlesheets') return show(t('Google Sheets siap. Buat tabel Excel di obrolan/Studio, lalu tekan **Kirim ke Google Sheets** pada kartunya.'));
      if (id === 'youtube') {
        const r = await act('search', { q: N.i18n.lang === 'en' ? 'science for kids' : 'belajar sains' });
        return show(linkList(r.items, (v, i) => `${i + 1}. [${v.title}](${v.url}) — ${v.channel}`));
      }
      if (id === 'spotify') {
        const r = await act('topTracks');
        return show(`**${t('Lagu teratasmu')}**\n\n` + linkList(r.items, (v, i) => `${i + 1}. [${v.title}](${v.url}) — ${v.artist}`));
      }
      if (id === 'strava') {
        const r = await act('activities');
        return show(`**${t('Aktivitas terakhir')}**\n\n` + linkList(r.items, (v) => `- ${v.name} · ${v.type} · ${v.km} km · ${v.minutes} ${t('menit')}`));
      }
      if (id === 'garmin') return show('```\n' + JSON.stringify(await act('summary'), null, 2) + '\n```');
      if (id === 'tiktok' || id === 'instagram') {
        const p = await act('profile');
        const m = await act(id === 'tiktok' ? 'videos' : 'media');
        return show(`**${esc(p.display_name || p.username || '')}**\n\n` + linkList(m.items, (v) => `- [${(v.title || v.caption || v.type || 'post').slice(0, 80)}](${v.url})`));
      }
      if (id === 'x' || id === 'threads') return postModal(id);
    } catch (e) {
      A().toast(e.message);
    }
  }
  function postModal(id, text = '') {
    const name = id === 'x' ? 'X' : 'Threads';
    A().modal(`<h2>${t('Posting ke {a}', { a: name })}</h2><textarea class="textarea" id="pst" rows="5" maxlength="${id === 'x' ? 280 : 500}">${esc(text)}</textarea><p class="note">${t('Postingan ini akan tampil publik di akunmu. Periksa dulu sebelum mengirim.')}</p><div class="row-end"><button class="btn" type="button" data-close>${t('Batal')}</button><button class="btn primary" type="button" id="pstGo">${t('Ya, posting sekarang')}</button></div>`, (m, close) => {
      $('#pstGo', m).onclick = async () => {
        const v = $('#pst', m).value.trim();
        if (!v) return;
        try {
          const r = await N.net.connect.act(id, 'post', { text: v, confirmed: true });
          close();
          A().toast(t('Terposting di {a}.', { a: name }) + (r.url ? ' ' + r.url : ''));
        } catch (e) {
          A().toast(e.message);
        }
      };
    });
  }
  /** Pilih berkas dari Google Drive (atau tempel link publik). */
  async function driveModal(onPick) {
    const st = A().appStatus('googledrive');
    const connected = st && st.connected;
    A().modal(`<h2>Google Drive</h2>${connected ? `<form class="toolbar" id="dvF"><input class="input" id="dvQ" placeholder="${esc(t('Cari nama berkas…'))}" style="flex:1"><button class="btn small">${t('Cari')}</button></form><div class="k-list" id="dvL"><p class="note">${t('Memuat…')}</p></div>` : `<p class="note">${t('Google Drive belum tersambung. Tempel link berkas yang dibagikan "siapa saja yang memiliki link", atau sambungkan Drive di menu Koneksi untuk berkas pribadi.')}</p>`}<label class="field"><span>${t('Atau tempel link Google Drive/Docs/Sheets publik')}</span><input class="input" id="dvU" type="url" placeholder="https://docs.google.com/..."></label><div class="row-end"><button class="btn" type="button" data-close>${t('Tutup')}</button><button class="btn primary" type="button" id="dvGo">${t('Pakai link')}</button></div>`, (m, close) => {
      const load = async (q) => {
        try {
          const r = await N.net.connect.act('googledrive', 'listFiles', { q });
          $('#dvL', m).innerHTML = r.files.length ? r.files.map((f) => `<button class="doc-item" type="button" data-fid="${esc(f.id)}" data-fn="${esc(f.name)}"><span class="dn">${esc(f.name)}</span><span class="dm">${esc((f.mimeType || '').split('.').pop())}</span></button>`).join('') : `<p class="note">${t('Tidak ada berkas.')}</p>`;
          $$('[data-fid]', m).forEach((b) => (b.onclick = async () => {
            b.disabled = true;
            try {
              const att = await N.files.fromDrive(b.dataset.fid, b.dataset.fn);
              close();
              onPick(att);
            } catch (e) {
              A().toast(e.message);
              b.disabled = false;
            }
          }));
        } catch (e) {
          $('#dvL', m).innerHTML = `<p class="note">${esc(e.message)}</p>`;
        }
      };
      if (connected) {
        load('');
        $('#dvF', m).onsubmit = (e) => {
          e.preventDefault();
          load($('#dvQ', m).value.trim());
        };
      }
      $('#dvGo', m).onclick = async () => {
        const u = $('#dvU', m).value.trim();
        if (!u) return;
        try {
          const att = await N.files.fromLink(u);
          att.kind = 'drive';
          close();
          onPick(att);
        } catch (e) {
          A().toast(e.message);
        }
      };
    });
  }
  /** Perintah obrolan untuk aplikasi tersambung. */
  async function appIntent(text, step) {
    const L = String(text || '').toLowerCase();
    const st = (id) => A().appStatus(id);
    const need = (id, name) => ({ text: t('{a} belum tersambung. Buka menu **Koneksi aplikasi** untuk memberi izin.', { a: name }), badge: name, chips: ['Buka Koneksi'] });
    const linkMd = (items, fmt) => linkList(items, fmt);
    try {
      if (/\bspotify\b/.test(L) || /\b(putar|putarkan|play)\s+lagu\b/.test(L)) {
        if (!st('spotify') || !st('spotify').connected) return need('spotify', 'Spotify');
        step(t('Menghubungi Spotify…'));
        if (/sedang (diputar|didengar)|now playing|lagi diputar/.test(L)) {
          const r = await N.net.connect.act('spotify', 'nowPlaying');
          return { text: r.title ? t('Sedang diputar: [{s}]({u}) — {a}', { s: r.title, u: r.url, a: r.artist }) : t('Tidak ada lagu yang sedang diputar.'), badge: 'Spotify', web: true };
        }
        if (/playlist/.test(L)) {
          const q = L.replace(/.*playlist\s*(tentang|berisi|lagu)?/, '').replace(/di spotify/, '').trim() || 'lagu santai';
          const r = await N.net.connect.act('spotify', 'createPlaylist', { name: 'Galaxy: ' + q, q });
          return { text: t('Playlist **{n}** dibuat berisi {k} lagu: [buka di Spotify]({u})', { n: r.title, k: r.tracks.length, u: r.url }), badge: 'Spotify', web: true };
        }
        if (/teratas|top|favorit/.test(L)) {
          const r = await N.net.connect.act('spotify', 'topTracks');
          return { text: `**${t('Lagu teratasmu')}**\n\n` + linkMd(r.items, (v, i) => `${i + 1}. [${v.title}](${v.url}) — ${v.artist}`), badge: 'Spotify', web: true };
        }
        const q = L.replace(/\b(cari(kan)?|putar(kan)?|play|lagu|di|spotify|dong|tolong)\b/g, ' ').replace(/\s+/g, ' ').trim();
        const r = await N.net.connect.act('spotify', 'search', { q });
        return { text: `**${t('Hasil Spotify')}: ${esc(q)}**\n\n` + linkMd(r.items, (v, i) => `${i + 1}. [${v.title}](${v.url}) — ${v.artist}`), badge: 'Spotify', web: true };
      }
      if (/\byoutube\b/.test(L)) {
        if (!st('youtube') || !st('youtube').connected) return need('youtube', 'YouTube');
        step(t('Mencari di YouTube…'));
        const q = L.replace(/\b(cari(kan)?|video|di|youtube|tentang|dong|tolong)\b/g, ' ').replace(/\s+/g, ' ').trim();
        const r = await N.net.connect.act('youtube', 'search', { q });
        return { text: `**YouTube: ${esc(q)}**\n\n` + linkMd(r.items, (v, i) => `${i + 1}. [${v.title}](${v.url}) — ${v.channel}`), badge: 'YouTube', web: true };
      }
      if (/\bstrava\b/.test(L)) {
        if (!st('strava') || !st('strava').connected) return need('strava', 'Strava');
        const r = await N.net.connect.act('strava', 'activities');
        const km = r.items.reduce((a, x) => a + x.km, 0);
        return { text: `**${t('Aktivitas Strava terakhir')}**\n\n` + linkMd(r.items, (v) => `- ${v.name} · ${v.type} · ${v.km} km · ${v.minutes} ${t('menit')}`) + `\n\n${t('Total {k} km dari {n} aktivitas.', { k: Math.round(km * 10) / 10, n: r.items.length })}`, badge: 'Strava', web: true };
      }
      if (/\bgarmin\b/.test(L)) {
        if (!st('garmin') || !st('garmin').connected) return need('garmin', 'Garmin');
        const r = await N.net.connect.act('garmin', 'summary');
        return { text: '```\n' + JSON.stringify(r, null, 2) + '\n```', badge: 'Garmin', web: true };
      }
      const post = text.match(/^(?:posting|post|kirim|tweet|unggah)\s+(?:ke|di|to)\s+(x|twitter|threads)\s*[:：-]?\s*([\s\S]+)$/i);
      if (post) {
        const id = /threads/i.test(post[1]) ? 'threads' : 'x';
        if (!st(id) || !st(id).connected) return need(id, id === 'x' ? 'X' : 'Threads');
        postModal(id, post[2].trim());
        return { text: t('Periksa postinganmu di jendela konfirmasi. Galaxy tidak memposting tanpa persetujuanmu.'), badge: id === 'x' ? 'X' : 'Threads' };
      }
      if (/\b(tiktok|instagram)\b/.test(L) && /\b(profil|akun|video|postingan|unggahan|statistik)\b/.test(L)) {
        const id = /tiktok/.test(L) ? 'tiktok' : 'instagram';
        if (!st(id) || !st(id).connected) return need(id, id === 'tiktok' ? 'TikTok' : 'Instagram');
        const p = await N.net.connect.act(id, 'profile');
        const m = await N.net.connect.act(id, id === 'tiktok' ? 'videos' : 'media');
        const stats = id === 'tiktok' ? t('{f} pengikut · {l} suka · {v} video', { f: fmtN(p.follower_count), l: fmtN(p.likes_count), v: fmtN(p.video_count) }) : t('{m} unggahan · akun {k}', { m: fmtN(p.media_count), k: p.account_type || '' });
        return { text: `**${esc(p.display_name || '@' + (p.username || ''))}**\n\n${stats}\n\n` + linkMd(m.items, (v) => `- [${(v.title || v.caption || v.type || 'post').slice(0, 80)}](${v.url})`), badge: id === 'tiktok' ? 'TikTok' : 'Instagram', web: true };
      }
    } catch (e) {
      return { text: e.message, badge: t('Koneksi'), unknown: true };
    }
    return null;
  }

  // =========================================================== PENGETAHUAN

      <div class="mem-grid">${[[list.length, t('dipelajari dari internet')], [N.knowledge.length, t('topik bawaan')], [(N.devKnowledge || []).length, t('dari developer')], [brain ? brain.learned.length : 0, t('dari kamu')]].map(([v, k]) => `<div class="stat"><span class="v">${fmtN(v)}</span><span class="k">${esc(k)}</span></div>`).join('')}</div>

    const inp = $('#wkQ');
    inp.oninput = () => {

      renderKnowledge();
    };

  // ================================================ PENGATURAN, MODEL, BAHASA
  function popover(anchor, html, onClick) {
    const pop = document.createElement('div');
    pop.className = 'model-pop';
    pop.setAttribute('role', 'menu');
    pop.innerHTML = html;
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + 'px';
    const top = r.top - pop.offsetHeight - 8;
    pop.style.top = (top > 8 ? top : Math.min(innerHeight - pop.offsetHeight - 8, r.bottom + 8)) + 'px';
    const close = () => {
      pop.remove();
      document.removeEventListener('pointerdown', outside, true);
    };
    const outside = (e) => !pop.contains(e.target) && e.target !== anchor && close();
    setTimeout(() => document.addEventListener('pointerdown', outside, true), 0);
    pop.onclick = (e) => {
      const b = e.target.closest('button');
      if (b) {
        onClick(b);
        close();
      }
    };
    pop.addEventListener('keydown', (e) => e.key === 'Escape' && (close(), anchor.focus()));
    const first = $('[aria-checked="true"]', pop) || $('button', pop);
    first && first.focus();
  }

  function typeInto(el, text, wrap) {
    const extras = $$('.chips, .actions, .think, .art-card', wrap);
    extras.forEach((e) => (e.style.visibility = 'hidden'));
    el.classList.add('typing');
    const step = Math.max(3, Math.ceil(text.length / 60));
    let n = 0;
    function frame() {
      n = Math.min(text.length, n + step);
      el.innerHTML = N.md.render(text.slice(0, n));
      scrollEnd();
      if (n < text.length) requestAnimationFrame(frame);
      else {
        el.classList.remove('typing');
        extras.forEach((e) => (e.style.visibility = ''));
        if (wrap.querySelector('.art-card')) revealMsg(wrap);

  /** Inti alur jawaban. */
  async function answer(text, chat, atts, step, opts) {
    const model = N.models.get(opts.model || curModel());
    const L = text.toLowerCase();
    const webOn = config.features.web && online && settings.web !== 'off';
    const bot = botOf(chat);
    // 0) chatbot buatan pengguna
    if (bot) {
      await N.bots.brainFor(bot);
      await waitBrain();
      return brain.respond(text, { chatId: chat.id, model: model.id, bot });
    }
    // 1) lampiran sebagai bahan
    if (atts.length) {
      const res = await fromAttachments(text, atts, model, step);
      if (res) return res;
    }
    // 1b) perintah ke aplikasi yang tersambung (Spotify, YouTube, Strava, ...)
    const viaApp = await N.views.appIntent(text, step);
    if (viaApp) return viaApp;
    // 2) program: game / website / aplikasi
    const req = config.features.studio !== false && N.apps.detect(text);
    if (req) return makeProgram(req, text, model, [], step);
    // 3) mesin lokal (hitung, pengetahuan bawaan, ingatan, kreasi, jadwal)
    await waitBrain(step);
    // perintah berbahasa lain (mis. "make a presentation about ...") diterjemahkan ke pola perintah Galaxy
    const cmd = N.i18n.lang !== 'id' ? N.i18n.command(text) : text;
    const r = brain.respond(cmd, { chatId: chat.id, model: model.id });
    // 4) kreasi yang butuh bahan dari internet
    if (webOn && r.art && (r.art.kind === 'pptx' || r.art.kind === 'docx') && !r.art.spec.known) return createFromWeb(r.art.kind, text, model, step, r);
    if (webOn && r.skill === 'kuis' && (!r.art || r.art.spec.questions.length < 3) && r.quizTopic) return quizFromWeb(r.quizTopic, r.quizN || 5, model, step);
    if (webOn && MAKE.test(L) && /\b(artikel|makalah|esai|essay|karya tulis|article|report|laporan tentang)\b/.test(L)) return createFromWeb('article', text, model, step);
    if (webOn && /\b(video)\b/.test(L) && r.art && r.art.kind === 'video' && r.art.spec.source === 'slides' && !(r.art.spec.slides || []).length) return createFromWeb('video', text, model, step);
    // 5) internet
    const plan = webOn ? N.research.plan(text, r, model, { web: settings.web }) : null;
    if (plan || (webOn && settings.web === 'on' && !r.skill && !r.art)) return fromWeb(plan || { mode: 'search', query: N.research.topicOf(text) }, text, model, step, r);
    if (r.unknown && !webOn) r.text += '\n\n' + t('_Pencarian internet sedang mati. Nyalakan lewat tombol Internet di bawah kotak pesan._');
    return r;
  }
  function waitBrain(step) {
    if (brain.ready) return Promise.resolve();
    step && step(t('Menyiapkan mesin bahasa…'));
    return new Promise((res) => {
      const off = brain.on((e) => {
        if (e.type === 'ready') {
          off();
          res();
        }
      });
    });
  }
  async function fromWeb(plan, text, model, step, r) {
    const think = (r && r.think) || [];
    try {
      if (plan.mode === 'read') {
        step(t('Membaca link…'));
        const out = await N.research.readLink(plan.url, plan.instruction, { model });
        if (plan.instruction && MAKE.test(plan.instruction)) return createFromMaterial(plan.instruction, out.material, model, step);
        return Object.assign(out, { web: true, think });
      }
      if (plan.mode === 'news') {
        step(t('Mengambil berita terbaru…'));
        return Object.assign(await N.research.news(plan.query), { web: true });
      }
      if (plan.mode === 'weather') {
        step(t('Mengecek cuaca…'));
        return Object.assign(await N.research.weather(plan.place), { web: true });
      }
      if (plan.mode === 'rates') {
        step(t('Mengecek kurs…'));
        return Object.assign(await N.research.rates(plan.text), { web: true });
      }
      const base = plan.augment && r && r.text && !r.unknown ? r.text : '';
      const out = await N.research.answer(text, { model, onStep: step, base });
      out.think = [...(r && !r.unknown ? (r.think || []).slice(0, 3) : []), ...(out.think || [])];
      if (out.unknown && r && !r.unknown && r.text) return r;
      return Object.assign(out, { web: true });
    } catch (e) {
      if (r && !r.unknown) return Object.assign(r, { text: r.text + `\n\n_${t('Info internet tidak tersedia: {e}', { e: e.message })}_` });
      return { text: t('Saya belum bisa menjawab karena internet tidak tersedia: {e}', { e: e.message }), badge: t('Internet'), unknown: true, think };
    }
  }
  const topicIn = (text) => {
    const m = String(text).match(/\b(?:tentang|mengenai|bertema|soal|materi|about|on)\s+(.+?)(?:\s+(?:dalam|di|ke|sebanyak|dengan|berisi|warna|tema|format|untuk)\b.*)?$/i);
    return (m ? m[1] : N.research.topicOf(text.replace(MAKE, ' ').replace(/\b(presentasi|slide|powerpoint|pptx|dokumen|word|docx|artikel|makalah|esai|video|laporan|kuis|soal)\b/gi, ' '))).replace(/[.?!]+$/, '').trim();
  };
  const themeOf = (L) => (/biru|blue/.test(L) ? 'biru' : /jingga|oranye|orange/.test(L) ? 'jingga' : /ungu|purple/.test(L) ? 'ungu' : /gelap|hitam|dark/.test(L) ? 'gelap' : 'hijau');
  async function createFromWeb(kind, text, model, step, r) {
    const topic = topicIn(text);
    step(t('Meriset "{x}" di internet…', { x: topic }));
    const mat = await N.research.material(topic, { model, onStep: step });
    if (!mat.text) return r || { text: t('Saya tidak menemukan bahan tentang **{x}** di internet.', { x: topic }), unknown: true };
    return createFromMaterial(text, { title: topic, text: mat.text, sources: mat.sources, image: mat.image }, model, step, kind, mat.think);
  }
  async function quizFromWeb(topic, n, model, step) {
    step(t('Meriset "{x}" untuk membuat soal…', { x: topic }));
    const mat = await N.research.material(topic, { model, onStep: step });
    const qz = N.compose.quiz(topic, mat.text, n);
    if (!qz.questions.length) return { text: t('Bahan tentang **{x}** belum cukup untuk membuat soal.', { x: topic }), unknown: true };
    return { text: t('Ini **{n} soal** tentang **{x}**, disusun dari {s} sumber internet. Jawab langsung di kartu, jadikan game, unduh Word, atau ekspor ke Quizlet.', { n: qz.questions.length, x: topic, s: mat.sources.length }) + sourcesMd(mat.sources), badge: t('Kuis'), skill: 'kuis', art: { kind: 'quiz', spec: qz }, web: true, think: mat.think };
  }
  const sourcesMd = (src) => (src && src.length ? `\n\n**${t('Sumber')}:**\n` + src.slice(0, 8).map((s, i) => `${i + 1}. [${String(s.title).replace(/[[\]]/g, '').slice(0, 100)}](${s.url})`).join('\n') : '');
  /** Buat sesuatu dari bahan (riset, link, atau berkas). */
  async function createFromMaterial(instruction, mat, model, step, forceKind, think) {
    const L = String(instruction || '').toLowerCase();
    const title = (mat.title || topicIn(instruction) || 'Galaxy').slice(0, 80);
    const kind = forceKind || (/\b(presentasi|slide|powerpoint|ppt)\b/.test(L) ? 'pptx' : /\b(kuis|soal|quiz|quizlet)\b/.test(L) ? 'quiz' : /\b(video)\b/.test(L) ? 'video' : /\b(word|docx|dokumen|laporan|makalah)\b/.test(L) ? 'docx' : /\b(website|situs|web)\b/.test(L) ? 'web' : /\b(game|permainan)\b/.test(L) ? 'game' : /\b(artikel|esai|article)\b/.test(L) ? 'article' : 'summary');
    step && step(t('Menyusun {k}…', { k: t({ pptx: 'presentasi', quiz: 'soal', video: 'video', docx: 'dokumen', web: 'website', game: 'game', article: 'artikel', summary: 'ringkasan' }[kind]) }));
    const src = sourcesMd(mat.sources);
    const tier = model.tier;
    if (kind === 'pptx') {
      const spec = N.compose.presentation(title, mat.text, { theme: themeOf(L), max: tier >= 3 ? 14 : tier === 1 ? 7 : 10, sources: mat.sources || [] });
      return { text: t('Presentasi **{x}** berisi **{n} slide**, disusun Galaxy dari bahan yang ada. Unduh sebagai PowerPoint (.pptx) atau jadikan video.', { x: spec.title, n: spec.slides.length }) + src, badge: t('Presentasi'), skill: 'kreasi', art: { kind: 'pptx', spec }, web: !!(mat.sources && mat.sources.length), think };
    }
    if (kind === 'docx') {
      const spec = N.compose.document(title, mat.text, { kind: /laporan/.test(L) ? 'laporan' : 'artikel', sources: mat.sources || [], author: brain && brain.memory.name });
      return { text: t('Dokumen **{x}** siap. Unduh sebagai Word (.docx) atau kirim ke Google Docs.', { x: spec.title }) + src, badge: 'Word', skill: 'kreasi', art: { kind: 'docx', spec }, web: !!(mat.sources && mat.sources.length), think };
    }
    if (kind === 'quiz' || kind === 'game') {
      const qz = N.compose.quiz(title, mat.text, tier >= 3 ? 10 : 6);
      if (kind === 'game' && qz.questions.length) {
        const g = N.apps.generate({ kind: 'game', id: 'quiz', name: '', topic: title }, { questions: qz.questions });
        return { text: t('Game kuis **{x}** dengan {n} soal dari bahanmu. Tekan **Jalankan** untuk bermain.', { x: title, n: qz.questions.length }) + src, badge: 'Game', skill: 'kreasi', art: { kind: 'code', spec: g }, think };
      }
      if (!qz.questions.length) return { text: t('Bahannya belum cukup untuk dibuat soal.'), unknown: true };
      return { text: t('{n} soal dari bahan **{x}**.', { n: qz.questions.length, x: title }) + src, badge: t('Kuis'), skill: 'kuis', art: { kind: 'quiz', spec: qz }, think };
    }
    if (kind === 'video') {
      const pres = N.compose.presentation(title, mat.text, { theme: themeOf(L), max: tier >= 3 ? 10 : 7 });
      const secs = Math.max(4, Math.min(60, +(L.match(/(\d+)\s*(?:detik|seconds?|s\b)/) || [])[1] || pres.slides.length * 4));
      const spec = { kind: 'video', source: 'slides', slides: pres.slides, theme: pres.theme, seconds: secs, title: t('Video') + ': ' + pres.title };
      return { text: t('Video **{x}** ({s} detik) siap direkam dari {n} slide. Tekan **Rekam video**.', { x: pres.title, s: secs, n: pres.slides.length }) + src, badge: t('Video'), skill: 'kreasi', art: { kind: 'video', spec }, think };
    }
    if (kind === 'web') {
      const req = N.apps.detect(instruction) || { kind: 'web', id: 'info', color: null, dark: null, name: '', topic: title };
      return makeProgram(Object.assign(req, { topic: req.topic || title }), instruction, model, [], step, mat);
    }
    if (kind === 'article') {
      const md = N.compose.article(title, mat.text, mat.sources || []);
      const spec = N.compose.document(title, mat.text, { sources: mat.sources || [], author: brain && brain.memory.name });
      return { text: md + `\n\n_${t('Artikel ini diringkas Galaxy dari sumber di atas. Periksa kembali sebelum dipakai.')}_`, badge: t('Artikel'), skill: 'kreasi', art: { kind: 'docx', spec }, web: !!(mat.sources && mat.sources.length), think };
    }
    const sm = N.compose.summarize(mat.text, tier >= 3 ? 10 : tier === 1 ? 4 : 7, instruction);
    return { text: `**${esc(title)}**\n\n${sm.sents.map((s) => '- ' + s).join('\n')}\n\n**${t('Kata kunci')}:** ${sm.keywords.slice(0, 8).join(', ')}` + src, badge: t('Ringkasan'), think };
  }
  async function fromAttachments(text, atts, model, step) {
    const L = text.toLowerCase();
    const images = atts.filter((a) => a.kind === 'image');
    const textual = atts.filter((a) => a.text);
    const req = N.apps.detect(text);
    if (req) {
      const imgs = [];
      for (const a of images) imgs.push(await N.files.largeImage(a));
      const mat = textual.length ? { title: textual[0].name, text: N.files.textOf(textual), sources: [] } : null;
      return makeProgram(req, text, model, imgs, step, mat);
    }
    if (images.length && /\b(video|slideshow|tayangan)\b/.test(L)) {
      const photos = [];
      for (const a of images) photos.push(await N.files.largeImage(a));
      const secs = Math.max(4, Math.min(60, +(L.match(/(\d+)\s*(?:detik|seconds?)/) || [])[1] || images.length * 3));
      const cap = (text.match(/\b(?:berjudul|judul|caption)\s+["“]?([^"”]+)["”]?/i) || [])[1] || '';
      return { text: t('Video dari {n} foto ({s} detik) siap direkam.', { n: images.length, s: secs }), badge: t('Video'), skill: 'kreasi', art: { kind: 'video', spec: { kind: 'video', source: 'photos', photos, seconds: secs, caption: cap, title: cap || t('Video foto') } } };
    }
    if (images.length && /\b(presentasi|slide)\b/.test(L) && !textual.length) {
      const photos = [];
      for (const a of images) photos.push(await N.files.largeImage(a));
      const title = topicIn(text) || t('Album foto');
      const slides = [{ type: 'title', title, subtitle: new Date().toLocaleDateString() }, ...images.map((a, i) => ({ title: a.name.replace(/\.\w+$/, ''), bullets: [t('Foto {n}', { n: i + 1 })], image: photos[i] })), { type: 'end', title: t('Terima kasih'), subtitle: '' }];
      return { text: t('Presentasi dari {n} foto.', { n: images.length }), badge: t('Presentasi'), skill: 'kreasi', art: { kind: 'pptx', spec: { kind: 'pptx', title, theme: themeOf(L), footer: 'Galaxy AI', slides, known: true } } };
    }
    if (textual.length && MAKE.test(L)) {
      const mat = { title: textual.length === 1 ? textual[0].name.replace(/\.\w+$/, '') : topicIn(text) || t('Bahan'), text: N.files.textOf(textual), sources: textual.filter((a) => a.url).map((a) => ({ title: a.name, url: a.url })) };
      return createFromMaterial(text, mat, model, step);
    }
    if (textual.length && text && !/^(ringkas|rangkum|apa isi|isi|jelaskan|summar)/i.test(L)) {
      // pertanyaan tentang isi lampiran
      const all = N.files.textOf(textual);
      const sm = N.compose.summarize(all, model.tier >= 3 ? 8 : 5, text);
      return { text: `${t('Dari lampiran')}:\n\n${sm.sents.map((s) => '- ' + s).join('\n')}`, badge: t('Lampiran'), think: [{ k: t('Lampiran'), v: textual.map((a) => a.name).join(', ') }] };
    }
    if (!text || /^(ringkas|rangkum|apa isi|isi|jelaskan|summar|analisis|analyze|apa ini|gambar apa)/i.test(L)) {
      return { text: atts.map((a) => N.files.describe(a)).join('\n\n---\n\n') + `\n\n_${t('Coba: "buat presentasi dari berkas ini", "buat 5 soal dari berkas ini", "buat website dengan foto ini", atau "buat video dari foto-foto ini".')}_`, badge: t('Lampiran') };
    }
    return null;
  }
  async function makeProgram(req, text, model, images, step, material) {
    let mat = material || null;
    let questions = null;
    const needsTopic = (req.kind === 'web' && (req.id === 'info' || req.id === 'blog') && req.topic) || (req.kind === 'game' && req.id === 'quiz' && req.topic);
    if (needsTopic && !mat && config.features.web && online && settings.web !== 'off') {
      step && step(t('Meriset "{x}" untuk isinya…', { x: req.topic }));
      try {
        const m = await N.research.material(req.topic, { model, onStep: step });
        if (m.text) mat = { title: req.topic, text: m.text, sources: m.sources, image: m.image };
      } catch (e) {}
    }
    if (req.kind === 'game' && req.id === 'quiz') {
      const src = mat ? N.compose.quiz(req.topic || mat.title, mat.text, model.tier >= 3 ? 12 : 8) : N.content.quiz(brain, req.topic || '', 8, Date.now() % 997);
      questions = src.questions;
    }
    step && step(t('Menulis kode…'));
    const g = N.apps.generate(req, { images, material: mat, questions });
    const lines = [`**${g.title}** · ${g.langName}`];
    if (req.generic) lines.push('', `_${t('Jenis yang tersedia')}: ${Object.values(N.apps.LIST[req.kind]).map((x) => t(x)).join(', ')}._`);
    if (g.explain.length) lines.push('', `**${t('Isi program')}:**`, ...g.explain.map((e, i) => `${i + 1}. ${e}`));
    if (images.length) lines.push('', t('{n} foto unggahanmu dipakai di dalamnya.', { n: images.length }));
    lines.push('', `**${t('Cara menjalankan')}:** ${g.run}`);
    if (mat && mat.sources && mat.sources.length) lines.push(sourcesMd(mat.sources));
    return { text: lines.join('\n'), badge: { game: 'Game', app: t('Aplikasi'), web: 'Website' }[req.kind], skill: 'kreasi', art: { kind: 'code', spec: g }, web: !!(mat && mat.sources && mat.sources.length) };
  }

  // ------------------------------------------------------------------ modal
  function modal(html, onMount) {
    const root = $('#modalRoot');
    const prevFocus = document.activeElement;
    root.innerHTML = `<div class="modal-back" id="mBack"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
    const back = $('#mBack');
    const close = () => {
      root.innerHTML = '';
      if (prevFocus && prevFocus.focus) prevFocus.focus();
    };
    back.addEventListener('mousedown', (e) => e.target === back && close());
    back.addEventListener('keydown', (e) => e.key === 'Escape' && close());
    $$('[data-close]', back).forEach((b) => (b.onclick = close));
    onMount && onMount($('.modal', back), close);
    const f = $('input, textarea, select, button', $('.modal', back));
    f && f.focus();
    return close;
  }
  function copyText(text, fallbackEl) {
    try {
      navigator.clipboard.writeText(text).then(() => toast(t('Disalin.')), fb);
    } catch (e) {
      fb();
    }
    function fb() {
      if (fallbackEl && fallbackEl.select) {
        fallbackEl.focus();
        fallbackEl.select();
        toast(t('Teks sudah dipilih. Tekan Ctrl+C untuk menyalin.'));
      } else toast(t('Gagal menyalin.'));
    }
  }
  function downloadFile(filename, data, mime = 'application/octet-stream') {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  }

  // ------------------------------------------------------------------ navigasi
  const VIEWS = ['obrolan', 'projek', 'studio', 'tugas', 'chatbot', 'koneksi', 'pengetahuan', 'akun'];
  const TITLES = { obrolan: 'Obrolan', projek: 'Projek', studio: 'Studio', tugas: 'Tugas & notifikasi', chatbot: 'Chatbot', koneksi: 'Koneksi aplikasi', pengetahuan: 'Pengetahuan', akun: 'Akun & privasi' };
  function go(v) {
    const base = String(v).split('?')[0];
    if (location.hash.slice(1).split('?')[0] !== base) {
      try {
        history.replaceState(null, '', '#' + v);
      } catch (e) {
        location.hash = v;
      }
    }
    showView(v);
  }
  function showView(raw) {
    let [v, qs] = String(raw || '').split('?');
    if (!VIEWS.includes(v)) v = 'obrolan';
    for (const x of VIEWS) $('#view-' + x).hidden = x !== v;
    const pg = $('#view-' + v);
    if (pg && pg.classList.contains('page')) pg.scrollTop = 0;
    $$('#nav a').forEach((a) => (a.dataset.view === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
    $('#topTitle').textContent = t(TITLES[v]);
    const params = new URLSearchParams(qs || '');
    if (v === 'projek') N.views.renderProjects(params.get('id'));
    if (v === 'studio') N.views.renderStudio();
    if (v === 'tugas') N.views.renderTasks();
    if (v === 'chatbot') N.views.renderBots();
    if (v === 'koneksi') N.views.renderConnections(params);
    if (v === 'pengetahuan') N.views.renderKnowledge();
    if (v === 'akun') N.views.renderAccount();
    closeNav();
  }
  function closeNav() {
    $('#app').classList.remove('nav-open');
    $('#scrim').hidden = true;
  }

  // ------------------------------------------------------------------ peristiwa
  function bind() {
    $('#newChat').onclick = () => newChat();
    $('#topNew').onclick = () => newChat();
    $('#menuBtn').onclick = () => {
      $('#app').classList.add('nav-open');
      $('#scrim').hidden = false;
    };
    $('#scrim').onclick = closeNav;
    $('#openSettings').onclick = () => N.views.settingsModal();
    $('#langBtn').onclick = (e) => N.views.langMenu(e.currentTarget);
    $('#themeToggle').onclick = () => {
      settings.theme = { auto: 'light', light: 'dark', dark: 'auto' }[settings.theme];
      saveSettings();
      applyTheme();
    };
    $$('.bell').forEach((b) => (b.onclick = () => N.views.openBell()));
    $('#acctBtn').onclick = () => go('akun');
    $('#modelBtn').onclick = (e) => N.views.modelMenu(e.currentTarget);
    $('#webBtn').onclick = () => {
      settings.web = { auto: 'on', on: 'off', off: 'auto' }[settings.web] || 'auto';
      saveSettings();
      renderModelBtn();
      toast(t({ auto: 'Galaxy mencari di internet bila perlu.', on: 'Galaxy selalu mencari di internet untuk pertanyaan.', off: 'Pencarian internet dimatikan.' }[settings.web]));
    };
    $('#attachBtn').onclick = (e) => attachMenu(e.currentTarget);
    $('#fileIn').onchange = (e) => {
      addFiles([...e.target.files]);
      e.target.value = '';
    };
    $('#histSearch').oninput = renderHistory;
    $('#history').addEventListener('click', (e) => {
      const del = e.target.closest('[data-del]');
      if (del) {
        e.stopPropagation();
        return deleteChat(del.dataset.del);
      }
      const it = e.target.closest('[data-id]');
      if (it) openChat(it.dataset.id);
    });
    $('#history').addEventListener('keydown', (e) => {
      const it = e.target.closest('[data-id]');
      if (it && (e.key === 'Enter' || e.key === ' ') && e.target === it) {
        e.preventDefault();
        openChat(it.dataset.id);
      }
    });
    $$('#nav a').forEach((a) => (a.onclick = (e) => {
      e.preventDefault();
      go(a.dataset.view);
    }));
    window.addEventListener('hashchange', () => showView(location.hash.slice(1)));
    const input = $('#input');
    const grow = () => {
      input.style.height = 'auto';
      input.style.height = Math.min(220, input.scrollHeight) + 'px';
      updateSendBtn();
    };
    input.addEventListener('input', grow);
    let draftT;
    input.addEventListener('input', () => {
      clearTimeout(draftT);
      draftT = setTimeout(() => {
        try {
          localStorage.setItem('galaxy.draft', input.value);
        } catch (e) {}
      }, 400);
    });
    try {
      const d = localStorage.getItem('galaxy.draft');
      if (d) {
        input.value = d;
        grow();
      }
    } catch (e) {}
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        $('#composer').requestSubmit();
      }
    });
    input.addEventListener('paste', (e) => {
      const files = [...(e.clipboardData ? e.clipboardData.files : [])];
      if (files.length) {
        e.preventDefault();
        addFiles(files);
      }
    });
    const comp = $('.composer-wrap');
    comp.addEventListener('dragover', (e) => {
      e.preventDefault();
      comp.classList.add('drag');
    });
    comp.addEventListener('dragleave', () => comp.classList.remove('drag'));
    comp.addEventListener('drop', (e) => {
      e.preventDefault();
      comp.classList.remove('drag');
      if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]);
    });
    $('#composer').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = input.value;
      if ((!v.trim() && !pending.length) || busy || pending.some((a) => a.busy)) return;
      input.value = '';
      try {
        localStorage.removeItem('galaxy.draft');
      } catch (er) {}
      grow();
      send(v);
    });
    $('#attachRow').addEventListener('click', (e) => {
      const b = e.target.closest('[data-rm]');
      if (b) {
        pending = pending.filter((a) => a.id !== b.dataset.rm);
        renderPending();
      }
    });
    document.addEventListener('click', (e) => {
      const s = e.target.closest('[data-send]');
      if (s) {
        go('obrolan');
        return send(s.dataset.send);
      }
      const gv = e.target.closest('[data-go]');
      if (gv) return go(gv.dataset.go);
      const pj = e.target.closest('[data-proj]');
      if (pj) return go('projek?id=' + pj.dataset.proj);
      const sp = e.target.closest('.spoiler');
      if (sp) return sp.classList.toggle('open');
      const cp = e.target.closest('[data-copy]');
      if (cp && current) return copyText(N.md.plain(current.msgs[+cp.dataset.copy].t));
      const dp = e.target.closest('[data-deep]');
      if (dp && current) {
        const m = current.msgs[+dp.dataset.deep];
        dp.disabled = true;
        return send(m.meta.q, { model: 'quasar-max', silentUser: true, atts: [] });
      }
      const ag = e.target.closest('[data-again]');
      if (ag && current) {
        const m = current.msgs[+ag.dataset.again];
        return send(m.meta.q, { silentUser: true, atts: [] });
      }
    });
    $('#thread').addEventListener('art-change', () => {
      if (current) {
        current.updated = Date.now();
        saveChats();
      }
    });
    addEventListener('online', () => checkOnline());
    addEventListener('offline', () => {
      online = false;
      renderStatus();
    });
  }

  async function checkOnline() {
    if (N.net.mode === 'direct') online = navigator.onLine !== false;
    else {
      try {
        await N.net.api('/api/config', { timeout: 8000 });
        online = true;
      } catch (e) {
        online = false;
      }
    }
    renderStatus();
  }
  /** CSS tambahan dari portal developer (disisipkan sebagai <style>, tidak bisa berisi skrip). */
  async function loadCustomCss() {
    if (N.net.mode === 'direct' || !config.hasCustomCss) return;
    try {
      const r = await fetch(N.net.url('/api/custom.css'), { credentials: 'omit' });
      if (!r.ok) return;
      const st = document.createElement('style');
      st.id = 'customCss';
      st.textContent = (await r.text()).replace(/<\/?\s*style/gi, '');
      document.head.appendChild(st);
    } catch (e) {}
  }
  /** Kembali dari halaman izin aplikasi: selesaikan koneksi dengan kode klaim (hanya bisa oleh akun yang memulai). */
  async function finishConnect() {
    const h = location.hash.slice(1);
    if (!/^koneksi\?/.test(h)) return;
    const qs = new URLSearchParams(h.split('?')[1]);
    if (!qs.get('claim')) return;
    try {
      const app = await N.net.connect.finish(qs.get('state'), qs.get('claim'));
      history.replaceState(null, '', '#koneksi?ok=' + encodeURIComponent(app));
    } catch (e) {
      history.replaceState(null, '', '#koneksi?err=' + encodeURIComponent(e.message));
    }
  }

  /** Data berubah dari perangkat lain (sinkron akun). */
  function onRemote(keys) {
    const has = (k) => keys.includes(k);
    if (brain) brain.reload();
    if (has('settings')) {
      loadSettings();
      applyTheme();
      renderModelBtn();
    }
    if (has('chats')) {
      chats = mem.get('chats', []);
      const id = current ? current.id : mem.get('context', {}).chatId;
      current = chats.find((c) => c.id === id) || null;
      if (!busy) renderThread();
      renderHistory();
    }
    if (has('learned') && brain) brain.train(null, false, 'sinkron').then(renderStatus);
    if (has('notifs') || has('tasks')) N.views.updateBell();
    const v = location.hash.slice(1).split('?')[0];
    if ((has('projects') || has('files')) && v === 'projek') N.views.renderProjects();
    if (has('creations') && v === 'studio') N.views.renderStudio();
    if (has('tasks') && v === 'tugas') N.views.renderTasks();
    if (has('bots') && v === 'chatbot') N.views.renderBots();
    if (has('webcache') && v === 'pengetahuan') N.views.renderKnowledge();
  }

  async function refreshApps() {
    try {
      apps = await N.net.connect.list();
    } catch (e) {
      apps = config.apps || [];
    }
    return apps;
  }
  const appStatus = (id) => apps.find((a) => a.id === id) || (config.apps || []).find((a) => a.id === id) || null;

  // ------------------------------------------------------------------ mulai
  async function start() {
    $('.brand').insertAdjacentHTML('afterbegin', LOGO);
    for (const el of $$('[data-icon]')) el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon));
    N.app = {
      get brain() {
        return brain;
      },
      get config() {
        return config;
      },
      get me() {
        return me;
      },
      get settings() {
        return settings;
      },
      mem, send, toast, icon, cssVar, modal, go, newChat, openChat, downloadFile, copyText, setModel, chatWithBot, appStatus, refreshApps, saveSettings, applyTheme, renderModelBtn, renderStatus, renderHistory, renderThread, onRemote, addFiles, addLink, saveFile,
      currentModel: curModel,
      /** Jawab tanpa menulis ke obrolan (dipakai Studio & tugas terjadwal). */
      ask: (text, step, model) => answer(text, { id: 'bg', msgs: [] }, [], step || (() => {}), { model }),
      createFromMaterial: (ins, mat, step) => createFromMaterial(ins, mat, N.models.get(curModel()), step || (() => {})),
      reloadChats: () => {
        chats = mem.get('chats', []);
        renderHistory();
      },
      setLang: (code) => {
        settings.lang = code;
        saveSettings();
        N.i18n.set(code);
      },
    };
    // 1) mode (server sama-asal / server lain / mandiri), konfigurasi situs & bahasa
    await N.net.init();
    const offlineCfg = (web) => ({ name: 'Galaxy AI', features: { web, uploads: true, connectors: false, googleLogin: false, studio: true, tasks: true, chatbot: true, projects: true }, apps: [], defaultLang: 'id', defaultModel: 'nova-pro' });
    if (N.net.mode === 'direct') {
      config = offlineCfg(true);
      online = navigator.onLine !== false;
    } else {
      try {
        config = await N.net.api('/api/config', { timeout: 10000 });
        online = true;
      } catch (e) {
        online = false;
        config = offlineCfg(false);
      }
    }
    loadCustomCss();
    document.title = config.name || 'Galaxy AI';
    $('#siteName').textContent = config.name || 'Galaxy AI';
    $('#siteTag').textContent = config.tagline || '';
    try {
      const packs = online && config.langs && config.langs.length ? (await N.net.api('/api/i18n')).packs : {};
      for (const [code, dict] of Object.entries(packs)) N.i18n.add(code, dict, dict.$name);
    } catch (e) {}
    // 2) memori & akun
    await mem.init();
    await N.views.lockIfNeeded();
    loadSettings();
    N.i18n.set(settings.lang || config.defaultLang || 'id');
    N.i18n.onChange(() => {
      renderThread();
      renderHistory();
      renderModelBtn();
      renderStatus();
      $('#topTitle').textContent = t(TITLES[location.hash.slice(1).split('?')[0]] || 'Obrolan');
      showView(location.hash.slice(1) || 'obrolan');
      N.views.renderAcctChip();
    });
    if (config.announcement) {
      const a = $('#announce');
      a.hidden = false;
      a.innerHTML = `<span>${N.md.render(config.announcement).replace(/^<p>|<\/p>$/g, '')}</span><button class="icon-btn" type="button" aria-label="${esc(t('Tutup'))}">${icon('x')}</button>`;
      $('button', a).onclick = () => (a.hidden = true);
    }
    if (config.maintenance) toast(config.maintenanceText || t('Galaxy AI sedang diperbarui.'));
    chats = mem.get('chats', []);
    const ctx = mem.get('context', {});
    current = chats.find((c) => c.id === ctx.chatId) || null;
    // 3) pengetahuan developer
    if (online && N.net.mode !== 'direct') {
      try {
        N.devKnowledge = (await N.net.api('/api/knowledge')).items || [];
      } catch (e) {}
    }
    brain = new N.Brain();
    const net = N.models.get(curModel()).net;
    if (net !== 'seimbang') brain.wantNets = new Set([net]);
    applyTheme();
    bind();
    N.i18n.apply();
    renderHistory();
    renderThread();
    renderModelBtn();
    showView(location.hash.slice(1) || 'obrolan');
    mem.on((ev) => {
      if (ev.type === 'status') {
        renderStatus();
        N.views.renderAcctChip();
      }
      if (ev.type === 'remote') onRemote(ev.keys || []);
    });
    renderStatus();
    N.views.updateBell();
    // 4) login Google & sinkron
    if (online && N.net.mode !== 'direct') {
      try {
        me = await N.net.auth.me();
      } catch (e) {
        me = null;
      }
      await finishConnect();
      await mem.connectServer(me);
      await refreshApps();
    }
    N.views.renderAcctChip();
    // halaman yang bergantung pada status login digambar ulang setelah status diketahui
    const v0 = location.hash.slice(1).split('?')[0];
    if (v0 === 'koneksi' || v0 === 'akun') showView(location.hash.slice(1));
    // 5) mesin bahasa (dilatih diam-diam sekali, lalu diingat)
    await brain.train(null, false, 'awal');
    renderStatus();
    N.views.startScheduler();
    const bot = botOf(current);
    if (bot) N.bots.brainFor(bot);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
