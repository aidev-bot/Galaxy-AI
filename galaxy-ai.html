    { id: 'newton_tokoh', c: 'Tokoh', t: 'Isaac Newton', k: ['isaac newton', 'newton tokoh'], q: ['siapa isaac newton', 'penemuan isaac newton'], a: '**Sir Isaac Newton** (1643–1727) adalah ilmuwan Inggris yang merumuskan **hukum gravitasi universal** dan **tiga hukum gerak**, dalam bukunya *Principia* (1687). Ia juga mengembangkan kalkulus, meneliti cahaya (cahaya putih terdiri dari berbagai warna), dan membuat teleskop pantul.' },
    { id: 'einstein', c: 'Tokoh', t: 'Albert Einstein', k: ['albert einstein', 'einstein', 'teori relativitas', 'e mc2'], q: ['siapa einstein', 'apa itu e sama dengan mc kuadrat'], a: '**Albert Einstein** (1879–1955) adalah fisikawan kelahiran Jerman yang terkenal dengan **teori relativitas** dan rumus **E = mc²** (energi setara dengan massa dikali kuadrat kecepatan cahaya). Ia meraih **Hadiah Nobel Fisika 1921** atas penjelasan efek fotolistrik.' },
    { id: 'galileo', c: 'Tokoh', t: 'Galileo Galilei', k: ['galileo', 'galileo galilei'], q: ['siapa galileo', 'penemu teleskop'], a: '**Galileo Galilei** (1564–1642) adalah ilmuwan Italia yang dijuluki **bapak sains modern**. Ia menyempurnakan teleskop dan mengamati bulan-bulan Jupiter, fase Venus, serta kawah di Bulan. Pengamatannya mendukung teori bahwa Bumi mengelilingi Matahari (heliosentris).' },
    { id: 'curie', c: 'Tokoh', t: 'Marie Curie', k: ['marie curie', 'curie', 'radioaktivitas'], q: ['siapa marie curie', 'penemu radium'], a: '**Marie Curie** (1867–1934) adalah ilmuwan kelahiran Polandia yang meneliti **radioaktivitas** dan menemukan unsur **polonium** dan **radium**. Ia orang pertama yang meraih **dua Hadiah Nobel** di bidang berbeda: Fisika (1903) dan Kimia (1911).' },
    { id: 'edison', c: 'Tokoh', t: 'Thomas Alva Edison', k: ['thomas alva edison', 'edison', 'penemu lampu'], q: ['siapa penemu lampu pijar', 'penemuan thomas edison'], a: '**Thomas Alva Edison** (1847–1931) adalah penemu Amerika yang mengembangkan **bola lampu pijar** yang praktis dan tahan lama (1879), **fonograf** (alat perekam suara), dan kamera film awal. Ia memegang lebih dari 1.000 paten.' },
    { id: 'darwin', c: 'Tokoh', t: 'Charles Darwin', k: ['charles darwin', 'darwin', 'teori evolusi', 'seleksi alam'], q: ['siapa charles darwin', 'apa itu seleksi alam'], a: '**Charles Darwin** (1809–1882) adalah naturalis Inggris yang mengemukakan teori **evolusi melalui seleksi alam** dalam bukunya *On the Origin of Species* (1859). Menurut seleksi alam, makhluk hidup yang sifatnya paling sesuai dengan lingkungan lebih mungkin bertahan hidup dan menurunkan sifatnya.' },
    { id: 'mendel', c: 'Tokoh', t: 'Gregor Mendel', k: ['gregor mendel', 'mendel'], q: ['siapa gregor mendel'], a: '**Gregor Johann Mendel** (1822–1884) adalah biarawan dan ilmuwan Austria yang dijuluki **Bapak Genetika**. Melalui percobaan persilangan **kacang ercis** (*Pisum sativum*), ia menemukan hukum-hukum dasar pewarisan sifat.' },
    { id: 'fleming', c: 'Tokoh', t: 'Alexander Fleming', k: ['alexander fleming', 'penisilin', 'antibiotik'], q: ['siapa penemu penisilin', 'apa itu antibiotik'], a: '**Alexander Fleming** (1881–1955) adalah ilmuwan Skotlandia yang menemukan **penisilin** pada tahun 1928 dari jamur *Penicillium*. Penisilin adalah **antibiotik** pertama, yaitu obat untuk membunuh bakteri. Antibiotik tidak mempan untuk penyakit akibat virus seperti flu.' },
    { id: 'tokoh_penemu', c: 'Tokoh', t: 'Penemu terkenal', k: ['penemu telepon', 'penemu pesawat terbang', 'penemu mesin cetak', 'penemu listrik', 'penemu'], q: ['siapa penemu telepon', 'siapa penemu pesawat', 'siapa penemu radio', 'siapa penemu internet'],
      a: '| Penemuan | Penemu | Tahun |\n|---|---|---|\n| Mesin cetak | Johannes Gutenberg | ±1440 |\n| Mesin uap (disempurnakan) | James Watt | 1769 |\n| Telepon | Alexander Graham Bell | 1876 |\n| Lampu pijar praktis | Thomas Alva Edison | 1879 |\n| Radio | Guglielmo Marconi | ±1895 |\n| Pesawat terbang bermotor | Wright bersaudara | 1903 |\n| Penisilin | Alexander Fleming | 1928 |\n| World Wide Web | Tim Berners-Lee | 1989 |\n\nListrik tidak "ditemukan" satu orang. Tokoh pentingnya antara lain Benjamin Franklin, Michael Faraday, dan Nikola Tesla.' },

    { id: 'tips_belajar', c: 'Belajar', t: 'Tips belajar efektif', k: ['tips belajar', 'cara belajar efektif', 'belajar efektif', 'teknik pomodoro', 'cara belajar'], q: ['bagaimana cara belajar yang baik', 'cara cepat paham pelajaran', 'tips agar nilai bagus', 'cara belajar untuk ujian'],
      a: 'Tips belajar efektif yang didukung penelitian:\n1. **Teknik Pomodoro**: belajar fokus 25 menit, istirahat 5 menit. Setelah 4 kali, istirahat panjang.\n2. **Active recall**: tutup buku lalu coba ingat atau tulis ulang. Ini lebih efektif daripada membaca berulang.\n3. **Spaced repetition**: ulangi materi dengan jeda (besok, 3 hari lagi, seminggu lagi).\n4. **Jelaskan dengan kata-katamu sendiri**, seolah mengajari teman.\n5. **Latihan soal** dari berbagai tipe.\n6. **Tidur cukup**, karena otak menyimpan ingatan saat tidur.\n7. **Jauhkan HP** saat belajar.' },
    { id: 'fokus', c: 'Belajar', t: 'Cara fokus', k: ['cara fokus', 'konsentrasi', 'sulit fokus'], q: ['tips fokus belajar', 'agar fokus saat belajar', 'bagaimana agar fokus belajar', 'aku tidak bisa konsentrasi', 'cara mengatasi malas belajar', 'malas belajar'],
      a: 'Cara meningkatkan fokus dan melawan malas:\n- Mulai dari tugas kecil selama 5 menit saja. Biasanya setelah mulai, rasa malas berkurang.\n- Simpan HP di ruangan lain atau aktifkan mode jangan ganggu.\n- Siapkan tempat belajar yang rapi dan terang.\n- Tentukan target jelas, misalnya "selesaikan 10 soal", bukan "belajar matematika".\n- Beri hadiah kecil setelah selesai.\n- Cukup tidur, minum air, dan bergerak atau olahraga ringan.' },
    { id: 'menghafal', c: 'Belajar', t: 'Cara menghafal', k: ['cara menghafal', 'teknik menghafal', 'jembatan keledai', 'mnemonik'], q: ['bagaimana cara cepat menghafal', 'tips menghafal materi'],
      a: 'Teknik menghafal:\n- **Jembatan keledai (mnemonik)**: buat singkatan lucu. Contoh: urutan planet "Mereka Veni Buat Makan Jus Sayur Untuk Nenek".\n- **Peta konsep (mind map)**: gambar hubungan antarkonsep.\n- **Kartu hafalan (flashcard)**: pertanyaan di depan, jawaban di belakang.\n- **Pengulangan berjarak**: ulangi besok, lusa, lalu minggu depan.\n- **Hubungkan dengan cerita atau gambar** di kepala.\n- **Ucapkan keras-keras** atau ajarkan ke orang lain.' },

      a: 'Pedoman **Isi Piringku** (Kemenkes) untuk sekali makan:\n- **Makanan pokok** (nasi, jagung, ubi): sekitar 1/3 piring.\n- **Lauk pauk** (ikan, telur, tempe, tahu, daging): sekitar 1/6 piring.\n- **Sayuran**: sekitar 1/3 piring.\n- **Buah-buahan**: sekitar 1/6 piring.\n\nZat gizi utama: **karbohidrat** (sumber energi), **protein** (pertumbuhan dan perbaikan sel), **lemak** (cadangan energi), **vitamin dan mineral** (mengatur fungsi tubuh), dan **air**. Batasi gula, garam, dan lemak.' },

    { id: 'tidur', c: 'Kesehatan', t: 'Tidur cukup', k: ['tidur', 'jam tidur', 'manfaat tidur', 'kurang tidur', 'begadang'], q: ['berapa jam tidur yang baik untuk remaja', 'bahaya begadang', 'berapa lama tidur anak sekolah'],
      a: 'Anjuran lama tidur:\n- Anak usia 6–12 tahun: **9–12 jam**.\n- Remaja 13–18 tahun: **8–10 jam**.\n- Dewasa: **7–9 jam**.\n\nKurang tidur membuat sulit konsentrasi, mudah lupa, gampang emosi, dan daya tahan tubuh menurun. Tips: tidur dan bangun di jam yang sama, matikan layar HP sekitar 1 jam sebelum tidur, dan hindari minuman berkafein di malam hari.' },
    { id: 'olahraga', c: 'Kesehatan', t: 'Olahraga', k: ['olahraga', 'manfaat olahraga', 'aktivitas fisik'], q: ['manfaat olahraga bagi tubuh', 'berapa lama olahraga yang dianjurkan'], a: 'Anak dan remaja dianjurkan melakukan aktivitas fisik minimal **60 menit setiap hari**, misalnya bersepeda, berlari, bermain bola, atau berenang. Manfaatnya: jantung dan paru-paru lebih kuat, tulang dan otot sehat, berat badan ideal, tidur lebih nyenyak, suasana hati lebih baik, dan konsentrasi belajar meningkat.' },

    { id: 'cuci_tangan', c: 'Kesehatan', t: 'Cuci tangan', k: ['cuci tangan', 'langkah cuci tangan', 'mencuci tangan'], q: ['cara cuci tangan yang benar', 'kapan harus cuci tangan'], a: 'Cuci tangan dengan **sabun dan air mengalir** selama sekitar **20 detik**:\n1. Basahi tangan, lalu beri sabun.\n2. Gosok kedua telapak tangan.\n3. Gosok punggung tangan dan sela-sela jari.\n4. Gosok telapak dengan jari saling mengunci.\n5. Gosok ibu jari secara memutar.\n6. Gosok ujung jari dan kuku di telapak tangan.\n7. Bilas, lalu keringkan.\n\nLakukan sebelum makan, setelah dari toilet, setelah bermain, dan setelah batuk atau bersin.' },
    { id: 'demam_berdarah', c: 'Kesehatan', t: 'Demam berdarah', k: ['demam berdarah', 'dbd', '3m plus', 'nyamuk aedes'], q: ['cara mencegah demam berdarah', 'apa itu 3m plus', 'gejala demam berdarah'], a: '**Demam berdarah dengue (DBD)** disebabkan virus dengue yang ditularkan nyamuk ***Aedes aegypti***. Gejalanya demam tinggi mendadak, nyeri otot, dan bintik merah di kulit. Segera periksa ke dokter jika muncul gejala.\n\nPencegahan dengan **3M Plus**: **Menguras** tempat air, **Menutup** tempat penampungan air, **Mendaur ulang** barang bekas yang bisa menampung air, **plus** memakai lotion antinyamuk, memasang kelambu, dan menanam tanaman pengusir nyamuk.' },
    { id: 'p3k', c: 'Kesehatan', t: 'Pertolongan pertama', k: ['p3k', 'pertolongan pertama', 'luka bakar', 'mimisan'], q: ['cara mengobati luka bakar ringan', 'pertolongan pertama mimisan', 'isi kotak p3k'],
      a: 'Pertolongan pertama sederhana:\n- **Luka gores**: bersihkan dengan air mengalir, beri antiseptik, lalu tutup plester.\n- **Luka bakar ringan**: aliri air bersih bersuhu biasa (bukan es) selama 10–20 menit. Jangan oles pasta gigi atau mentega.\n- **Mimisan**: duduk condong ke depan, pencet cuping hidung sekitar 10 menit. Jangan mendongak.\n- **Pingsan**: baringkan di tempat teduh, longgarkan pakaian, angkat kaki sedikit lebih tinggi.\n\nUntuk kondisi serius, segera minta bantuan orang dewasa atau hubungi layanan darurat **112**.' },

      return b;
    }
    function postfix() {
      let v = primary();
      for (;;) {
        if (isOp('!')) { p++; v = A.fact(v); }
        else if (isOp('%')) { p++; v = A.percent(v); }
        else break;
      }
      return v;
    }
    function primary() {
      const k = toks[p++];
      if (!k) throw new Error('Ekspresi tidak lengkap');
      if (k.t === 'num') return A.num(k.v);
      if (k.t === 'const') return A.num(CONSTS[k.v]);
      if (k.t === 'var') return A.variable(k.v);
      if (k.t === 'fn') {
        let arg;
        if (isOp('(')) { p++; arg = expr(); if (!isOp(')')) throw new Error('Kurung tidak seimbang'); p++; }
        else arg = power();
        return A.fn(k.v, arg);
      }
      if (k.t === 'op' && k.v === '(') {
        const v = expr();
        if (!isOp(')')) throw new Error('Kurung tidak seimbang');
        p++;
        return v;
      }
      throw new Error('Simbol tak terduga: ' + k.v);
    }
    const v = expr();
    if (p < toks.length) throw new Error('Simbol berlebih: ' + toks[p].v);
    return v;
  }

  function factorial(n) {
    if (n < 0 || !Number.isInteger(n)) return NaN;
    if (n > 170) return Infinity;
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }
  const NUMALG = {
    num: (v) => v, variable: () => { throw new Error('var'); }, add: (a, b) => a + b, sub: (a, b) => a - b,
    mul: (a, b) => a * b, div: (a, b) => a / b, mod: (a, b) => ((a % b) + b) % b, neg: (a) => -a,
    pow: (a, b) => Math.pow(a, b), fact: factorial, percent: (a) => a / 100, fn: (f, a) => FUNCS[f](a),
  };

  function evaluate(expr) {
    return parse(lex(expr, false), NUMALG);
  }

  function calcPrep(raw) {
    let s = ' ' + raw.toLowerCase() + ' ';
    s = s.replace(/\?+/g, ' ').replace(/(?<![\d)\s])!+/g, ' ').replace(/(^|\s)!+/g, ' ').replace(/×|·/g, '*').replace(/÷/g, '/').replace(/√/g, ' akar ').replace(/∛/g, ' cbrt ');
    s = s.replace(/²/g, '^2').replace(/³/g, '^3').replace(/π/g, ' pi ');
    s = s.replace(/(\d|\))\s*:\s*(?=[\d(])/g, '$1/');
    s = s.replace(/\bakar\s+pangkat\s+(\d+|dua|tiga|empat)\s+(?:dari\s+)?(\d+(?:[.,]\d+)?|\([^)]*\))/g, (_, n, x) => {
      const k = { dua: 2, tiga: 3, empat: 4 }[n] || n;
      return ` (${x})^(1/${k}) `;
    });
    s = s.replace(/\bakar\s+kuadrat\s+(?:dari\s+)?/g, ' akar ').replace(/\bakar\s+dari\s+/g, ' akar ');
    s = s.replace(/(\d+(?:[.,]\d+)?)\s*(?:%|persen)\s*(?:dari|x|\*)\s*/g, '($1/100)*');
    s = s.replace(/\bpangkat\s+(dua|tiga)\b/g, (_, w) => (w === 'dua' ? '^2' : '^3')).replace(/\bkuadrat\b/g, '^2').replace(/\bkubik\b/g, '^3');
    const words = [
      [/\b(?:ditambah|ditambahkan|tambah|plus|dan)\b/g, '+'],
      [/\b(?:dikurangi|dikurang|kurang|minus)\b/g, '-'],
      [/\b(?:dikalikan|dikali|kali|perkalian)\b/g, '*'],
      [/\b(?:dibagi|bagi)\b/g, '/'],
      [/\bpangkat\b/g, '^'],
      [/\b(?:faktorial)\b/g, '!'],
      [/\b(?:sisa bagi|modulo)\b/g, ' mod '],
      [/\bpersen\b/g, '%'],
      [/\bderajat\b/g, ' '],
    ];
    for (const [re, r] of words) s = s.replace(re, r);
    s = s.replace(/(\d)\s*x\s*(?=[\d(])/g, '$1*');
    const filler = /\b(?:diskon|potongan|harga|berapakah|berapa|hitunglah|hitung|hasil|hasilnya|dari|nilai|tolong|coba|dong|ya|sama dengan|adalah|itu|jawab|jawabannya|kalkulasi|kalkulator|tentukan|cari|carilah|sih|nya|kah|deh|bang|kak|pak|bu)\b/g;
    s = s.replace(filler, ' ').replace(/=\s*$/, ' ').replace(/=/g, ' ');
    return s.replace(/\s+/g, ' ').trim();
  }

  const calc = {
    id: 'kalkulator',
    name: 'Kalkulator',
    run(raw) {
      const expr = calcPrep(raw);
      if (!expr || !/\d/.test(expr)) return null;
      if (!/[+\-*/^!%()]|\b(?:sqrt|akar|cbrt|sin|cos|tan|asin|acos|atan|log|ln|exp|mutlak|abs|mod|bulat)\b/.test(expr)) return null;
      if (/^-?\d+(?:[.,]\d+)?$/.test(expr)) return null;
      if (!/^[0-9a-zπ+\-*/^()!%.,\s]+$/.test(expr)) return null;
      let val;
      try { val = evaluate(expr); } catch (e) { return null; }
      if (typeof val !== 'number' || Number.isNaN(val)) {
        return { badge: 'Kalkulator', text: `Hasil \`${expr}\` tidak terdefinisi. Mungkin ada pembagian dengan nol, akar dari bilangan negatif, atau tan 90°.` };
      }
      if (!Number.isFinite(val)) return { badge: 'Kalkulator', text: `Hasil \`${expr}\` tak hingga (∞). Mungkin ada pembagian dengan nol.` };
      const shown = expr.replace(/\*/g, ' × ').replace(/\//g, ' ÷ ').replace(/\s+/g, ' ').replace(/\b(sqrt|akar)\b\s*/g, '√').replace(/\bcbrt\b\s*/g, '∛').replace(/\bpi\b/g, 'π');
      const r = round(val, 10);
      let text = `\`${shown}\` = **${fmt(r, 10)}**`;
      const fr = expr.includes('/') ? fracText(r) : null;
      if (fr) text += `\n\nDalam bentuk pecahan: **${fr}**`;
      if (/\b(sin|cos|tan)\b/.test(expr)) text += '\n\n_Sudut dihitung dalam derajat._';
      if (/diskon/.test(raw.toLowerCase())) {
        const m = raw.toLowerCase().match(/(\d+(?:[.,]\d+)?)\s*%[^\d]*(\d[\d.,]*)/);
        if (m) {
          const pct = parseNumber(m[1]);
          const base = parseNumber(m[2]);
          text = `Potongan ${fmt(pct)}% dari ${fmt(base)} = **${fmt(base * pct / 100)}**\n\nHarga setelah diskon = ${fmt(base)} − ${fmt(base * pct / 100)} = **${fmt(base - base * pct / 100)}**`;
        }
      }
      return { badge: 'Kalkulator', text, steps: [`Ekspresi dikenali: ${expr}`, `Diurai dengan parser rekursif (tanpa eval)`, `Hasil: ${fmt(r, 10)}`] };
    },
  };

  // ===========================================================================
  // 3. PERSAMAAN (aljabar polinomial derajat ≤ 2)
  // ===========================================================================
  // Polinomial: Map dari "monomial" (huruf variabel terurut, mis. "", "x", "xx", "xy") ke koefisien
  const P = {
    c: (v) => new Map([['', v]]),
    clean(p) { for (const [k, v] of p) if (Math.abs(v) < 1e-12) p.delete(k); return p; },
    add(a, b) { const r = new Map(a); for (const [k, v] of b) r.set(k, (r.get(k) || 0) + v); return P.clean(r); },
    neg(a) { const r = new Map(); for (const [k, v] of a) r.set(k, -v); return r; },
    sub(a, b) { return P.add(a, P.neg(b)); },
    mul(a, b) {
      const r = new Map();
      for (const [ka, va] of a) for (const [kb, vb] of b) {
        const k = (ka + kb).split('').sort().join('');
        if (k.length > 8) throw new Error('Derajat terlalu tinggi');
        r.set(k, (r.get(k) || 0) + va * vb);
      }
      return P.clean(r);
    },
    isConst(a) { return [...a.keys()].every((k) => k === ''); },
    val(a) { return a.get('') || 0; },
    deg(a) { let d = 0; for (const k of a.keys()) d = Math.max(d, k.length); return d; },
    vars(a) { const s = new Set(); for (const k of a.keys()) for (const ch of k) s.add(ch); return s; },
  };
  const POLYALG = {
    num: (v) => P.c(v), variable: (x) => new Map([[x, 1]]), add: P.add, sub: P.sub, mul: P.mul, neg: P.neg,
    div(a, b) {
      if (!P.isConst(b)) throw new Error('Variabel di penyebut belum didukung');
      const d = P.val(b);
      if (d === 0) throw new Error('Pembagian dengan nol');
      return P.mul(a, P.c(1 / d));
    },
    mod(a, b) { if (P.isConst(a) && P.isConst(b)) return P.c(NUMALG.mod(P.val(a), P.val(b))); throw new Error('mod variabel'); },
    pow(a, b) {
      if (!P.isConst(b)) throw new Error('Pangkat variabel belum didukung');
      const n = P.val(b);
      if (P.isConst(a)) return P.c(Math.pow(P.val(a), n));
      if (!Number.isInteger(n) || n < 0 || n > 8) throw new Error('Pangkat harus bilangan bulat kecil');
      let r = P.c(1);
      for (let i = 0; i < n; i++) r = P.mul(r, a);
      return r;
    },
    fact(a) { if (P.isConst(a)) return P.c(factorial(P.val(a))); throw new Error('faktorial variabel'); },
    percent(a) { return P.mul(a, P.c(0.01)); },
    fn(f, a) { if (P.isConst(a)) return P.c(FUNCS[f](P.val(a))); throw new Error('Fungsi variabel belum didukung'); },
  };

  function nfmt(x) {
    const r = round(x, 9);
    const f = fracText(r);
    return f ? `${f} (≈ ${fmt(r, 4)})` : fmt(r, 6);
  }
  const coefStr = (v, first) => {
    const a = Math.abs(round(v, 9));
    const sign = v < 0 ? (first ? '−' : ' − ') : first ? '' : ' + ';
    const f = fracText(a);
    return { sign, abs: f || fmt(a, 6), one: a === 1 };
  };
  function polyStr(p) {
    const keys = [...p.keys()].sort((a, b) => b.length - a.length || a.localeCompare(b));
    if (!keys.length) return '0';
    let s = '';
    keys.forEach((k, i) => {
      const c = coefStr(p.get(k), i === 0);
      let mono = '';
      const counts = {};
      for (const ch of k) counts[ch] = (counts[ch] || 0) + 1;
      for (const ch of Object.keys(counts).sort()) mono += ch + (counts[ch] > 1 ? sup(counts[ch]) : '');
      s += c.sign + (mono ? (c.one ? '' : c.abs) + mono : c.abs);
    });
    return s;
  }

  function extractEquations(raw) {
    let s = raw.toLowerCase().replace(/[?]/g, ' ').replace(/×|·/g, '*').replace(/÷/g, '/').replace(/²/g, '^2').replace(/³/g, '^3').replace(/−/g, '-');
    s = s.replace(/(\d)\s*x\s+(?=\d)/g, '$1*'); // "3 x 4" berarti kali
    const parts = s.split(/\s+dan\s+|;|\n|,\s+(?=[^,]*=)/);
    const eqs = [];
    for (let part of parts) {
      if (!part.includes('=')) continue;
      // kata (≥2 huruf) yang bukan fungsi menjadi pemisah; ambil potongan yang memuat "="
      part = part.replace(/[a-z]{2,}/g, (w) => (FUNCS[w] || w === 'pi' ? w : '|')).replace(/[:]/g, '|');
      part = part.split('|').find((seg) => seg.includes('=')) || '';
      const sides = part.split('=');
      if (sides.length !== 2) return null;
      const [L, R] = sides.map((x) => x.trim());
      if (!L || !R) return null;
      if (!/^[0-9a-z+\-*/^().,\s!%]+$/.test(L + R)) return null;
      if (/^[a-z]$/.test(L) && /^-?[\d.,]+$/.test(R)) continue; // hanya pemberian nilai, mis. "g = 10"
      eqs.push([L, R]);
    }
    return eqs.length ? eqs : null;
  }

  const equation = {
    id: 'persamaan',
    name: 'Penyelesai persamaan',
    run(raw) {
      if (!raw.includes('=')) return null;
      const eqs = extractEquations(raw);
      if (!eqs) return null;
      let polys;
      try {
        polys = eqs.map(([L, R]) => {
          const pl = parse(lex(L, true), POLYALG);
          const pr = parse(lex(R, true), POLYALG);
          return { L, R, pl, pr, d: P.sub(pl, pr) };
        });
      } catch (e) {
        if (/var|Derajat|Pangkat|penyebut|Fungsi/.test(e.message) && /[a-z]/.test(eqs.flat().join('')))
          return { badge: 'Persamaan', text: `Maaf, bentuk persamaan ini belum bisa saya selesaikan (${e.message.toLowerCase()}). Saya bisa menyelesaikan persamaan linear, persamaan kuadrat satu variabel, dan sistem dua persamaan linear.` };
        return null;
      }
      const vars = new Set();
      for (const p of polys) for (const v of P.vars(p.d)) vars.add(v);
      for (const p of polys) for (const v of P.vars(P.add(p.pl, p.pr))) vars.add(v);
      if (vars.size === 0) {
        if (polys.length !== 1) return null;
        const { L, R, pl, pr } = polys[0];
        const ok = Math.abs(P.val(pl) - P.val(pr)) < 1e-9;
        return { badge: 'Persamaan', text: `${L} = ${fmt(round(P.val(pl), 9))}, sedangkan ${R} = ${fmt(round(P.val(pr), 9))}.\n\nJadi pernyataan itu **${ok ? 'benar' : 'salah'}**.` };
      }
      const V = [...vars].sort((a, b) => (a === 'x' ? -1 : b === 'x' ? 1 : a.localeCompare(b)));
      if (polys.length === 1 && V.length === 1) return solveSingle(polys[0], V[0]);
      if (polys.length === 2 && V.length === 2 && polys.every((p) => P.deg(p.d) <= 1)) return solveSystem(polys, V);
      return { badge: 'Persamaan', text: `Persamaan ini punya ${V.length} variabel (${V.join(', ')}) dan ${polys.length} persamaan. Saat ini saya bisa menyelesaikan satu persamaan dengan satu variabel (linear atau kuadrat), atau dua persamaan linear dengan dua variabel.` };
    },
  };

  function solveSingle({ L, R, pl, pr, d }, x) {
    const deg = P.deg(d);
    const a2 = d.get(x + x) || 0;
    const a1 = d.get(x) || 0;
    const a0 = d.get('') || 0;
    const steps = [`Persamaan: ${L} = ${R}`, `Sederhanakan: ${polyStr(pl)} = ${polyStr(pr)}`];
    const lines = [`**Persamaan:** \`${L} = ${R}\``, '', '**Langkah penyelesaian:**'];
    if (deg === 0) {
      const ok = Math.abs(a0) < 1e-12;
      lines.push(`1. Sederhanakan kedua ruas: ${polyStr(pl)} = ${polyStr(pr)}`);
      lines.push(`2. Variabel ${x} hilang dan tersisa ${ok ? 'pernyataan yang selalu benar' : 'pernyataan yang salah'}.`);
      lines.push('', ok ? `**Semua nilai ${x} memenuhi** (identitas).` : '**Tidak ada penyelesaian.**');
      return { badge: 'Persamaan', text: lines.join('\n'), steps };
    }
    if (deg >= 3) {
      if (N.mathplus) return N.mathplus.polyRoots(d, x, L, R, pl, pr);
      return { badge: 'Persamaan', text: 'Persamaan berderajat 3 atau lebih belum bisa saya selesaikan.' };
    }
    if (deg === 1) {
      const sol = -a0 / a1;
      const kx = coefStr(a1, true);
      lines.push(`1. Sederhanakan kedua ruas: \`${polyStr(pl)} = ${polyStr(pr)}\``);
      lines.push(`2. Kumpulkan suku ${x} di ruas kiri dan konstanta di ruas kanan: \`${kx.sign}${kx.one ? '' : kx.abs}${x} = ${nfmt(-a0).split(' (')[0]}\``);
      if (Math.abs(a1 - 1) > 1e-12) lines.push(`3. Bagi kedua ruas dengan ${pn(a1)}: \`${x} = ${nfmt(-a0).split(' (')[0]} ÷ ${pn(a1)}\``);
      lines.push('', `**${x} = ${nfmt(sol)}**`);
      const chk = check(pl, pr, x, sol);
      if (chk) lines.push('', `Cek: ${chk}`);
      steps.push(`Persamaan linear: ${polyStr(d)} = 0`, `${x} = ${nfmt(sol)}`);
      return { badge: 'Persamaan linear', text: lines.join('\n'), steps };
    }
    // kuadrat
    let A = a2, B = a1, C = a0;
    if (A < 0) { A = -A; B = -B; C = -C; }
    const D = B * B - 4 * A * C;
    const quad = polyStr(new Map([[x + x, A], [x, B], ['', C]].filter(([, v]) => Math.abs(v) > 1e-12)));
    lines.push(`1. Ubah ke bentuk umum ax² + bx + c = 0: \`${quad} = 0\``);
    lines.push(`2. Koefisien: a = ${fmt(round(A, 9))}, b = ${fmt(round(B, 9))}, c = ${fmt(round(C, 9))}`);
    lines.push(`3. Diskriminan: D = b² − 4ac = ${pn(B)}² − 4 × ${pn(A)} × ${pn(C)} = **${fmt(round(D, 9))}**`);
    if (D < -1e-12) {
      const re = -B / (2 * A);
      const im = Math.sqrt(-D) / (2 * A);
      lines.push('4. Karena D < 0, persamaan **tidak punya akar real**.', '', `Akar kompleksnya: ${x} = ${fmt(round(re, 6) || 0)} ± ${fmt(round(im, 6))}i`);
      return { badge: 'Persamaan kuadrat', text: lines.join('\n'), steps };
    }
    const sq = Math.sqrt(Math.max(0, D));
    const r1 = (-B + sq) / (2 * A);
    const r2 = (-B - sq) / (2 * A);
    lines.push(`4. Rumus ABC: ${x} = (−b ± √D) / 2a = (${fmt(round(-B, 9))} ± √${fmt(round(D, 9))}) / ${fmt(round(2 * A, 9))}`);
    if (Math.abs(D) < 1e-12) {
      lines.push('', `Karena D = 0, akarnya kembar: **${x} = ${nfmt(r1)}**`);
    } else {
      lines.push('', `**${x}₁ = ${nfmt(r1)}** dan **${x}₂ = ${nfmt(r2)}**`);
      if (Number.isInteger(round(r1, 9)) && Number.isInteger(round(r2, 9)) && Math.abs(A - 1) < 1e-12) {
        const f = (r) => (r >= 0 ? `(${x} − ${fmt(round(r, 9))})` : `(${x} + ${fmt(round(-r, 9))})`);
        lines.push('', `Bentuk faktornya: \`${f(r2)}${f(r1)} = 0\``);
      }
    }
    steps.push(`Persamaan kuadrat, D = ${fmt(round(D, 6))}`, `Akar: ${nfmt(r1)}, ${nfmt(r2)}`);
    return { badge: 'Persamaan kuadrat', text: lines.join('\n'), steps };
  }

  function evalPoly(p, env) {
    let s = 0;
    for (const [k, v] of p) {
      let t = v;
      for (const ch of k) t *= env[ch];
      s += t;
    }
    return s;
  }
  function check(pl, pr, x, sol) {
    const l = evalPoly(pl, { [x]: sol });
    const r = evalPoly(pr, { [x]: sol });
    if (Math.abs(l - r) > 1e-6) return null;
    return `ruas kiri = ${fmt(round(l, 6))} dan ruas kanan = ${fmt(round(r, 6))}. ✔️ Sama.`;
  }

  function solveSystem(polys, [x, y]) {
    const co = polys.map((p) => ({ a: p.d.get(x) || 0, b: p.d.get(y) || 0, c: -(p.d.get('') || 0), src: `${p.L} = ${p.R}` }));
    const [e1, e2] = co;
    const D = e1.a * e2.b - e2.a * e1.b;
    const lines = ['**Sistem persamaan:**', `- (1) \`${e1.src}\``, `- (2) \`${e2.src}\``, '', '**Bentuk umum** ax + by = c:'];
    const form = (e) => polyStr(P.clean(new Map([[x, e.a], [y, e.b]]))) + ' = ' + fmt(round(e.c, 9));
    lines.push(`- (1) \`${form(e1)}\``, `- (2) \`${form(e2)}\``, '');
    if (Math.abs(D) < 1e-12) {
      const dep = Math.abs(e1.a * e2.c - e2.a * e1.c) < 1e-9 && Math.abs(e1.b * e2.c - e2.b * e1.c) < 1e-9;
      lines.push(dep ? '**Tak hingga banyak penyelesaian**, karena kedua persamaan sebenarnya sama (garisnya berimpit).' : '**Tidak ada penyelesaian**, karena kedua garis sejajar.');
      return { badge: 'SPLDV', text: lines.join('\n') };
    }
    const sx = (e1.c * e2.b - e2.c * e1.b) / D;
    const sy = (e1.a * e2.c - e2.a * e1.c) / D;
    lines.push('**Metode determinan (Cramer):**');
    lines.push(`- D = a₁b₂ − a₂b₁ = ${pn(e1.a)} × ${pn(e2.b)} − ${pn(e2.a)} × ${pn(e1.b)} = ${fmt(round(D, 9))}`);
    lines.push(`- ${x} = (c₁b₂ − c₂b₁) / D = ${fmt(round(e1.c * e2.b - e2.c * e1.b, 9))} / ${pn(D)}`);
    lines.push(`- ${y} = (a₁c₂ − a₂c₁) / D = ${fmt(round(e1.a * e2.c - e2.a * e1.c, 9))} / ${pn(D)}`);
    lines.push('', `**${x} = ${nfmt(sx)}** dan **${y} = ${nfmt(sy)}**`);
    const ok = polys.every((p) => Math.abs(evalPoly(p.pl, { [x]: sx, [y]: sy }) - evalPoly(p.pr, { [x]: sx, [y]: sy })) < 1e-6);
    if (ok) lines.push('', 'Cek: kedua persamaan terpenuhi. ✔️');
    return { badge: 'SPLDV', text: lines.join('\n'), steps: ['Dua persamaan linear, dua variabel', `D = ${fmt(D)}`, `${x} = ${nfmt(sx)}, ${y} = ${nfmt(sy)}`] };
  }

  // ===========================================================================
  // 4. TABEL PERIODIK & MASSA MOLEKUL
  // ===========================================================================

    { name: 'Hukum Ohm', vars: ['Vt', 'I', 'R'], rel: { Vt: ['{I} × {R}', (x) => x.I * x.R], I: ['{Vt} ÷ {R}', (x) => x.Vt / x.R], R: ['{Vt} ÷ {I}', (x) => x.Vt / x.I] } },

    { name: 'Energi listrik', vars: ['We', 'Pd', 't'], rel: { We: ['{Pd} × {t}', (x) => x.Pd * x.t], Pd: ['{We} ÷ {t}', (x) => x.We / x.t], t: ['{We} ÷ {Pd}', (x) => x.We / x.Pd] } },
    { name: 'Cepat rambat gelombang', vars: ['vw', 'lam', 'f'], rel: { vw: ['{lam} × {f}', (x) => x.lam * x.f], lam: ['{vw} ÷ {f}', (x) => x.vw / x.f], f: ['{vw} ÷ {lam}', (x) => x.vw / x.lam] } },
    { name: 'Frekuensi getaran', vars: ['f', 'n', 't'], rel: { f: ['{n} ÷ {t}', (x) => x.n / x.t], n: ['{f} × {t}', (x) => x.f * x.t], t: ['{n} ÷ {f}', (x) => x.n / x.f] } },
    { name: 'Periode getaran', vars: ['T', 'n', 't'], rel: { T: ['{t} ÷ {n}', (x) => x.t / x.n], n: ['{t} ÷ {T}', (x) => x.t / x.T], t: ['{T} × {n}', (x) => x.T * x.n] } },
    { name: 'Hukum Archimedes', vars: ['Fa', 'rho', 'g', 'V'], rel: { Fa: ['{rho} × {g} × {V}', (x) => x.rho * x.g * x.V], V: ['{Fa} ÷ ({rho} × {g})', (x) => x.Fa / (x.rho * x.g)], rho: ['{Fa} ÷ ({g} × {V})', (x) => x.Fa / (x.g * x.V)] } },
    { name: 'Momentum', vars: ['p', 'm', 'v'], rel: { p: ['{m} × {v}', (x) => x.m * x.v], m: ['{p} ÷ {v}', (x) => x.p / x.v], v: ['{p} ÷ {m}', (x) => x.p / x.m] } },
    { name: 'GLBB', vars: ['vt', 'v0', 'a', 't'], rel: { vt: ['{v0} + {a} × {t}', (x) => x.v0 + x.a * x.t], a: ['({vt} − {v0}) ÷ {t}', (x) => (x.vt - x.v0) / x.t], t: ['({vt} − {v0}) ÷ {a}', (x) => (x.vt - x.v0) / x.a], v0: ['{vt} − {a} × {t}', (x) => x.vt - x.a * x.t] } },
    { name: 'Muatan listrik', vars: ['q', 'I', 't'], rel: { q: ['{I} × {t}', (x) => x.I * x.t], I: ['{q} ÷ {t}', (x) => x.q / x.t], t: ['{q} ÷ {I}', (x) => x.q / x.I] } },
  ];
  const ALL_AL = [...new Set(Object.values(V_).flatMap((v) => v.al))];
  const LINK = '(?:\\s*(?:benda|bendanya|nya|sebesar|adalah|yaitu|ialah|=|:|bernilai|sejauh|selama|yang|diberikan|dikerjakan|bekerja|mobil|motor|sepeda|kereta|air|zat cair|logam|lampu|alat|kawat|lain)\\b|\\s*[=:])*\\s*';
  function aliasRe(al) {
    const longer = ALL_AL.filter((o) => o !== al && o.startsWith(al + ' ')).map((o) => esc(o.slice(al.length + 1)));
    const neg = longer.length ? `(?!\\s+(?:${longer.join('|')})\\b)` : '';

  function physValues(t, f) {
    const vals = {};
    const used = [];
    const mentioned = {};
    for (const key of f.vars) {
      const def = V_[key];
      for (const al of [...def.al].sort((a, b) => b.length - a.length)) {
        const re = new RegExp(aliasRe(al) + LINK + `(${NUM})\\s*(${UNIT_RE}|°c|derajat celcius|derajat)?`, 'g');
        let m;
        while ((m = re.exec(t))) {
          const pos = m.index + m[0].lastIndexOf(m[1]);
          if (used.includes(pos)) continue;
          used.push(pos);
          let val = parseNumber(m[1]);
          let note = '';
          const unitStr = m[2] && !/derajat|°c/.test(m[2]) ? m[2] : null;
          if (unitStr) {
            const u = findUnit(unitStr);
            if (u && def.cat && u.cat === def.cat && u.factor !== 1) {
              note = `${fmt(val)} ${unitStr.replace(/2$/, '²').replace(/3$/, '³')} = ${fmt(round(val * u.factor, 10), 10)} ${def.u}`;
              val *= u.factor;
            }
          }
          vals[key] = { val, note, raw: m[1] + (m[2] ? ' ' + m[2] : '') };
          break;
        }
        if (vals[key]) break;
        if (def.pre) {
          const m2 = t.match(new RegExp(`(${NUM})\\s*(?:kali\\s*)?` + aliasRe(al)));
          if (m2) { vals[key] = { val: parseNumber(m2[1]), note: '', raw: m2[1] }; used.push(m2.index); break; }
        }
        if (new RegExp(aliasRe(al)).test(t)) mentioned[key] = true;
      }
      // bentuk simbol: "m = 5"
      if (!vals[key] && def.sym.length <= 3) {
        const re = new RegExp(`(?<![a-z])${esc(def.sym.toLowerCase())}\\s*=\\s*(${NUM})\\s*(${UNIT_RE})?`);
        const m = t.match(re);
        if (m) {
          let val = parseNumber(m[1]);
          let note = '';
          if (m[2]) {
            const u = findUnit(m[2]);
            if (u && def.cat && u.cat === def.cat && u.factor !== 1) { note = `${fmt(val)} ${u.label} = ${fmt(val * u.factor, 10)} ${def.u}`; val *= u.factor; }
          }
          vals[key] = { val, note, raw: m[1] };
        }
      }
    }
    return { vals, mentioned };
  }

  const physics = {
    id: 'fisika',
    name: 'Rumus fisika',
    run(raw, t) {
      if (!/\d/.test(t)) return null;
      let best = null;
      for (const f of FORMULAS) {
        if (f.need && !f.need.test(t)) continue;
        const { vals, mentioned } = physValues(t, f);
        const given = Object.keys(vals).length;
        if (given === 0) continue;
        let missing = f.vars.filter((k) => !vals[k]);
        let target = null;
        const filled = { ...vals };
        const defaults = [];
        const solvable = (k) => !!f.rel[k];
        for (const k of [...missing]) {
          if (missing.length <= 1) break;
          if (mentioned[k]) continue;
          let dv = V_[k].def;
          if (k === 'rho' && /\bair\b/.test(t)) dv = 1000;
          if (dv === undefined) continue;
          filled[k] = { val: dv, note: '', raw: String(dv) };
          defaults.push(k);
          missing = missing.filter((x) => x !== k);
        }
        if (missing.length === 1 && solvable(missing[0])) target = missing[0];
        if (!target) continue;
        const score = given * 3 + (mentioned[target] ? 4 : 0) - defaults.length - f.vars.length * 0.1;
        if (!best || score > best.score) best = { f, target, filled, defaults, score, mentionedTarget: !!mentioned[target] };
      }
      const action = /\b(hitung|hitunglah|berapa|berapakah|tentukan|cari|carilah|besar|besarnya|jika|bila|apabila|diketahui|maka)\b|=/.test(t);
      if (!best || !(best.mentionedTarget || (action && Object.keys(best.filled).length - best.defaults.length >= 2))) return null;
      const { f, target, filled, defaults } = best;
      const x = {};
      for (const k in filled) x[k] = filled[k].val;
      const [tpl, fn] = f.rel[target];
      const result = fn(x);
      if (!Number.isFinite(result)) return { badge: 'Fisika', text: 'Hasilnya tidak terdefinisi. Mungkin ada nilai nol sebagai pembagi.' };
      const T = V_[target];
      const sym = (k) => V_[k].sym;
      const formula = `${T.sym} = ${tpl.replace(/\{(\w+)\}/g, (_, k) => sym(k))}`;
      const subst = `${T.sym} = ${tpl.replace(/\{(\w+)\}/g, (_, k) => fmt(round(x[k], 10), 10))}`;
      const known = f.vars.filter((k) => k !== target).map((k) => {
        const d = V_[k];
        const isDef = defaults.includes(k);
        return `- ${d.n} (${d.sym}) = ${fmt(round(x[k], 10), 10)} ${d.u}${isDef ? ' _(nilai bawaan)_' : ''}${filled[k].note ? ` _(dari ${filled[k].note.split(' = ')[0]})_` : ''}`;
      });
      const res = fmt(round(result, 6), 6);
      const alt = T.cat === 'massa jenis' ? ` = ${fmt(round(result / 1000, 6))} g/cm³` : T.cat === 'kecepatan' ? ` = ${fmt(round(result * 3.6, 4))} km/jam` : T.cat === 'energi' && Math.abs(result) >= 1000 ? ` = ${fmt(round(result / 1000, 6))} kJ` : T.cat === 'tekanan' && Math.abs(result) >= 1000 ? ` = ${fmt(round(result / 1000, 6))} kPa` : '';
      const lines = [`**${f.name}**`, '', '**Diketahui:**', ...known, '', `**Ditanya:** ${T.n} (${T.sym})`, '', `**Rumus:** \`${formula}\``, '', `**Jawab:** \`${subst}\``, '', `**${T.sym} = ${res} ${T.u}**${alt}`];
      if (defaults.includes('g')) lines.push('', '_Memakai g = 9,8 m/s². Jika gurumu memakai g = 10, tambahkan "g = 10" pada pertanyaan._');
      if (defaults.includes('rho')) lines.push('', '_Memakai massa jenis air ρ = 1.000 kg/m³._');
      const conv = f.vars.filter((k) => filled[k] && filled[k].note).map((k) => filled[k].note);
      if (conv.length) lines.push('', '_Satuan diubah ke SI: ' + conv.join('; ') + '._');
      return { badge: 'Fisika · ' + f.name, text: lines.join('\n'), steps: [`Rumus dipilih: ${f.name} (skor ${round(best.score, 2)})`, `Ditanya: ${T.n}`, `Hasil: ${res} ${T.u}`] };
    },
  };

  // ===========================================================================
  // 6. BANGUN DATAR & RUANG
  // ===========================================================================
  const DIM = {
    s: ['panjang sisi', 'sisi', 'rusuk', 's'], p: ['panjang', 'p'], l: ['lebar', 'l'], t: ['tinggi', 't'], a: ['alas', 'sisi atas', 'a'],
    b: ['sisi bawah', 'b'], r: ['jari jari', 'jari2', 'jari', 'radius', 'r'], d: ['diameter', 'garis tengah', 'd'],
    d1: ['diagonal 1', 'diagonal pertama', 'd1'], d2: ['diagonal 2', 'diagonal kedua', 'd2'],
  };
  const SHAPES = [
    ['persegi panjang', 'pp'], ['persegi', 'sq'], ['segitiga', 'tri'], ['lingkaran', 'cir'], ['trapesium', 'trap'], ['jajar genjang', 'jg'], ['jajargenjang', 'jg'],
    ['belah ketupat', 'bk'], ['layang layang', 'll'], ['kubus', 'cube'], ['balok', 'box'], ['tabung', 'cyl'], ['silinder', 'cyl'], ['kerucut', 'cone'], ['bola', 'sph'], ['limas', 'pyr'],
  ];
  function dims(t) {
    const out = {};
    const used = [];
    let unit = null;
    const order = Object.entries(DIM).flatMap(([k, al]) => al.map((a) => [k, a])).sort((x, y) => y[1].length - x[1].length);
    for (const [k, al] of order) {
      if (out[k]) continue;
      const re = new RegExp(`(?<![a-z])${esc(al)}(?![a-z0-9])(?:\\s*(?:nya|=|:|adalah|sebesar|sepanjang|yaitu))*\\s*(${NUM})\\s*(km|m|dm|cm|mm)?(?![a-z0-9])`, 'g');
      let m;
      while ((m = re.exec(t))) {
        const pos = m.index + m[0].lastIndexOf(m[1]);
        if (used.includes(pos)) continue;
        used.push(pos);
        out[k] = parseNumber(m[1]);
        if (m[2]) unit = m[2];
        break;
      }
    }
    return { d: out, unit };
  }
  const geometry = {
    id: 'geometri',
    name: 'Bangun datar & ruang',
    run(raw, t) {
      if (!/\d/.test(t)) return null;
      // Pythagoras
      if (/pythagoras|phytagoras|sisi miring|hipotenusa|segitiga siku/.test(t)) {
        const nums = (t.match(new RegExp(NUM, 'g')) || []).map(parseNumber).filter((n) => n > 0);
        const mc = t.match(new RegExp(`(?:sisi miring|hipotenusa)(?:nya)?\\s*(?:=|:|adalah)?\\s*(${NUM})`));
        if (mc && nums.length >= 2) {
          const c = parseNumber(mc[1]);
          const other = nums.find((n) => n !== c) ?? nums[1];
          if (other >= c) return { badge: 'Pythagoras', text: 'Sisi miring harus lebih panjang daripada sisi lainnya.' };
          const b = Math.sqrt(c * c - other * other);
          return { badge: 'Pythagoras', text: `**Teorema Pythagoras:** \`c² = a² + b²\`, sehingga \`b = √(c² − a²)\`\n\nb = √(${fmt(c)}² − ${fmt(other)}²) = √(${fmt(c * c)} − ${fmt(other * other)}) = √${fmt(c * c - other * other)}\n\n**b = ${fmt(round(b, 6))}**` };
        }
        if (nums.length >= 2) {
          const [a, b] = nums;
          const c = Math.sqrt(a * a + b * b);
          return { badge: 'Pythagoras', text: `**Teorema Pythagoras:** \`c² = a² + b²\`\n\nc = √(${fmt(a)}² + ${fmt(b)}²) = √(${fmt(a * a)} + ${fmt(b * b)}) = √${fmt(a * a + b * b)}\n\n**Sisi miring c = ${fmt(round(c, 6))}**` };
        }
      }
      let shape = null;
      for (const [name, id] of SHAPES) if (new RegExp(`\\b${name}\\b`).test(t)) { shape = { name, id }; break; }
      if (!shape) return null;
      const { d, unit } = dims(t);
      if (!Object.keys(d).length) return null;
      const u = unit || 'satuan';
      const u2 = unit ? unit + '²' : 'satuan luas';
      const u3 = unit ? unit + '³' : 'satuan volume';
      const want = { luas: /\bluas\b(?!\s*permukaan)/.test(t), kel: /keliling/.test(t), vol: /volume|volum|isi/.test(t), lp: /luas permukaan|luas selimut/.test(t) };
      const out = [];
      let r = d.r ?? (d.d !== undefined ? d.d / 2 : undefined);
      const useFrac = r !== undefined && Number.isInteger(r) && r % 7 === 0;
      const PI = useFrac ? 22 / 7 : 3.14;
      const piS = useFrac ? '22/7' : '3,14';
      const add = (label, formula, subst, val, un) => out.push(`- **${label}** = \`${formula}\` = ${subst} = **${fmt(round(val, 4))} ${un}**`);
      const S = (v) => fmt(round(v, 6));
      const all = !want.luas && !want.kel && !want.vol && !want.lp;
      switch (shape.id) {
        case 'sq': if (d.s === undefined) break; if (all || want.luas) add('Luas', 's × s', `${S(d.s)} × ${S(d.s)}`, d.s * d.s, u2); if (all || want.kel) add('Keliling', '4 × s', `4 × ${S(d.s)}`, 4 * d.s, u); break;
        case 'pp': if (d.p === undefined || d.l === undefined) break; if (all || want.luas) add('Luas', 'p × l', `${S(d.p)} × ${S(d.l)}`, d.p * d.l, u2); if (all || want.kel) add('Keliling', '2 × (p + l)', `2 × (${S(d.p)} + ${S(d.l)})`, 2 * (d.p + d.l), u); break;
        case 'tri': if (d.a === undefined || d.t === undefined) break; add('Luas', '½ × a × t', `½ × ${S(d.a)} × ${S(d.t)}`, 0.5 * d.a * d.t, u2); break;
        case 'cir': if (r === undefined) break; if (all || want.luas) add('Luas', 'π × r²', `${piS} × ${S(r)}²`, PI * r * r, u2); if (all || want.kel) add('Keliling', '2 × π × r', `2 × ${piS} × ${S(r)}`, 2 * PI * r, u); break;
        case 'trap': if (d.a === undefined || d.b === undefined || d.t === undefined) break; add('Luas', '½ × (a + b) × t', `½ × (${S(d.a)} + ${S(d.b)}) × ${S(d.t)}`, 0.5 * (d.a + d.b) * d.t, u2); break;
        case 'jg': if (d.a === undefined || d.t === undefined) break; add('Luas', 'a × t', `${S(d.a)} × ${S(d.t)}`, d.a * d.t, u2); break;
        case 'bk': case 'll': if (d.d1 === undefined || d.d2 === undefined) break; add('Luas', '½ × d₁ × d₂', `½ × ${S(d.d1)} × ${S(d.d2)}`, 0.5 * d.d1 * d.d2, u2); if (shape.id === 'bk' && d.s !== undefined) add('Keliling', '4 × s', `4 × ${S(d.s)}`, 4 * d.s, u); break;
        case 'cube': if (d.s === undefined) break; if (all || want.vol) add('Volume', 's³', `${S(d.s)}³`, d.s ** 3, u3); if (all || want.lp || want.luas) add('Luas permukaan', '6 × s²', `6 × ${S(d.s)}²`, 6 * d.s * d.s, u2); break;
        case 'box': if (d.p === undefined || d.l === undefined || d.t === undefined) break; if (all || want.vol) add('Volume', 'p × l × t', `${S(d.p)} × ${S(d.l)} × ${S(d.t)}`, d.p * d.l * d.t, u3); if (all || want.lp || want.luas) add('Luas permukaan', '2 × (pl + pt + lt)', `2 × (${S(d.p * d.l)} + ${S(d.p * d.t)} + ${S(d.l * d.t)})`, 2 * (d.p * d.l + d.p * d.t + d.l * d.t), u2); break;
        case 'cyl': if (r === undefined || d.t === undefined) break; if (all || want.vol) add('Volume', 'π × r² × t', `${piS} × ${S(r)}² × ${S(d.t)}`, PI * r * r * d.t, u3); if (all || want.lp || want.luas) add('Luas permukaan', '2 × π × r × (r + t)', `2 × ${piS} × ${S(r)} × (${S(r)} + ${S(d.t)})`, 2 * PI * r * (r + d.t), u2); break;
        case 'cone': { if (r === undefined || d.t === undefined) break; const sl = Math.sqrt(r * r + d.t * d.t); if (all || want.vol) add('Volume', '⅓ × π × r² × t', `⅓ × ${piS} × ${S(r)}² × ${S(d.t)}`, (PI * r * r * d.t) / 3, u3); if (all || want.lp || want.luas) add('Luas permukaan', 'π × r × (r + s)', `${piS} × ${S(r)} × (${S(r)} + ${S(round(sl, 4))}), dengan garis pelukis s = √(r² + t²)`, PI * r * (r + sl), u2); break; }
        case 'sph': if (r === undefined) break; if (all || want.vol) add('Volume', '⁴⁄₃ × π × r³', `⁴⁄₃ × ${piS} × ${S(r)}³`, (4 / 3) * PI * r ** 3, u3); if (all || want.lp || want.luas) add('Luas permukaan', '4 × π × r²', `4 × ${piS} × ${S(r)}²`, 4 * PI * r * r, u2); break;
        case 'pyr': if (d.s === undefined || d.t === undefined) break; add('Volume (alas persegi)', '⅓ × s² × t', `⅓ × ${S(d.s)}² × ${S(d.t)}`, (d.s * d.s * d.t) / 3, u3); break;
      }
      if (!out.length) {
        const need = { sq: 'sisi', pp: 'panjang dan lebar', tri: 'alas dan tinggi', cir: 'jari-jari atau diameter', trap: 'sisi atas (a), sisi bawah (b), dan tinggi', jg: 'alas dan tinggi', bk: 'diagonal 1 dan diagonal 2', ll: 'diagonal 1 dan diagonal 2', cube: 'sisi/rusuk', box: 'panjang, lebar, dan tinggi', cyl: 'jari-jari dan tinggi', cone: 'jari-jari dan tinggi', sph: 'jari-jari', pyr: 'sisi alas dan tinggi' }[shape.id];
        return { badge: 'Geometri', text: `Untuk menghitung **${shape.name}**, saya butuh ukuran: **${need}**. Contoh: "luas ${shape.name} ${shape.id === 'cir' ? 'jari-jari 14 cm' : need.split(' ')[0] + ' 10 cm'}".` };
      }
      const head = `**${N.nlp.capitalize(shape.name)}**` + (d.d !== undefined && d.r === undefined ? ` (diameter ${S(d.d)}, jadi r = ${S(r)})` : '');
      const piNote = /cir|cyl|cone|sph/.test(shape.id) ? `\n\n_Memakai π = ${piS}${useFrac ? ' karena jari-jarinya kelipatan 7' : ''}._` : '';
      return { badge: 'Geometri', text: head + '\n\n' + out.join('\n') + piNote, steps: [`Bangun dikenali: ${shape.name}`, `Ukuran: ${JSON.stringify(d)}`] };
    },
  };

  // ===========================================================================
  // 7. STATISTIK
  // ===========================================================================
  const stats = {
    id: 'statistik',
    name: 'Statistik',
    run(raw, t) {
      const kw = t.match(/\b(rata rata|rerata|mean|median|modus|jangkauan|simpangan baku|standar deviasi|deviasi standar|varians|ragam|statistik|nilai tengah|nilai tertinggi|nilai terendah|jumlahkan|total)\b/);
      if (!kw) return null;
      let part = t.slice(kw.index);
      part = part.replace(/\bdan\b/g, ' ');
      let nums;
      if (part.includes(';')) nums = part.split(';').map((x) => (x.match(new RegExp(NUM)) || [])[0]).filter(Boolean).map(parseNumber);
      else if (/\d,\d+,\d/.test(part) && !/,\s/.test(part)) nums = (part.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
      else nums = (part.replace(/,\s+/g, ' ').match(/-?\d+(?:[.,]\d+)?/g) || []).map(parseNumber);
      nums = nums.filter((n) => Number.isFinite(n));
      if (nums.length < 2) return null;
      const n = nums.length;
      const sum = nums.reduce((a, b) => a + b, 0);
      const mean = sum / n;
      const sorted = [...nums].sort((a, b) => a - b);
      const med = n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
      const freq = new Map();
      for (const v of nums) freq.set(v, (freq.get(v) || 0) + 1);
      const maxF = Math.max(...freq.values());
      const modes = maxF > 1 ? [...freq].filter(([, f]) => f === maxF).map(([v]) => v).sort((a, b) => a - b) : [];
      const varP = nums.reduce((a, v) => a + (v - mean) ** 2, 0) / n;
      const varS = n > 1 ? (varP * n) / (n - 1) : 0;
      const F = (v) => fmt(round(v, 4));
      const shownSum = n <= 15 ? nums.map(F).join(' + ') + ' = ' + F(sum) : F(sum);
      const text = [
        `**Data (${n} nilai):** ${nums.map(F).join(', ')}`,
        `**Data terurut:** ${sorted.map(F).join(', ')}`,
        '',
        '| Ukuran | Hasil |',
        '|---|---|',
        `| Jumlah | ${shownSum} |`,
        `| **Rata-rata (mean)** | ${F(sum)} ÷ ${n} = **${F(mean)}** |`,
        `| **Median** | **${F(med)}**${n % 2 ? ` (data ke-${(n + 1) / 2})` : ` (rata-rata data ke-${n / 2} dan ke-${n / 2 + 1})`} |`,
        `| **Modus** | ${modes.length ? '**' + modes.map(F).join(', ') + '**' + ` (muncul ${maxF} kali)` : 'tidak ada (semua muncul sekali)'} |`,
        `| Terkecil / terbesar | ${F(sorted[0])} / ${F(sorted[n - 1])} |`,
        `| Jangkauan | ${F(sorted[n - 1])} − ${F(sorted[0])} = ${F(sorted[n - 1] - sorted[0])} |`,
        `| Varians (populasi) | ${F(varP)} |`,
        `| Simpangan baku (populasi) | ${F(Math.sqrt(varP))} |`,
        `| Simpangan baku (sampel) | ${F(Math.sqrt(varS))} |`,
      ].join('\n');
      return { badge: 'Statistik', text, steps: [`${n} angka ditemukan`, `Mean = ${F(mean)}, median = ${F(med)}`] };
    },
  };

  // ===========================================================================
  // 8. BILANGAN: prima, faktor, FPB, KPK, basis, romawi, terbilang
  // ===========================================================================
  function isPrime(n) {
    if (n < 2 || !Number.isInteger(n)) return { p: false };
    if (n % 2 === 0) return { p: n === 2, f: 2 };
    if (n % 3 === 0) return { p: n === 3, f: 3 };
    for (let i = 5; i * i <= n; i += 6) {
      if (n % i === 0) return { p: false, f: i };
      if (n % (i + 2) === 0) return { p: false, f: i + 2 };
    }
    return { p: true };
  }
  function factorize(n) {
    const f = new Map();
    let x = n;
    for (let p = 2; p * p <= x; p += p === 2 ? 1 : 2) while (x % p === 0) { f.set(p, (f.get(p) || 0) + 1); x /= p; }
    if (x > 1) f.set(x, (f.get(x) || 0) + 1);
    return f;
  }
  const fstr = (f) => [...f].map(([p, e]) => (e > 1 ? `${p}${sup(e)}` : `${p}`)).join(' × ') || '1';
  const gcd = (a, b) => { while (b) [a, b] = [b, a % b]; return Math.abs(a); };
  const lcm = (a, b) => Math.abs(a / gcd(a, b) * b);
  const ROMAN = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
  function toRoman(n) { let s = ''; for (const [v, r] of ROMAN) while (n >= v) { s += r; n -= v; } return s; }
  function fromRoman(s) {
    const map = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
    let t = 0;
    for (let i = 0; i < s.length; i++) { const v = map[s[i]]; const nx = map[s[i + 1]] || 0; t += v < nx ? -v : v; }
    return toRoman(t) === s ? t : NaN;
  }
  const SATUAN = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  function terbilang(n) {
    n = Math.floor(Math.abs(n));
    if (n < 12) return SATUAN[n];
    if (n < 20) return terbilang(n - 10) + ' belas';
    if (n < 100) return (terbilang(Math.floor(n / 10)) + ' puluh ' + terbilang(n % 10)).trim();
    if (n < 200) return ('seratus ' + terbilang(n - 100)).trim();
    if (n < 1000) return (terbilang(Math.floor(n / 100)) + ' ratus ' + terbilang(n % 100)).trim();
    if (n < 2000) return ('seribu ' + terbilang(n - 1000)).trim();
    const big = [[1e12, 'triliun'], [1e9, 'miliar'], [1e6, 'juta'], [1e3, 'ribu']];
    for (const [v, w] of big) if (n >= v) return (terbilang(Math.floor(n / v)) + ' ' + w + ' ' + terbilang(n % v)).trim();
    return '';
  }
  function terbilangFull(x) {
    if (x === 0) return 'nol';
    let s = (x < 0 ? 'minus ' : '') + terbilang(Math.abs(Math.trunc(x)) || 0);
    if (Math.trunc(x) === 0) s = (x < 0 ? 'minus ' : '') + 'nol';
    const str = String(Math.abs(x));
    if (str.includes('.')) {
      const dec = str.split('.')[1];
      s += ' koma ' + [...dec].map((d) => (d === '0' ? 'nol' : SATUAN[+d])).join(' ');
    }
    return s.replace(/\s+/g, ' ').trim();
  }
  const BASES = { biner: 2, binary: 2, bin: 2, oktal: 8, octal: 8, desimal: 10, decimal: 10, heksadesimal: 16, heksa: 16, hexa: 16, hex: 16 };

  const numbers = {
    id: 'bilangan',
    name: 'Teori bilangan',
    run(raw, t) {
      let m;
      // romawi
      if ((m = t.match(/(\d{1,4})\s*(?:ke|dalam|jadi|menjadi)?\s*(?:angka|bilangan|huruf)?\s*romawi/)) || (m = t.match(/romawi\s*(?:dari|untuk)?\s*(\d{1,4})\b/))) {
        const n = Number(m[1]);
        if (n < 1 || n > 3999) return { badge: 'Bilangan', text: 'Angka romawi standar hanya untuk 1 sampai 3.999.' };
        return { badge: 'Angka romawi', text: `**${n} = ${toRoman(n)}**\n\nI = 1, V = 5, X = 10, L = 50, C = 100, D = 500, M = 1000.` };
      }
      m = raw.match(/\b([MDCLXVI]{2,15}|[MDCLXVI](?=\s*(?:ke|itu|artinya|berapa|dalam|=|$)))\b/);
      if (m && (/romawi|arti|berapa|ke angka|ke desimal/.test(t) || raw.trim() === m[1])) {
        const v = fromRoman(m[1]);
        if (!Number.isNaN(v)) return { badge: 'Angka romawi', text: `**${m[1]} = ${v}**` };
      }
      // basis bilangan
      m = t.match(/\b([0-9a-f]+)\s*(?:\(?\s*(biner|binary|oktal|octal|heksadesimal|heksa|hexa|hex|desimal|decimal)\s*\)?)?\s*(?:ke|jadi|menjadi|dalam|dikonversi ke)\s*(?:bilangan\s+|basis\s+)?(biner|binary|bin|oktal|octal|heksadesimal|heksa|hexa|hex|desimal|decimal)\b/);
      if (!m) {
        const m2 = t.match(/\b(biner|oktal|heksadesimal|heksa|hexa|hex)\s+(?:dari\s+)?(\d+)\b/);
        if (m2) m = [m2[0], m2[2], 'desimal', m2[1]];
      }
      if (m) {
        const fromB = m[2] ? BASES[m[2]] : 10;
        const toB = BASES[m[3]];
        const n = parseInt(m[1], fromB);
        if (Number.isFinite(n) && toB && fromB !== toB && /^[0-9a-f]+$/.test(m[1]) && [...m[1]].every((c) => parseInt(c, 16) < fromB)) {
          const out = n.toString(toB).toUpperCase();
          let steps = '';
          if (fromB === 10 && toB === 2 && n > 0 && n < 4096) {
            const rows = [];
            let x = n;
            while (x > 0) { rows.push(`${x} ÷ 2 = ${Math.floor(x / 2)} sisa ${x % 2}`); x = Math.floor(x / 2); }
            steps = '\n\nCara: bagi 2 terus-menerus, lalu baca sisanya dari bawah ke atas.\n```\n' + rows.join('\n') + '\n```';
          } else if (fromB === 2 && toB === 10 && m[1].length <= 16) {
            steps = '\n\nCara: ' + [...m[1]].map((d, i) => `${d}×2${sup(m[1].length - 1 - i)}`).join(' + ') + ` = ${n}`;
          }
          return { badge: 'Basis bilangan', text: `**${m[1].toUpperCase()}₍${fromB}₎ = ${out}₍${toB}₎**${steps}` };
        }
      }
      // terbilang
      m = t.match(/\bterbilang(?:kan)?\s*(?:dari|angka|bilangan)?\s*(-?\d[\d.,]*)/) || t.match(/(-?\d[\d.,]*)\s*(?:dalam|dengan|ke|jadi)\s*(?:huruf|kata|tulisan|terbilang)\b/) || t.match(/\b(?:cara\s+)?(?:baca|membaca|tulis|menulis)\s*(?:angka|bilangan)?\s*(-?\d[\d.,]*)\b/);
      if (m) {
        const v = parseNumber(m[1].replace(/[.,]$/, ''));
        if (Number.isFinite(v) && Math.abs(v) < 1e15) return { badge: 'Terbilang', text: `**${fmt(v, 10)}**\n\nDibaca: _${N.nlp.capitalize(terbilangFull(v))}_` };
      }
      // FPB/KPK
      m = t.match(/\b(fpb|kpk|gcd|lcm|faktor persekutuan terbesar|kelipatan persekutuan terkecil)\b(.*)/);
      if (m) {
        const nums = (m[2].match(/\d+/g) || []).map(Number).filter((x) => x > 0);
        if (nums.length >= 2 && nums.length <= 8 && nums.every((x) => x < 1e9)) {
          const isF = /fpb|gcd|terbesar/.test(m[1]);
          const res = nums.reduce(isF ? gcd : lcm);
          const fac = nums.map((x) => `- ${x} = ${fstr(factorize(x))}`).join('\n');
          const rule = isF ? 'ambil faktor prima yang **sama** dengan pangkat **terkecil**' : 'ambil **semua** faktor prima dengan pangkat **terbesar**';
          return { badge: isF ? 'FPB' : 'KPK', text: `**${isF ? 'FPB' : 'KPK'} dari ${nums.join(', ')} = ${fmt(res)}**\n\nFaktorisasi prima:\n${fac}\n\nCara: ${rule}. Hasilnya ${fstr(factorize(res))} = ${fmt(res)}.` };
        }
      }
      // faktorisasi prima
      m = t.match(/\b(?:faktorisasi prima|faktor prima|pohon faktor|faktorisasi)\s*(?:dari)?\s*(\d+)/);
      if (m) {
        const n = Number(m[1]);
        if (n >= 2 && n < 1e12) {
          const f = factorize(n);
          return { badge: 'Faktorisasi prima', text: `**${fmt(n)} = ${fstr(f)}**\n\nFaktor primanya: ${[...f.keys()].join(', ')}.` };
        }
      }
      // daftar faktor
      m = t.match(/\bfaktor(?:\s+faktor)?\s*(?:dari|bilangan)?\s*(\d+)/);
      if (m) {
        const n = Number(m[1]);
        if (n >= 1 && n <= 1e8) {
          const fs = [];
          for (let i = 1; i * i <= n; i++) if (n % i === 0) { fs.push(i); if (i * i !== n) fs.push(n / i); }
          fs.sort((a, b) => a - b);
          return { badge: 'Faktor', text: `**Faktor dari ${fmt(n)}** (${fs.length} buah):\n\n${fs.join(', ')}` };
        }
      }
      // daftar bilangan prima
      m = t.match(/\bbilangan prima\s*(?:antara|dari)\s*(\d+)\s*(?:sampai|hingga|dan|ke|s\/d|-)\s*(\d+)/) || t.match(/\bbilangan prima\s*(?:kurang dari|di bawah|dibawah|sampai|hingga)\s*(\d+)/);
      if (m) {
        let a = m[2] ? Number(m[1]) : 1;
        let b = m[2] ? Number(m[2]) : Number(m[1]) - (/kurang|bawah/.test(m[0]) ? 1 : 0);
        if (a > b) [a, b] = [b, a];
        if (b - a <= 20000) {
          const list = [];
          for (let i = Math.max(2, a); i <= b; i++) if (isPrime(i).p) list.push(i);
          return { badge: 'Bilangan prima', text: `**Bilangan prima dari ${a} sampai ${b}** (${list.length} buah):\n\n${list.slice(0, 400).join(', ')}${list.length > 400 ? ', ...' : ''}` };
        }
      }
      // cek prima
      m = t.match(/(?:apakah\s*)?(\d+)\s*(?:itu|merupakan|termasuk|adalah)?\s*(?:bilangan\s*)?prima\b/) || t.match(/\bprima\s*(?:atau bukan|tidak|kah)?\s*(\d+)/);
      if (m && !/faktor/.test(t)) {
        const n = Number(m[1]);
        if (n <= 1e15) {
          const r = isPrime(n);
          if (r.p) return { badge: 'Bilangan prima', text: `**Ya, ${fmt(n)} adalah bilangan prima.** Ia hanya habis dibagi 1 dan ${fmt(n)}.` };
          if (n < 2) return { badge: 'Bilangan prima', text: `**Bukan.** ${n} bukan bilangan prima karena bilangan prima harus lebih dari 1.` };
          return { badge: 'Bilangan prima', text: `**Bukan, ${fmt(n)} bukan bilangan prima**, karena habis dibagi ${r.f} (${fmt(n)} = ${r.f} × ${fmt(n / r.f)}).\n\nFaktorisasi primanya: ${fstr(factorize(n))}` };
        }
      }
      // genap/ganjil
      m = t.match(/(?:apakah\s*)?(-?\d+)\s*(?:itu|termasuk|merupakan|adalah)?\s*(?:bilangan\s*)?(genap|ganjil)/);
      if (m) {
        const n = Number(m[1]);
        const even = n % 2 === 0;
        return { badge: 'Bilangan', text: `**${fmt(n)} adalah bilangan ${even ? 'genap' : 'ganjil'}**, karena ${even ? 'habis' : 'tidak habis'} dibagi 2.` };
      }
      return null;
    },
  };

  // ===========================================================================
  // 9. TANGGAL & WAKTU
  // ===========================================================================
  const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const BULAN = ['januari', 'februari', 'maret', 'april', 'mei', 'juni', 'juli', 'agustus', 'september', 'oktober', 'november', 'desember'];
  const BULAN_ALT = { jan: 0, feb: 1, pebruari: 1, mar: 2, apr: 3, jun: 5, jul: 6, agu: 7, agt: 7, ags: 7, agust: 7, sep: 8, sept: 8, okt: 9, nov: 10, nop: 10, nopember: 10, des: 11 };
  const monthIdx = (w) => { const i = BULAN.indexOf(w); return i >= 0 ? i : BULAN_ALT[w] ?? -1; };
  const fmtDate = (d) => `${HARI[d.getDay()]}, ${d.getDate()} ${N.nlp.capitalize(BULAN[d.getMonth()])} ${d.getFullYear()}`;
  const dayStart = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = (a, b) => Math.round((dayStart(b) - dayStart(a)) / 86400000);
  function tzName() {
    try {
      const z = Intl.DateTimeFormat().resolvedOptions().timeZone;
      return { 'Asia/Jakarta': 'WIB', 'Asia/Pontianak': 'WIB', 'Asia/Makassar': 'WITA', 'Asia/Jayapura': 'WIT' }[z] || z;
    } catch (e) { return ''; }
  }
  function parseDate(t, now) {
    const named = { 'tahun baru': [1, 0], natal: [25, 11], 'hari kemerdekaan': [17, 7], 'hut ri': [17, 7], 'hari pahlawan': [10, 10], 'hari guru': [25, 10], 'hari kartini': [21, 3], 'hari pendidikan': [2, 4], 'sumpah pemuda': [28, 9], 'hari ibu': [22, 11] };
    for (const k in named) if (t.includes(k)) {
      const [d, mo] = named[k];
      let dt = new Date(now.getFullYear(), mo, d);
      if (dayStart(dt) < dayStart(now)) dt = new Date(now.getFullYear() + 1, mo, d);
      return { dt, label: k, auto: true };
    }
    let m = t.match(new RegExp(`(\\d{1,2})\\s+(${[...BULAN, ...Object.keys(BULAN_ALT)].join('|')})\\b\\s*(\\d{4})?`));
    if (m) {
      const mo = monthIdx(m[2]);
      const y = m[3] ? Number(m[3]) : now.getFullYear();
      let dt = new Date(y, mo, Number(m[1]));
      const auto = !m[3];
      if (auto && dayStart(dt) < dayStart(now)) dt = new Date(y + 1, mo, Number(m[1]));
      return { dt, auto, exp: !!m[3] };
    }
    m = t.match(/\b(\d{1,2})[/-](\d{1,2})[/-](\d{4})\b/);
    if (m) return { dt: new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])), exp: true };
    return null;
  }
  const datetime = {
    id: 'waktu',
    name: 'Tanggal & waktu',
    run(raw, t, now = new Date()) {
      let m;
      if (/\b(jam|pukul) berapa\b|\bsekarang jam\b|\bwaktu sekarang\b/.test(t) && !/\d/.test(t)) {
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        return { badge: 'Waktu', text: `Sekarang pukul **${hh}.${mm} ${tzName()}** menurut jam perangkatmu.` };
      }
      if (/\b(hari ini|sekarang)\b.*\b(hari apa|tanggal berapa|tanggal)\b|\b(hari apa|tanggal berapa)\b.*\b(hari ini|sekarang)\b|^(hari apa|tanggal berapa)( ya| sih)?$/.test(t))
        return { badge: 'Tanggal', text: `Hari ini **${fmtDate(now)}**.` };
      if (/\b(tahun berapa|bulan apa)\b.*\b(sekarang|ini)\b|\b(sekarang|ini)\b.*\b(tahun berapa|bulan apa)\b/.test(t))
        return { badge: 'Tanggal', text: `Sekarang bulan **${N.nlp.capitalize(BULAN[now.getMonth()])} ${now.getFullYear()}**.` };
      const rel = { besok: 1, lusa: 2, kemarin: -1, 'kemarin lusa': -2 };
      m = t.match(/\b(kemarin lusa|besok|lusa|kemarin)\b.*\b(hari apa|tanggal berapa)\b/);
      if (m) {
        const d = new Date(now.getTime() + rel[m[1]] * 86400000);
        return { badge: 'Tanggal', text: `${N.nlp.capitalize(m[1])} adalah **${fmtDate(d)}**.` };
      }
      m = t.match(/\b(\d{1,5})\s*(hari|minggu|bulan|tahun)\s*(lagi|kemudian|dari sekarang|ke depan|yang lalu|lalu|sebelumnya)\b/);
      if (m && /tanggal|hari apa|kapan/.test(t)) {
        const n = Number(m[1]) * (/lalu|sebelum/.test(m[3]) ? -1 : 1);
        const d = new Date(now);
        if (m[2] === 'hari') d.setDate(d.getDate() + n);
        else if (m[2] === 'minggu') d.setDate(d.getDate() + 7 * n);
        else if (m[2] === 'bulan') d.setMonth(d.getMonth() + n);
        else d.setFullYear(d.getFullYear() + n);
        return { badge: 'Tanggal', text: `${m[1]} ${m[2]} ${m[3]} adalah **${fmtDate(d)}**.` };
      }
      // umur
      m = t.match(/\blahir\b.*?(\d{4})\b/);
      if (m && /umur|usia|berapa tahun/.test(t)) {
        const pd = parseDate(t, now);
        const birth = pd && pd.exp ? pd.dt : new Date(Number(m[1]), 0, 1);
        if (birth > now) return { badge: 'Umur', text: 'Tanggal lahir itu masih di masa depan.' };
        let y = now.getFullYear() - birth.getFullYear();
        if (pd && pd.exp) {
          const had = now.getMonth() > birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() >= birth.getDate());
          if (!had) y--;
          const days = diffDays(birth, now);
          return { badge: 'Umur', text: `Lahir **${fmtDate(birth)}**, maka umurnya sekarang **${y} tahun** (sudah hidup ${fmt(days)} hari).` };
        }
        return { badge: 'Umur', text: `Lahir tahun ${m[1]}, maka tahun ini (${now.getFullYear()}) umurnya **${y} tahun** (atau ${y - 1} tahun jika belum berulang tahun).` };
      }
      // hitung mundur / hari apa pada tanggal tertentu
      const pd = parseDate(t, now);
      if (pd) {
        if (/hari apa/.test(t) && !/berapa hari/.test(t)) return { badge: 'Kalender', text: `Tanggal itu jatuh pada hari **${fmtDate(pd.dt)}**.` };
        if (/berapa hari|hitung mundur|berapa lama lagi|kapan/.test(t)) {
          const dd = diffDays(now, pd.dt);
          if (dd === 0) return { badge: 'Kalender', text: `Itu **hari ini**! ${fmtDate(pd.dt)}. 🎉` };
          const w = Math.floor(Math.abs(dd) / 7);
          const extra = Math.abs(dd) >= 7 ? ` (sekitar ${w} minggu ${Math.abs(dd) % 7} hari)` : '';
          return { badge: 'Kalender', text: dd > 0 ? `Menuju **${fmtDate(pd.dt)}** masih **${fmt(dd)} hari lagi**${extra}.` : `**${fmtDate(pd.dt)}** sudah lewat **${fmt(-dd)} hari** yang lalu${extra}.` };
        }
      }
      if (/lebaran|idul fitri|idul adha|ramadan|ramadhan|imlek|nyepi|waisak/.test(t) && /kapan|berapa hari|tanggal/.test(t))
        return { badge: 'Kalender', text: 'Tanggal hari raya itu mengikuti kalender bulan (hijriah/candra) sehingga berubah setiap tahun. Saya belum bisa menghitungnya tanpa internet. Cek kalender resmi pemerintah, ya.' };
      return null;
    },
  };

  // ===========================================================================
  // 10. TEKS & ACAK
  // ===========================================================================
  function afterColon(raw) {
    const q = raw.match(/["“](.+?)["”]/);
    if (q) return q[1];
    const i = raw.indexOf(':');
    return i >= 0 ? raw.slice(i + 1).trim() : null;
  }
  const textTools = {
    id: 'teks',
    name: 'Alat teks',
    run(raw, t) {
      const body = afterColon(raw);
      if (!body) return null;
      const head = t.split(':')[0];
      if (/hitung|berapa jumlah|jumlah/.test(head) && /kata|huruf|karakter/.test(head)) {
        const words = body.trim().split(/\s+/).filter(Boolean).length;

    if (/transpos/.test(t)) return { badge: 'Matriks', text: `**Transpos** (baris menjadi kolom):\n\n${showM(A[0].map((_, j) => A.map((r) => r[j])))}` };
    if (A.length !== A[0].length) return { badge: 'Matriks', text: `Determinan dan invers hanya untuk matriks persegi, sedangkan matriks ini berordo ${sz(A)}.` };
    const det = detQ(A);
    if (/invers/.test(t)) {
      const inv = inverseQ(A);
      if (!inv) return { badge: 'Matriks', text: `Determinan = 0, jadi matriks ini **tidak punya invers** (matriks singular).` };
      let how = '';
      if (A.length === 2) how = `\nRumus 2×2: A⁻¹ = 1/det × [[d, −b], [−c, a]], dengan det = ad − bc = ${det}.`;
      return { badge: 'Matriks', text: `**Invers matriks** ${sz(A)}\n\nA =\n${showM(A)}\nA⁻¹ =\n${showM(inv)}${how}\n\nDihitung dengan eliminasi Gauss-Jordan pada [A | I].` };
    }
    let how = '';
    if (A.length === 2) how = `\n\ndet = ad − bc = ${fmtN(A[0][0])}×${fmtN(A[1][1])} − ${fmtN(A[0][1])}×${fmtN(A[1][0])} = **${det}**`;
    else if (A.length === 3) {
      const [[a, b, c], [d, e, f], [g, h, i]] = A;
      how = `\n\nAturan Sarrus: (aei + bfg + cdh) − (ceg + afh + bdi) = (${fmtN(a * e * i)} + ${fmtN(b * f * g)} + ${fmtN(c * d * h)}) − (${fmtN(c * e * g)} + ${fmtN(a * f * h)} + ${fmtN(b * d * i)}) = **${det}**`;
    }
    return { badge: 'Matriks', text: `**Determinan matriks** ${sz(A)}\n\n${showM(A)}${how || `\n\ndet = **${det}** (eliminasi Gauss)`}` };
  }

  // --------------------------------------------------- SPL banyak variabel
  function bigSystem(raw) {
    if ((raw.match(/=/g) || []).length < 3) return null;
    const eqs = S.extractEquations(raw);
    if (!eqs || eqs.length < 3) return null;
    let polys;
    try {
      polys = eqs.map(([L, R]) => S.P.sub(S.parse(S.lex(L, true), S.POLYALG), S.parse(S.lex(R, true), S.POLYALG)));
    } catch (e) {
      return null;
    }
    if (polys.some((p) => S.P.deg(p) > 1)) return null;
    const vars = [...new Set(polys.flatMap((p) => [...S.P.vars(p)]))].sort();
    if (vars.length !== polys.length || vars.length > 6) return { badge: 'SPL', text: `Ada ${polys.length} persamaan dan ${vars.length} variabel (${vars.join(', ')}). Jumlah persamaan harus sama dengan jumlah variabel.` };
    const A = polys.map((p) => [...vars.map((v) => qOf(p.get(v) || 0)), qOf(-(p.get('') || 0))]);
    const steps = [];
    const n = vars.length;
    for (let c = 0; c < n; c++) {
      const p = A.findIndex((r, i) => i >= c && !r[c].zero());
      if (p < 0) return { badge: 'SPL', text: 'Sistem ini tidak punya penyelesaian tunggal (determinan = 0).' };
      [A[p], A[c]] = [A[c], A[p]];
      const piv = A[c][c];
      A[c] = A[c].map((v) => v.div(piv));
      for (let r = 0; r < n; r++) if (r !== c && !A[r][c].zero()) {
        const f = A[r][c];
        A[r] = A[r].map((v, j) => v.sub(f.mul(A[c][j])));
      }
      steps.push(`Eliminasi ${vars[c]} dari persamaan lain (baris ${c + 1} sebagai pivot)`);
    }
    const sol = vars.map((v, i) => `**${v} = ${A[i][n]}**`);
    const aug = A.map((r) => r.map((v) => v.toString()));
    return { badge: 'SPL', text: `**Sistem ${n} persamaan linear, ${n} variabel**\n\n${eqs.map(([L, R], i) => `${i + 1}. \`${L} = ${R}\``).join('\n')}\n\n**Metode eliminasi Gauss-Jordan:**\n${steps.map((s) => '- ' + s).join('\n')}\n\nMatriks akhir [I | hasil]:\n\`\`\`\n${aug.map((r) => r.map((v) => v.padStart(6)).join(' ')).join('\n')}\n\`\`\`\n\n${sol.join(', ')}`, steps };
  }

  // ------------------------------------------- akar polinomial derajat ≥ 3
  function polyRoots(d, x, L, R) {
    const deg = S.P.deg(d);
    const coef = [];
    for (let k = deg; k >= 0; k--) coef.push(d.get(x.repeat(k)) || 0);
    const lines = [`**Persamaan:** \`${L} = ${R}\``, '', `Bentuk umum: \`${S.polyStr(d)} = 0\` (derajat ${deg})`];
    // akar rasional (teorema akar rasional) bila koefisien bulat
    const roots = [];
    let c = coef.slice();
    if (c.every((v) => Number.isInteger(round(v, 9)))) {
      c = c.map((v) => round(v, 9));
      const divs = (n) => {
        n = Math.abs(n);
        const out = [];
        for (let i = 1; i <= n && i <= 10000; i++) if (n % i === 0) out.push(i);
        return out;
      };
      let guard = 0;
      while (c.length > 1 && guard++ < 10) {
        if (Math.abs(c[c.length - 1]) < 1e-12) {
          roots.push(0);
          c = c.slice(0, -1);
          continue;
        }
        const cand = [];
        for (const p of divs(c[c.length - 1])) for (const q of divs(c[0])) cand.push(p / q, -p / q);
        const r = cand.find((v) => Math.abs(c.reduce((s, a) => s * v + a, 0)) < 1e-9);
        if (r === undefined) break;
        roots.push(r);
        const nc = [c[0]];
        for (let i = 1; i < c.length - 1; i++) nc.push(c[i] + nc[i - 1] * r);
        c = nc;
      }
      if (roots.length) lines.push('', `Dengan **teorema akar rasional** (coba pembagi konstanta ÷ pembagi koefisien utama) dan pembagian sintetis, ditemukan akar: ${roots.map((r) => `${x} = ${new Q(r)}`).join(', ')}.`);
    }
    // sisanya: derajat ≤ 2 dengan rumus, selebihnya numerik (Durand-Kerner)
    let rest = [];
    if (c.length === 3) {
      const [a, b, cc] = c;
      const D = b * b - 4 * a * cc;
      if (D >= 0) rest = [(-b + Math.sqrt(D)) / (2 * a), (-b - Math.sqrt(D)) / (2 * a)].map((v) => ({ re: v, im: 0 }));
      else rest = [{ re: -b / (2 * a), im: Math.sqrt(-D) / (2 * a) }, { re: -b / (2 * a), im: -Math.sqrt(-D) / (2 * a) }];
      lines.push('', `Sisa faktor kuadrat diselesaikan dengan rumus ABC (D = ${fmtN(round(D, 6))}).`);
    } else if (c.length === 2) rest = [{ re: -c[1] / c[0], im: 0 }];
    else if (c.length > 3) {
      rest = durandKerner(c);
      lines.push('', 'Akar sisanya dicari secara numerik dengan metode Durand-Kerner.');
    }
    const all = [...roots.map((r) => ({ re: r, im: 0 })), ...rest];
    const real = all.filter((z) => Math.abs(z.im) < 1e-7).map((z) => z.re).sort((a, b) => a - b);
    const cplx = all.filter((z) => Math.abs(z.im) >= 1e-7);
    const fmtR = (v) => {
      const f = S.toFraction(round(v, 9), 1000);
      return Number.isInteger(round(v, 9)) ? String(round(v, 9)) : f ? `${f.n}/${f.d}` : fmt(round(v, 6), 6);
    };
    lines.push('', real.length ? `**Akar real:** ${real.map((r, i) => `${x}${real.length > 1 ? '₍' + (i + 1) + '₎' : ''} = ${fmtR(r)}`).join(', ')}` : '**Tidak ada akar real.**');
    if (cplx.length) lines.push('', `Akar kompleks: ${cplx.map((z) => `${fmt(round(z.re, 4))} ${z.im < 0 ? '−' : '+'} ${fmt(Math.abs(round(z.im, 4)))}i`).join(', ')}`);
    return { badge: `Persamaan derajat ${deg}`, text: lines.join('\n') };
  }
  function durandKerner(c) {
    const n = c.length - 1;
    const a = c.map((v) => v / c[0]);
    let z = Array.from({ length: n }, (_, k) => ({ re: Math.cos((2 * Math.PI * k) / n + 0.4) * 1.2, im: Math.sin((2 * Math.PI * k) / n + 0.4) * 1.2 }));
    const mul = (p, q) => ({ re: p.re * q.re - p.im * q.im, im: p.re * q.im + p.im * q.re });
    const div = (p, q) => {
      const d = q.re * q.re + q.im * q.im;
      return { re: (p.re * q.re + p.im * q.im) / d, im: (p.im * q.re - p.re * q.im) / d };
    };
    const ev = (v) => a.reduce((s, k) => {
      const m = mul(s, v);
      return { re: m.re + k, im: m.im };
    }, { re: 0, im: 0 });
    for (let it = 0; it < 500; it++) {
      z = z.map((zi, i) => {
        let den = { re: 1, im: 0 };
        z.forEach((zj, j) => {
          if (i !== j) den = mul(den, { re: zi.re - zj.re, im: zi.im - zj.im });
        });
        const f = div(ev(zi), den);
        return { re: zi.re - f.re, im: zi.im - f.im };
      });
    }
    return z;
  }

  // ------------------------------------------------------ BigInt & kombinatorika
  const BIGALG = {
    num: (v) => {
      if (!Number.isInteger(v)) throw new Error('bukan bulat');
      return BigInt(v);
    },
    variable: () => { throw new Error('var'); }, add: (a, b) => a + b, sub: (a, b) => a - b, mul: (a, b) => a * b,
    div: (a, b) => {
      if (b === 0n || a % b !== 0n) throw new Error('bukan bulat');
      return a / b;
    },
    mod: (a, b) => a % b, neg: (a) => -a,
    pow: (a, b) => {
      if (b < 0n || b > 5000n) throw new Error('pangkat');
      return a ** b;
    },
    fact: (a) => {
      if (a < 0n || a > 3000n) throw new Error('faktorial');
      let r = 1n;
      for (let i = 2n; i <= a; i++) r *= i;
      return r;
    },
    percent: () => { throw new Error('persen'); }, fn: () => { throw new Error('fungsi'); },
  };
  const groupBig = (s) => {
    const neg = s.startsWith('-');
    const d = neg ? s.slice(1) : s;
    return (neg ? '−' : '') + d.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  };
  const nCr = (n, r) => {
    n = BigInt(n);
    r = BigInt(r);
    if (r < 0n || r > n) return 0n;
    if (r > n - r) r = n - r;
    let res = 1n;
    for (let i = 1n; i <= r; i++) res = (res * (n - r + i)) / i;
    return res;
  };
  const nPr = (n, r) => {
    let res = 1n;
    for (let i = 0n; i < BigInt(r); i++) res *= BigInt(n) - i;
    return res;
  };

  // ================================================================ SKILL
  const skill = {
    id: 'matematika-lanjut',
    name: 'Matematika lanjut',
    run(raw, t) {
      let m;
      // turunan
      m = t.match(/\b(?:turunan(?:\s+pertama|\s+kedua)?|derivatif|diferensial|d\/dx)\s*(?:dari|fungsi)?\s*(?:f\s*\(\s*x\s*\)\s*=\s*|y\s*=\s*)?(.+)$/);
      if (m) {
        const second = /kedua/.test(t);
        let src = m[1].replace(/\b(terhadap|ke)\s+[a-z]\b.*$/, '').replace(/\s+(?:di|pada|untuk)\s+[a-z]?\s*=?\s*-?[\d.,]+.*$/, '').trim();
        let e;
        try {
          e = simp(parseAst(src));
        } catch (err) {
          return { badge: 'Turunan', text: `Fungsi \`${src}\` tidak bisa saya baca. Contoh penulisan: \`turunan dari 3x^2 + 2x - 5\` atau \`turunan sin(x)^2\`.` };
        }
        const x = (t.match(/terhadap\s+([a-z])\b/) || [])[1] || varOf(e);
        let d1;
        try {
          d1 = simp(simp(deriv(e, x)));
        } catch (err) {
          return { badge: 'Turunan', text: 'Maaf, ' + err.message + '.' };
        }
        const lines = [`**f(${x}) = ${show(e)}**`, '', `**f′(${x}) = ${show(d1)}**`];
        if (second) lines.push('', `**f″(${x}) = ${show(simp(simp(deriv(d1, x))))}**`);
        lines.push('', 'Aturan yang dipakai: turunan pangkat d/dx xⁿ = n·xⁿ⁻¹, aturan jumlah, aturan perkalian, aturan pembagian, dan aturan rantai. Fungsi trigonometri memakai radian.');
        const at = t.match(/\b(?:di|pada|untuk)\s+[a-z]?\s*=?\s*(-?\d+(?:[.,]\d+)?)/);
        if (at) {
          const v = parseNumber(at[1]);
          lines.push('', `Nilai di ${x} = ${fmtN(v)}: f′(${fmtN(v)}) = **${fmtN(round(evalRad(d1, { [x]: v }), 8))}** (gradien garis singgung).`);
        }
        return { badge: 'Turunan', text: lines.join('\n') };
      }
      // integral
      m = t.match(/\b(?:integral|integralkan|antiturunan|∫)\s*(?:tentu\s*|tak tentu\s*)?(?:dari\s*)?(.+?)(?:\s+(?:dari|batas)\s+(-?[\d.,]+)\s+(?:sampai|hingga|ke|s\/d|-)\s+(-?[\d.,]+))?\s*(?:d[a-z])?$/);
      if (m) {
        let src = m[1].replace(/\s*d[a-z]\s*$/, '').trim();
        let e;
        try {
          e = simp(parseAst(src));
        } catch (err) {
          return { badge: 'Integral', text: `Fungsi \`${src}\` tidak bisa saya baca. Contoh: \`integral 3x^2 + 2x dari 0 sampai 2\`.` };
        }
        const x = varOf(e);
        const P = polyFromAst(e);
        const F = P && integratePoly(P, x);
        const lines = [`**∫ ${show(e)} d${x}**`, ''];
        if (F) {
          const Fs = S.polyStr(F).replace(/(\d+)\/(\d+)([a-z])/g, '($1/$2)$3') + ' + C';
          lines.push(`Antiturunan: **F(${x}) = ${Fs}**`, '', `Aturan pangkat: ∫ xⁿ d${x} = xⁿ⁺¹ / (n + 1).`);
        } else {
          const simple = { 'sin(x)': '−cos(x)', 'cos(x)': 'sin(x)', 'exp(x)': 'eˣ', '1 / x': 'ln|x|' }[show(e)];
          if (simple) lines.push(`Antiturunan: **F(${x}) = ${simple} + C**`);
          else if (!m[2]) lines.push('Bentuk ini belum bisa saya integralkan secara simbolik. Beri batas atas dan bawah agar saya hitung nilainya secara numerik, misalnya `... dari 0 sampai 1`.');
        }
        if (m[2]) {
          const a = parseNumber(m[2]);
          const b = parseNumber(m[3]);
          let val;
          if (F) {

            val = Fb - Fa;
            lines.push('', `**∫ dari ${fmtN(a)} sampai ${fmtN(b)}** = F(${fmtN(b)}) − F(${fmtN(a)}) = ${fmtN(round(Fb, 8))} − ${fmtN(round(Fa, 8))} = **${new Q(round(val, 10))}**${Number.isInteger(round(val, 9)) ? '' : ` ≈ ${fmtN(round(val, 6))}`}`);
          } else {
            val = simpson((v) => evalRad(e, { [x]: v }), a, b);

          }
          if (val > 0 && F) lines.push('', 'Secara geometri, nilai ini adalah luas daerah di bawah kurva (bila kurvanya di atas sumbu-x).');
        }
        return { badge: 'Integral', text: lines.join('\n') };
      }
      // limit
      m = t.match(/\blimit\s+(?:dari\s+)?(.+?)\s+(?:untuk\s+|saat\s+|ketika\s+)?([a-z])\s*(?:mendekati|menuju|->|→)\s*(-?[\d.,]+|tak hingga|tak terhingga|infinity|∞)/);
      if (m) {
        let e;
        try {
          e = simp(parseAst(m[1]));
        } catch (err) {
          return null;
        }
        const x = m[2];
        const inf = /hingga|infinity|∞/.test(m[3]);
        const c = inf ? Infinity : parseNumber(m[3]);
        const f = (v) => evalRad(e, { [x]: v });
        let vL, vR, val;
        if (inf) {

          vR = f(1e8);

        } else {
          vL = f(c - 1e-7);
