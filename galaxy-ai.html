<style>
/* Galaxy AI — tampilan
 * Tata letak: kerangka aplikasi dua kolom (bilah samping + panel kerja), kolom obrolan 760px di tengah.
 */
:root {
  --bg: #f5f5fb;
  --surface: #ffffff;
  --surface-2: #eeeef8;
  --surface-3: #e2e1f2;
  --ink: #14142b;
  --muted: #5d5d7a;
  --line: #dddcee;
  --accent: #6d4aff;
  --accent-ink: #ffffff;
  --accent-soft: #ebe6ff;
  --amber: #a86400;
  --amber-soft: #fbecd2;
  --danger: #c4261e;
  --danger-soft: #fde4e1;
  --ok: #138a4a;
  --shadow: 0 1px 2px rgb(20 20 43 / 0.06), 0 10px 30px rgb(40 30 110 / 0.08);
  --code-bg: #f1f0fa;
  --paper: #ffffff;
  --paper-ink: #1b1b2a;
  --f-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 12px;
  --side: 276px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d17; --surface: #121527; --surface-2: #1a1e36; --surface-3: #242944; --ink: #e9ebff; --muted: #9aa0c3;
    --line: #262b4a; --accent: #9b87ff; --accent-ink: #120a35; --accent-soft: #241d52; --amber: #f0a73a; --amber-soft: #3a2a10;
    --danger: #ff6b6b; --danger-soft: #3d1717; --ok: #4ade80; --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 32px rgb(0 0 0 / 0.35);
    --code-bg: #0e1122; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d17; --surface: #121527; --surface-2: #1a1e36; --surface-3: #242944; --ink: #e9ebff; --muted: #9aa0c3;
  --line: #262b4a; --accent: #9b87ff; --accent-ink: #120a35; --accent-soft: #241d52; --amber: #f0a73a; --amber-soft: #3a2a10;
  --danger: #ff6b6b; --danger-soft: #3d1717; --ok: #4ade80; --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 32px rgb(0 0 0 / 0.35);
  --code-bg: #0e1122; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.2; margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- kerangka ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); height: 100%; }
.side {
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
  padding: 14px 12px max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  gap: 10px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 8px; }
.brand-name { font: 700 22px/1 var(--f-display); letter-spacing: -0.01em; }
.brand-tag { font-size: 12px; color: var(--muted); line-height: 1.3; }
.logo { width: 34px; height: 34px; flex: none; }
.btn-new {
  display: flex; align-items: center; gap: 8px; width: 100%;
  border: 1px solid var(--line); background: var(--bg); border-radius: var(--r);
  padding: 9px 12px; font-weight: 700;
}
.btn-new:hover { border-color: var(--accent); color: var(--accent); }
.nav { display: grid; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px;
  color: var(--ink); text-decoration: none;
}
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 0; }
.history-search {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 14px;
}
.history { overflow-y: auto; overflow-x: hidden; min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 1px; margin: 0 -4px; padding: 0 4px; }
.history-item {
  display: flex; align-items: center; gap: 6px; border-radius: 8px; padding: 6px 6px 6px 10px; font-size: 14px;
  color: var(--ink); cursor: pointer; border: 0; background: none; text-align: left; width: 100%;
}
.history-item:hover { background: var(--surface-2); }
.history-item[aria-current="true"] { background: var(--surface-2); font-weight: 700; }
.history-item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.history-item .del { opacity: 0; border: 0; background: none; padding: 2px; border-radius: 6px; color: var(--muted); display: grid; }
.history-item:hover .del, .history-item:focus-within .del { opacity: 1; }
.history-item .del:hover { color: var(--danger); background: var(--danger-soft); }
.history-empty { font-size: 13px; color: var(--muted); padding: 6px 10px; }

.brain-pill {
  border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; background: var(--bg);
  font-size: 13px;
}
.brain-pill .row { display: flex; align-items: center; gap: 8px; }
.brain-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; }
.brain-pill.ready .dot { background: var(--ok); }
.brain-pill .bar { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.brain-pill .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.15s linear; }
.brain-pill .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
.side-foot { display: flex; gap: 6px; }
.icon-btn {
  display: inline-grid; place-items: center; border: 1px solid transparent; background: none; border-radius: 8px; padding: 7px; color: var(--muted);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.side-foot .icon-btn { flex: 1; display: flex; gap: 6px; justify-content: center; font-size: 13px; border-color: var(--line); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.topbar {
  display: none; align-items: center; gap: 8px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.topbar .title { font: 700 17px/1 var(--f-display); flex: 1; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- obrolan ---------- */
.scroller { flex: 1; overflow-y: auto; min-height: 0; scroll-behavior: smooth; }
.thread {
  max-width: 800px; margin: 0 auto; padding-block: 28px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.msg { display: flex; gap: 12px; min-width: 0; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble {
  background: var(--surface-2); border-radius: 16px 16px 4px 16px; padding: 10px 14px; max-width: min(85%, 620px);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.ai .av { width: 28px; height: 28px; flex: none; margin-top: 2px; }
.msg.ai .body { flex: 1; min-width: 0; }
.badge-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 700; letter-spacing: 0.01em; }
.tag.skill { background: var(--accent-soft); color: var(--accent); }
.tag.unknown { background: var(--amber-soft); color: var(--amber); }
.tag.doc { background: var(--surface-3); color: var(--ink); }
.conf { font-variant-numeric: tabular-nums; }
.content { overflow-wrap: anywhere; }
.content > :first-child { margin-top: 0; }
.content > :last-child { margin-bottom: 0; }
.content p { margin: 0 0 0.7em; }
.content ul, .content ol { margin: 0 0 0.8em; padding-left: 1.4em; }
.content li { margin: 0.15em 0; }
.content li > ul, .content li > ol { margin: 0.2em 0; }
.content h3, .content h4 { font-size: 1.05em; margin: 0.9em 0 0.4em; }
.content code { font-family: var(--f-mono); font-size: 0.88em; background: var(--code-bg); border: 1px solid var(--line); padding: 0.05em 0.35em; border-radius: 5px; }
.content pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0 0 0.8em; }
.content pre code { background: none; border: 0; padding: 0; font-size: 0.86em; }
.content blockquote { margin: 0 0 0.8em; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; color: var(--ink); }
.table-wrap { overflow-x: auto; margin: 0 0 0.8em; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.content table { border-collapse: collapse; width: 100%; font-size: 0.94em; font-variant-numeric: tabular-nums; }
.content th, .content td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.content th { background: var(--surface-2); font-weight: 700; }
.content tr:last-child td { border-bottom: 0; }
.spoiler { background: var(--ink); color: transparent; border-radius: 4px; cursor: pointer; padding: 0 4px; transition: color 0.2s, background 0.2s; }
.spoiler.open { background: var(--accent-soft); color: var(--ink); }
.content.typing > :last-child::after { content: ''; display: inline-block; width: 0.5em; height: 1em; background: var(--accent); vertical-align: -0.15em; margin-left: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.dots { display: inline-flex; gap: 4px; padding: 8px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bob 1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes bob { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--ink);
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.chip.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-top: 8px; }
.act {
  display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; color: var(--muted); padding: 5px 8px; border-radius: 7px; font-size: 13px;
}
.act .icon { width: 16px; height: 16px; }
.act:hover { background: var(--surface-2); color: var(--ink); }
.act.on { color: var(--accent); }
.think { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 13.5px; }
.think summary { cursor: pointer; padding: 7px 12px; color: var(--muted); font-weight: 700; list-style: none; display: flex; align-items: center; gap: 6px; }
.think summary::-webkit-details-marker { display: none; }
.think summary::before { content: '›'; display: inline-block; transition: transform 0.15s; font-size: 16px; line-height: 1; }
.think[open] summary::before { transform: rotate(90deg); }
.think ol { margin: 0; padding: 0 14px 10px 34px; display: grid; gap: 4px; }
.think li b { color: var(--ink); }
.think li span { color: var(--muted); }
.neurons { padding: 0 14px 12px; }
.neurons .lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.neurons .grid { display: grid; grid-template-columns: repeat(32, 1fr); gap: 2px; max-width: 420px; }
.neurons .grid i { aspect-ratio: 1; border-radius: 2px; background: var(--accent); max-width: 100%; }

/* sambutan */
.welcome { display: grid; gap: 22px; padding-top: 4vh; }
.welcome h1 { font-size: clamp(30px, 5vw, 44px); letter-spacing: -0.02em; font-weight: 700; }
.welcome h1 em { font-style: normal; color: var(--accent); }
.welcome .lede { font-size: 18px; color: var(--muted); max-width: 60ch; margin: 8px 0 0; }
.brain-card { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.brain-card .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brain-card .head b { font-family: var(--f-display); font-size: 17px; }
.brain-card .head .state { margin-left: auto; font-size: 13px; color: var(--muted); }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { display: grid; gap: 2px; }
.stat .v { font: 700 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); }
.train-viz { display: flex; align-items: center; gap: 12px; }
.train-viz canvas { width: 100%; height: 46px; display: block; max-width: 100%; }
.sugg-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sugg { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); display: grid; gap: 8px; align-content: start; }
.sugg h2 { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-family: var(--f-body); }
.sugg button {
  text-align: left; border: 0; background: var(--bg); border-radius: 8px; padding: 7px 10px; font-size: 14.5px; color: var(--ink);
  font-family: var(--f-mono); font-size: 13.5px;
}
.sugg button.prose { font-family: var(--f-body); font-size: 14.5px; }
.sugg button:hover { background: var(--accent-soft); color: var(--accent); }

/* penulis pesan */
.composer-wrap {
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 30%);
}
.composer {
  max-width: 800px; margin: 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow);
  display: flex; align-items: flex-end; gap: 6px; padding: 8px 8px 8px 14px;
}
.composer:focus-within { border-color: var(--accent); }
.composer textarea {
  flex: 1; border: 0; outline: 0; background: none; resize: none; min-height: 28px; max-height: 200px; padding: 4px 0; line-height: 1.5; min-width: 0;
}
.send { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; flex: none; }
.send:disabled { opacity: 0.4; cursor: default; }
.composer-hint { max-width: 800px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }

/* ---------- halaman (pengetahuan, dokumen, lab) ---------- */
.page { overflow-y: auto; flex: 1; min-height: 0; }
.page-in {
  max-width: 980px; margin: 0 auto; padding-block: 28px 48px; display: grid; gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(26px, 4vw, 34px); letter-spacing: -0.015em; }
.page-head p { margin: 6px 0 0; color: var(--muted); max-width: 65ch; }
.page-head .grow { flex: 1; min-width: 240px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 14px;
  font-weight: 700; font-size: 14.5px; color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); background: var(--danger-soft); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.input, .select, .textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 12px; width: 100%; min-width: 0;
}
.textarea { resize: vertical; line-height: 1.5; }
.input:focus, .textarea:focus, .select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 13px; }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.k-list { display: grid; gap: 8px; }
.k-item { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; }
.k-item > button {
  width: 100%; border: 0; background: none; text-align: left; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
}
.k-item .kt { font-weight: 700; flex: 1; min-width: 0; }
.k-item .kc { font-size: 12px; color: var(--muted); white-space: nowrap; }
.k-item .src { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 700; }
.k-item .src.user { background: var(--amber-soft); color: var(--amber); }
.k-detail { padding: 0 14px 14px; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.k-detail .pats { font-size: 13px; color: var(--muted); }
.k-detail .pats code { font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; margin: 2px 2px 0 0; display: inline-block; }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 24px; text-align: center; color: var(--muted); }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel h2 { font-size: 17px; }
.panel .note { font-size: 13.5px; color: var(--muted); margin: 0; }
.drop {
  border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center;
  background: var(--bg);
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.doc-item { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); flex-wrap: wrap; }
.doc-item .dn { font-weight: 700; flex: 1; min-width: 160px; overflow-wrap: anywhere; }
.doc-item .dm { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 22px; background: var(--surface-3); position: relative; transition: background 0.15s; flex: none; margin: 0; }
.switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform 0.15s; box-shadow: 0 1px 2px rgb(0 0 0 / 0.2); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(16px); }

/* memori */
.mem-line { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 7px; margin-top: 2px; min-width: 0; }
.mem-line .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mem-line .mdot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.mem-line[data-state="saving"] .mdot { background: var(--amber); }
.mem-line[data-state="error"] .mdot { background: var(--danger); }
.mem-lede { margin: 10px 0 0; font-size: 14.5px; color: var(--muted); }
.mem-lede a { color: var(--accent); font-weight: 700; }
.store-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.store-row:first-of-type { border-top: 0; padding-top: 0; }
.store-row .sdot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--surface-3); }
.store-row[data-state="on"] .sdot { background: var(--ok); }
.store-row[data-state="wait"] .sdot { background: var(--amber); }
.store-row[data-state="error"] .sdot { background: var(--danger); }
.store-row .sinfo { display: grid; gap: 1px; flex: 1; min-width: 200px; }
.store-row .sinfo span { font-size: 13.5px; color: var(--muted); }
.store-row code { font-family: var(--f-mono); font-size: 12.5px; background: var(--surface-2); padding: 0 5px; border-radius: 4px; color: var(--ink); }
.mem-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mem-grid .stat { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.mem-grid .stat .v { font-size: 22px; }
.fact-list { display: grid; gap: 6px; }
.fact { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 8px; padding: 4px 4px 4px 12px; font-size: 14.5px; }
.fact span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.fact .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
.fact .icon-btn .icon { width: 16px; height: 16px; }
table.log { font-size: 13px; width: 100%; border-collapse: collapse; }
table.log th, table.log td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.log th { background: var(--surface-2); }
table.log tr:last-child td { border-bottom: 0; }

/* lab */
.lab-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 16px; align-items: start; }
.lab-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.lab-stats .stat .v { font-size: 20px; }
.chart { width: 100%; height: 160px; display: block; max-width: 100%; border-radius: 8px; background: var(--bg); }
.gen-out {
  font-family: var(--f-mono); font-size: 14px; line-height: 1.6; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px;
  min-height: 120px; white-space: pre-wrap; overflow-wrap: anywhere;
}
.gen-out .seed { color: var(--accent); font-weight: 500; }
.field { display: grid; gap: 4px; font-size: 13.5px; }
.field > span { color: var(--muted); font-weight: 700; }
.field-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.probs { display: grid; gap: 4px; font-family: var(--f-mono); font-size: 13px; }
.probs .pr { display: grid; grid-template-columns: 34px minmax(0, 1fr) 54px; gap: 8px; align-items: center; }
.probs .pr i { height: 10px; border-radius: 3px; background: var(--accent); display: block; max-width: 100%; }
.probs .pr span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.range { width: 100%; accent-color: var(--accent); }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgb(8 14 12 / 0.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal {
  background: var(--surface); border-radius: 16px; width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; box-shadow: 0 20px 60px rgb(0 0 0 / 0.3);
  padding: 20px; display: grid; gap: 14px; border: 1px solid var(--line);
}
.modal h2 { font-size: 21px; }
.modal .row-end { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.confirm { background: var(--danger-soft); border-radius: 10px; padding: 12px; display: grid; gap: 8px; font-size: 14px; }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 60; box-shadow: var(--shadow);
  max-width: calc(100% - 32px);
}

/* ---------- kreasi (gambar, animasi, video, presentasi, Word, Excel, kode) ---------- */
.art-card { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; overflow: hidden; display: grid; min-width: 0; margin-top: 12px; }
.art-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.art-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-size: 14.5px; }
.art-body { display: grid; gap: 10px; padding: 12px; min-width: 0; }
.art-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 12px 12px; }
.art-canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: #0b100f; touch-action: none; }
.slide-nav { display: flex; align-items: center; justify-content: center; gap: 10px; }
.slide-no { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
.paper {
  background: var(--paper); color: var(--paper-ink); border: 1px solid var(--line); border-radius: 8px; padding: 26px 30px; max-height: 460px; overflow-y: auto;
  font-size: 15px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.02);
}
.paper h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
.paper .sub { text-align: center; color: #5b6461; margin-top: 0; }
.paper h2 { font-size: 17px; margin: 18px 0 6px; }
.paper h3 { font-size: 15px; margin: 14px 0 4px; }
.paper .line { color: #3b4441; }
.paper hr { border: 0; border-top: 1px dashed #c9d1ce; margin: 18px 0; }
.paper table { border-collapse: collapse; width: 100%; font-size: 14px; }
.paper th, .paper td { border: 1px solid #c9d1ce; padding: 5px 8px; text-align: left; }
.paper th { background: #eef2f1; }
.paper blockquote { border-left: 3px solid #0b7a6e; margin: 8px 0; padding: 2px 12px; color: #3b4441; }
.sheet { min-width: 0; display: grid; gap: 6px; }
.sheet .note { font-size: 12.5px; color: var(--muted); margin: 0; }
table.xl { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 100%; }
table.xl th, table.xl td { border: 1px solid var(--line); padding: 4px 8px; white-space: nowrap; text-align: left; }
table.xl thead th, table.xl tbody th { background: var(--surface-2); color: var(--muted); font-weight: 500; font-size: 12px; text-align: center; position: sticky; top: 0; }
table.xl tbody th { position: static; }
table.xl td.h { font-weight: 700; background: var(--surface-2); }
table.xl td.f { background: var(--accent-soft); }
.sheet .table-wrap { max-height: 420px; overflow: auto; border-radius: 8px; }
pre.code {
  margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow: auto; max-height: 440px;
  font: 13px/1.55 var(--f-mono); tab-size: 4;
}
pre.code.out { max-height: 260px; }
.run-out { display: grid; gap: 8px; }
.run-web { width: 100%; height: 440px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.rec { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rec .bar { width: 120px; height: 6px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.rec .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.vid-out { display: grid; gap: 8px; justify-items: start; }
.vid-out .note { font-size: 13px; color: var(--muted); margin: 0; }
.art-video { width: 100%; border-radius: 10px; background: #000; }
.field-inline { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.select.small { width: auto; padding: 3px 8px; font-size: 13px; }

/* ---------- studio ---------- */
.studio-form { align-items: center; max-width: none; margin: 0; padding: 6px 6px 6px 14px; }
.studio-form .prefix { color: var(--muted); font-weight: 700; white-space: nowrap; }
.studio-in { flex: 1; border: 0; outline: 0; background: none; padding: 6px 0; min-width: 0; }
#studioOut:empty { display: none; }
#studioOut .art-card { margin-top: 0; }

/* ---------- tugas & notifikasi ---------- */
.task-item { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); flex-wrap: wrap; }
.task-item.off { opacity: 0.62; }
.task-item .ti { display: grid; gap: 1px; flex: 1; min-width: 180px; }
.task-item .ti span { font-size: 13px; color: var(--muted); }
.task-item .dm { font-variant-numeric: tabular-nums; }
.notif-list { display: grid; gap: 8px; max-height: 480px; overflow-y: auto; }
.notif { border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); display: grid; gap: 4px; font-size: 14.5px; }
.notif.new { border-left-color: var(--accent); background: var(--accent-soft); }
.notif .nh { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.notif .dm { font-size: 12px; color: var(--muted); }
.days { display: flex; flex-wrap: wrap; gap: 12px; font-size: 14px; }
details.panel > summary { cursor: pointer; }
.bell { position: relative; }
.bell-count {
  position: absolute; top: 1px; right: 1px; min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px; background: var(--danger); color: #fff;
  font: 700 10.5px/17px var(--f-body); text-align: center; font-variant-numeric: tabular-nums;
}

/* ---------- chatbot ---------- */
.bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.bot-grid > .empty { grid-column: 1 / -1; }
.bot-card { align-content: start; }
.bot-av {
  --h: 172; width: 42px; height: 42px; border-radius: 50%; background: hsl(var(--h) 52% 40%); color: #fff; display: grid; place-items: center;
  font: 700 18px/1 var(--f-display); flex: none;
}
.bot-av.small { width: 24px; height: 24px; font-size: 12px; }
.qa-list { display: grid; gap: 12px; }
.qa-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 10px; align-items: start; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.qa-row .icon-btn { margin-top: 22px; }
.bot-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; background: var(--surface); }
.bot-banner span:nth-child(2) { flex: 1; min-width: 200px; }
.history-item > .icon { width: 16px; height: 16px; color: var(--muted); }

/* ---------- model, akun, latar ---------- */
.composer-bar { max-width: 800px; margin: 6px auto 0; display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.composer-bar .composer-hint { margin: 0; text-align: right; }
.model-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 8px;
  font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap;
}
.model-btn .icon { width: 16px; height: 16px; }
.model-btn:hover { border-color: var(--accent); color: var(--accent); }
.model-pop {
  position: fixed; z-index: 70; width: min(380px, calc(100vw - 16px)); max-height: 72vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 16px 48px rgb(0 0 0 / 0.22); padding: 6px; display: grid; gap: 2px;
}
.model-pop button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 9px; display: grid; gap: 2px; }
.model-pop button:hover { background: var(--surface-2); }
.model-pop button[aria-checked="true"] { background: var(--accent-soft); }
.model-pop .mn { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.model-pop .md { font-size: 13px; color: var(--muted); line-height: 1.4; }
.acct-chip {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 6px 10px; width: 100%;
  text-align: left; font-size: 14px; min-width: 0;
}
.acct-chip:hover { border-color: var(--accent); }
.acct-chip .an { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.acct-list { display: grid; gap: 8px; }
.acct { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; flex-wrap: wrap; }
.acct.cur { border-color: var(--accent); background: var(--accent-soft); }
.acct .an { display: grid; flex: 1; min-width: 140px; line-height: 1.3; }
.acct .dm { font-size: 12.5px; color: var(--muted); }
.lock { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: grid; place-items: center; padding: 16px; }
.lock-box { width: min(400px, 100%); }
.lock-box .acct-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.lab-line { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--accent); cursor: pointer; min-width: 0; font-variant-numeric: tabular-nums; }
.lab-line .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lab-line .ldot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.brand .grow { flex: 1; min-width: 0; }

/* ---------- Galaxy ---------- */
body { background: radial-gradient(1200px 600px at 110% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%), var(--bg); }
.muted { color: var(--muted); }
.dm { font-size: 12.5px; color: var(--muted); }
.grow { flex: 1; min-width: 0; }
.brand-name { font-family: var(--f-display); }
.logo.big { width: 64px; height: 64px; }
.status-pill { border: 1px solid var(--line); border-radius: var(--r); padding: 9px 12px; display: grid; gap: 6px; background: var(--bg); font-size: 13px; }
.status-pill .row { display: flex; align-items: center; gap: 8px; }
.status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; }
.status-pill .dot.ok { background: var(--ok); }
.status-pill .net { display: grid; color: var(--muted); }
.status-pill .net .icon { width: 16px; height: 16px; }
.status-pill .net.ok { color: var(--ok); }
.acct-chip { padding: 7px 10px; }
.acct-chip .an { display: grid; line-height: 1.25; }
.acct-chip .an b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-chip .an .dm { font-size: 11.5px; }
img.bot-av { object-fit: cover; padding: 0; }
.bot-av.big { width: 64px; height: 64px; font-size: 26px; }
.side-foot .icon-btn { flex: 0 0 auto; }
.side-foot .icon-btn.wide { flex: 1; }
.announce { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--accent-soft); color: var(--ink); border-bottom: 1px solid var(--line); font-size: 14px; }
.announce > span { flex: 1; }
.announce a { color: var(--accent); }
.chat-head { display: flex; align-items: center; gap: 10px; max-width: 800px; width: calc(100% - 32px); margin: 10px auto 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14px; }
.chat-head .icon { color: var(--accent); }
.welcome .hello { display: grid; gap: 10px; justify-items: start; }
.welcome h1 em { color: var(--accent); font-style: normal; }
.proj-lede { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--muted); }
.proj-lede .icon { color: var(--accent); }
.sugg-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sugg button { font-family: var(--f-body) !important; }
.tag.web { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); display: inline-flex; align-items: center; gap: 4px; }
.tag.web .icon { width: 13px; height: 13px; }
sup.cite { font-size: 10.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 0 4px; margin-left: 2px; vertical-align: super; line-height: 1; }
.content a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; overflow-wrap: anywhere; }
.msg.ai .content .step, .dots + .step { color: var(--muted); font-size: 14px; }
.attach-row { max-width: 800px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.att { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 4px 6px 4px 4px; font-size: 13px; max-width: 260px; }
.att img { width: 34px; height: 34px; border-radius: 7px; object-fit: cover; }
.att > .icon { width: 18px; height: 18px; margin: 0 4px; color: var(--accent); }
.att .an { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.att .ax { border: 0; background: none; color: var(--muted); display: grid; padding: 2px; border-radius: 6px; }
.att .ax .icon { width: 15px; height: 15px; }
.att .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.msg.user { flex-direction: column; align-items: flex-end; }
.msg.user .atts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 85%; }
.msg.user .atts .att img { width: 72px; height: 72px; }
.composer #attachBtn { align-self: flex-end; margin-bottom: 1px; }
.composer-wrap.drag .composer { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.composer-bar { gap: 6px; flex-wrap: wrap; }
.composer-bar .composer-hint { margin-left: auto; }
.web-btn.off { opacity: 0.7; text-decoration: line-through; }
.attach-pop { width: min(320px, calc(100vw - 16px)); }
.attach-pop .mn .icon { width: 18px; height: 18px; color: var(--accent); }
.proj-grid, .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.proj-grid > .empty, .app-grid > .empty { grid-column: 1 / -1; }
.proj-card { text-align: left; cursor: pointer; align-content: start; color: var(--ink); }
.proj-card:hover { border-color: var(--accent); }

/* ==== /shared/merge.js ==== */
/* Galaxy AI — merge.js (dipakai server dan browser)
 * Menggabungkan memori dari dua tempat (perangkat & akun) tanpa kehilangan data:
 *  - kunci daftar (obrolan, projek, berkas, kreasi, ...) digabung per item: versi terbaru menang,
 *    item yang dihapus dicatat di "nisan" (tomb) agar tidak muncul lagi;
 *  - kunci lain: yang terakhir diubah menang (last-writer-wins).
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else (root.Galaxy = root.Galaxy || {}).merge = api;
})(typeof window !== 'undefined' ? window : globalThis, function () {
  'use strict';
  // kunci daftar -> nama cap waktu tiap item
  const LISTS = { chats: 'updated', projects: 'updated', files: 'added', creations: 'at', bots: 'updated', docs: 'added', webcache: 'at' };
  // tidak pernah dikirim ke server (khusus perangkat, besar, atau bisa dihitung ulang)
  const DEVICE_ONLY = new Set(['model', 'model_kilat', 'model_cermat', 'context', 'blobs']);
  const MAX_TOMB = 500;

  const stampOf = (key, item) => (item && (item[LISTS[key]] || item.updated || item.at || item.added)) || 0;

  function mergeTomb(a, b) {
    const out = {};
    for (const src of [a || {}, b || {}]) {
      for (const [k, ids] of Object.entries(src)) {
        if (!ids || typeof ids !== 'object') continue;
        const o = (out[k] = out[k] || {});
        for (const [id, t] of Object.entries(ids)) if (!o[id] || o[id] < t) o[id] = t;
      }
    }
    for (const k of Object.keys(out)) {
      const ids = Object.keys(out[k]);
      if (ids.length > MAX_TOMB) ids.sort((x, y) => out[k][x] - out[k][y]).slice(0, ids.length - MAX_TOMB).forEach((id) => delete out[k][id]);
    }
    return out;
  }

  function mergeList(key, a, b, tomb) {
    const dead = (tomb && tomb[key]) || {};
    const map = new Map();
    for (const list of [a || [], b || []]) {
      if (!Array.isArray(list)) continue;
      for (const it of list) {
        if (!it || it.id == null) continue;
        const cur = map.get(it.id);
        if (!cur || stampOf(key, it) > stampOf(key, cur)) map.set(it.id, it);
      }
    }
    const out = [...map.values()].filter((it) => !(dead[it.id] && dead[it.id] >= stampOf(key, it)));
    out.sort((x, y) => stampOf(key, y) - stampOf(key, x));
    return out;
  }

  /** Gabungkan satu kunci. a, b: {t, v}. Mengembalikan {t, v}. */
  function mergeKey(key, a, b, tomb) {
    if (!a && !b) return undefined;
    // kunci daftar selalu digabung ulang agar nisan terbaru ikut diterapkan walau hanya satu sisi yang ada
    if (LISTS[key] && ((a && Array.isArray(a.v)) || (b && Array.isArray(b.v)))) return { t: Math.max((a && a.t) || 0, (b && b.t) || 0), v: mergeList(key, a && a.v, b && b.v, tomb) };
    if (!a) return b;
    if (!b) return a;
    if (key === 'tomb') return { t: Math.max(a.t || 0, b.t || 0), v: mergeTomb(a.v, b.v) };

  /** Gabungkan dua keadaan lengkap {kunci: {t, v}}. */
  function mergeState(a, b) {
    const out = {};

    if (tomb) out.tomb = tomb;
    const tv = tomb ? tomb.v : {};

      if (k === 'tomb' || DEVICE_ONLY.has(k)) continue;

    { id: 'pembuat', c: 'Tentang Galaxy', t: 'Pembuat Galaxy', q: ['siapa pembuatmu', 'siapa yang membuat kamu', 'kamu buatan siapa', 'siapa penciptamu', 'kamu dibuat oleh siapa', 'siapa developer kamu'],
      a: 'Galaxy AI dibuat sebagai proyek AI mandiri. Pengolah bahasa, jaringan saraf, mesin riset internet, dan semua pembangkit kreasinya ditulis sendiri tanpa memakai layanan AI pihak lain. Pemilik situs mengelolanya lewat portal developer.' },
    { id: 'bisa_apa', c: 'Tentang Galaxy', t: 'Kemampuan Galaxy', q: ['kamu bisa apa', 'apa yang bisa kamu lakukan', 'fitur kamu apa saja', 'bantuan', 'help', 'menu', 'kemampuanmu apa', 'tolong bantu aku', 'cara pakai', 'apa saja yang bisa kamu buat'],
      a: 'Ini yang bisa saya lakukan:\n- **Menjawab apa saja dengan sumber dari internet**: `apa itu lubang hitam`, `berita teknologi hari ini`, `cuaca di Bandung`, `kurs dollar hari ini`.\n- **Membaca link & berkas**: tempel link, atau unggah foto, video, PDF, Word, Excel, PowerPoint, dan berkas Google Drive, lalu minta ringkasan, presentasi, atau soal dari isinya.\n- **Membuat program**: `buat game ular`, `buat website toko online`, `buat aplikasi catatan keuangan`, kode Python, Java, C++, dan lainnya.\n- **Kreasi**: gambar, animasi 1D/2D/3D, video, presentasi (.pptx), Word (.docx), Excel (.xlsx), artikel, cerita, puisi.\n- **Hitungan rumit**: persamaan, turunan, integral, matriks, fisika, kimia.\n- **Projek**: kelompokkan obrolan & berkas per projek dengan tujuan masing-masing.\n- **Tugas & notifikasi**: `ingatkan aku belajar setiap hari jam 19.00`.\n- **Koneksi aplikasi** (dengan izinmu): Google Docs, Sheets, Drive, YouTube, Spotify, Strava, Garmin, TikTok, Instagram, X, Threads, dan ekspor Quizlet.' },
    { id: 'tipe_model', c: 'Tentang Galaxy', t: 'Tipe model Galaxy', q: ['model apa saja yang ada', 'tipe model galaxy', 'bedanya nebula nova quasar', 'cara ganti model', 'model mana yang paling pintar', 'model terbaik', 'jenis model ai kamu', 'apa itu quasar max', 'apa itu nebula flash', 'apa itu nova pro'],
      a: 'Galaxy punya tiga tingkat model. Ganti lewat tombol model di bawah kotak pesan:\n- **nebula-flash** (Tier 1): paling cepat dan hemat. Jawaban ringkas, membaca 1 sumber internet bila perlu.\n- **nova-pro** (Tier 2): seimbang untuk kebutuhan umum. Membaca beberapa sumber, menjelaskan lebih dalam, dan mencantumkan rujukan.\n- **quasar-max** (Tier 3): kapasitas tertinggi. Riset bertahap dengan banyak kata kunci, membaca hingga 8 sumber, mencocokkan fakta antarsumber, lalu menyusun jawaban terstruktur yang paling lengkap.\n\nMakin tinggi tingkatnya, makin dalam proses berpikirnya, tetapi makin lama juga waktunya.' },
    { id: 'akun_galaxy', c: 'Tentang Galaxy', t: 'Akun dan memori', q: ['cara membuat akun', 'akun galaxy', 'login google', 'cara login', 'ganti akun', 'memori tiap akun', 'apakah memori tersimpan di akun', 'komputer dipakai bergantian'],
      a: 'Ada dua jenis akun:\n- **Akun perangkat**: dibuat langsung di perangkat ini (bisa dikunci PIN). Memorinya tersimpan di perangkat ini saja.\n- **Masuk dengan Google (Gmail)**: memori obrolan, projek, dan kreasimu tersimpan terenkripsi di akunmu dan muncul di semua perangkat tempat kamu masuk.\n\nTekan nama akun di bilah samping untuk masuk, keluar, atau membuat akun.' },
    { id: 'internet', c: 'Tentang Galaxy', t: 'Koneksi internet', q: ['apakah kamu terhubung internet', 'kamu online', 'kamu pakai internet', 'kamu bisa browsing', 'cari di google', 'kamu terhubung chatgpt', 'apakah kamu chatgpt', 'apakah kamu claude', 'kamu pakai api apa'],
      a: 'Ya, saya terhubung ke **internet** untuk mencari dan membaca: mesin pencari, Wikipedia, halaman web, berita, cuaca, dan kurs. Tetapi saya **tidak terhubung ke AI mana pun** (bukan ChatGPT, Claude, Gemini, dan lainnya). Bahan dari internet saya olah dengan mesin saya sendiri, dan sumbernya selalu saya cantumkan.' },
    { id: 'cara_belajar', c: 'Tentang Galaxy', t: 'Cara Galaxy belajar', q: ['bagaimana kamu belajar', 'bisakah kamu belajar', 'kamu bisa belajar', 'pengetahuanmu bertambah', 'kamu update otomatis', 'apakah kamu perlu dilatih'],
      a: 'Saya tidak perlu dilatih manual. Setiap kali kamu bertanya atau meminta sesuatu yang belum saya ketahui, saya mencari di internet, membaca beberapa sumber, lalu menyimpan ringkasannya di memori akunmu. Pertanyaan serupa berikutnya bisa saya jawab lebih cepat, dan ringkasan itu diperbarui otomatis bila sudah lama.' },
    { id: 'privasi', c: 'Tentang Galaxy', t: 'Privasi data', q: ['apakah dataku aman', 'chat ku disimpan dimana', 'privasi', 'apakah kamu menyimpan data', 'siapa yang bisa melihat chat ku', 'apakah developer bisa membaca chat'],
      a: 'Memorimu hanya milikmu:\n- Di perangkat: tersimpan di browser (IndexedDB) per akun.\n- Di akun Google: tersimpan **terenkripsi** dengan kunci khusus akunmu. Developer Galaxy hanya melihat jumlah pengguna, bukan isi obrolan.\n- Pencarian internet lewat server Galaxy, jadi situs lain tidak melihat alamat IP-mu dan pertanyaanmu tidak dicatat.\n- Token aplikasi yang kamu sambungkan disimpan terenkripsi dan bisa diputus kapan saja.\n- Kamu bisa mengunduh atau menghapus seluruh datamu di menu **Akun & privasi**.' },
    { id: 'memori_ai', c: 'Tentang Galaxy', t: 'Memori Galaxy', q: ['apakah kamu punya memori', 'apakah chat hilang kalau ditutup', 'apakah kamu ingat obrolan kita', 'dimana ingatanmu disimpan', 'apakah kamu bisa mengingat', 'apa kamu lupa kalau halaman ditutup'],
      a: 'Ya. Setiap obrolan, projek, berkas, kreasi, tugas, dan fakta tentang dirimu disimpan otomatis di akun atau perangkatmu. Menutup halaman tidak menghapusnya.\n\nCoba: "aku kelas 8", lalu tanya "aku kelas berapa?", atau "apa saja yang sudah kita bahas?"' },
    { id: 'projek_info', c: 'Tentang Galaxy', t: 'Fitur projek', q: ['apa itu projek', 'cara membuat projek', 'fitur projek', 'buat projek baru', 'mengganti nama projek'],
      a: 'Di menu **Projek** kamu bisa membuat projek dengan **nama** dan **tujuan** sendiri, misalnya "Tugas IPA kelas 8 — membuat laporan fotosintesis". Obrolan, berkas, dan kreasi di dalam projek dikumpulkan jadi satu, dan tujuannya membantu saya memahami konteks. Nama dan tujuan bisa diganti kapan saja.' },
    { id: 'bisa_salah', c: 'Tentang Galaxy', t: 'Keterbatasan Galaxy', q: ['apakah kamu bisa salah', 'kamu selalu benar', 'kenapa kamu tidak tahu', 'kenapa jawabanmu aneh', 'keterbatasan kamu apa'],
      a: 'Ya, saya bisa salah. Jawaban dari internet hanya sebaik sumbernya, jadi saya selalu mencantumkan sumber agar kamu bisa mengecek. Hitungan memakai rumus pasti sehingga biasanya akurat. Untuk hal penting (kesehatan, hukum, keuangan), tetap pastikan ke ahlinya.' },
    { id: 'cara_kerja_ai', c: 'Tentang Galaxy', t: 'Cara kerja Galaxy', q: ['bagaimana cara kerjamu', 'cara kerja kamu bagaimana', 'kamu berpikir bagaimana', 'jelaskan otakmu', 'bagaimana kamu menjawab'],
      a: 'Begini cara saya menjawab:\n1. **Memahami**: pertanyaan dirapikan dan dikenali jenisnya oleh jaringan saraf saya sendiri.\n2. **Menghitung** bila itu soal matematika atau sains, memakai rumus pasti.\n3. **Meriset**: bila perlu, saya mencari di internet dan membaca beberapa halaman.\n4. **Menyusun**: kalimat paling relevan dipilih, dicocokkan antarsumber, lalu disusun menjadi jawaban dengan rujukan.\n5. **Mengingat**: ringkasan disimpan agar lain kali lebih cepat.\n\nBuka **Proses berpikir** di bawah jawaban untuk melihat langkahnya.' },

    // ======================= AI & TEKNOLOGI =======================
    { id: 'ai', c: 'Teknologi', t: 'Kecerdasan buatan (AI)', k: ['kecerdasan buatan', 'ai', 'artificial intelligence'], q: ['apa itu ai', 'ai itu apa sih'],
      a: '**Kecerdasan buatan (Artificial Intelligence/AI)** adalah bidang ilmu komputer yang membuat mesin mampu melakukan tugas yang biasanya butuh kecerdasan manusia, misalnya memahami bahasa, mengenali gambar, mengambil keputusan, dan belajar dari data.',
      m: 'AI modern banyak memakai **pembelajaran mesin (machine learning)**: komputer tidak diprogram aturan satu per satu, tetapi diberi banyak contoh lalu menemukan polanya sendiri. Jenis yang populer adalah **jaringan saraf tiruan**, yang meniru cara neuron di otak saling terhubung.',
      e: 'Contoh AI dalam kehidupan sehari-hari: rekomendasi video, penerjemah otomatis, pengenal wajah di HP, filter spam email, dan asisten seperti saya.' },
    { id: 'ml', c: 'Teknologi', t: 'Pembelajaran mesin', k: ['machine learning', 'pembelajaran mesin'], a: '**Pembelajaran mesin (machine learning)** adalah cabang AI tempat komputer belajar dari data. Ada tiga jenis utama: **supervised** (belajar dari contoh berlabel), **unsupervised** (mencari pola tanpa label), dan **reinforcement** (belajar dari hadiah dan hukuman).', e: 'Saya memakai supervised learning: setiap contoh pertanyaan diberi label topik, lalu jaringan saraf belajar memetakan pertanyaan ke topik yang benar.' },
    { id: 'jst', c: 'Teknologi', t: 'Jaringan saraf tiruan', k: ['jaringan saraf tiruan', 'neural network', 'jaringan saraf', 'neuron buatan'],
      a: '**Jaringan saraf tiruan** adalah model matematika yang tersusun dari "neuron" buatan dalam beberapa lapisan: lapisan masukan, lapisan tersembunyi, dan lapisan keluaran. Setiap sambungan punya **bobot**. Saat belajar, bobot disesuaikan sedikit demi sedikit agar tebakan makin benar. Proses ini disebut **backpropagation**.',
      m: 'Satu neuron menghitung jumlah masukan dikali bobot, ditambah bias, lalu melewatkannya ke fungsi aktivasi seperti ReLU (nilai negatif menjadi 0). Kesalahan tebakan diukur dengan fungsi loss (misalnya cross-entropy). Turunan (gradien) loss terhadap tiap bobot dihitung mundur dari keluaran ke masukan, lalu bobot digeser ke arah yang mengurangi kesalahan. Langkah ini diulang ribuan kali.' },
    { id: 'komputer', c: 'Teknologi', t: 'Komputer', k: ['komputer'], a: '**Komputer** adalah alat elektronik yang menerima data (input), mengolahnya (proses), menyimpannya, lalu menghasilkan informasi (output). Komponen utamanya: **CPU** (otak pemroses), **RAM** (memori kerja sementara), **penyimpanan** (HDD/SSD), serta perangkat input (keyboard, mouse) dan output (monitor, printer).', m: 'Komputer bekerja dengan bilangan biner (0 dan 1). Perangkat keras (hardware) adalah bagian fisiknya, sedangkan perangkat lunak (software) adalah program yang menjalankannya, misalnya sistem operasi dan aplikasi.' },
    { id: 'cpu', c: 'Teknologi', t: 'CPU', k: ['cpu', 'prosesor', 'processor'], a: '**CPU (Central Processing Unit)** atau prosesor adalah "otak" komputer yang menjalankan instruksi program: menghitung, membandingkan, dan mengatur kerja komponen lain. Kecepatannya diukur dalam gigahertz (GHz), dan prosesor modern punya beberapa inti (core).' },
    { id: 'ram', c: 'Teknologi', t: 'RAM', k: ['ram', 'memori ram'], a: '**RAM (Random Access Memory)** adalah memori kerja sementara tempat komputer menyimpan data yang sedang dipakai. RAM sangat cepat, tetapi isinya hilang saat komputer dimatikan. Makin besar RAM, makin banyak program yang bisa dibuka bersamaan dengan lancar.' },
    { id: 'internet_def', c: 'Teknologi', t: 'Internet', k: ['internet'], q: ['apa itu internet', 'bagaimana internet bekerja'], a: '**Internet** adalah jaringan komputer global yang saling terhubung menggunakan protokol TCP/IP. Lewat internet kita bisa membuka website (WWW), mengirim email, menonton video, dan berkomunikasi. **World Wide Web** ditemukan oleh Tim Berners-Lee pada tahun 1989.' },
    { id: 'algoritma', c: 'Teknologi', t: 'Algoritma', k: ['algoritma'], a: '**Algoritma** adalah urutan langkah logis dan jelas untuk menyelesaikan suatu masalah. Algoritma bisa ditulis dalam bahasa sehari-hari, diagram alir (flowchart), atau kode program.', e: 'Algoritma membuat teh: 1) didihkan air, 2) masukkan teh ke gelas, 3) tuang air panas, 4) tambahkan gula, 5) aduk. Urutannya penting. Kalau diaduk sebelum air dituang, hasilnya berbeda.' },
    { id: 'pemrograman', c: 'Teknologi', t: 'Pemrograman', k: ['pemrograman', 'coding', 'programming', 'bahasa pemrograman'], q: ['cara belajar coding', 'bahasa pemrograman apa yang bagus untuk pemula'],
      a: '**Pemrograman (coding)** adalah kegiatan menulis instruksi dalam bahasa yang dipahami komputer. Bahasa yang ramah pemula antara lain **Python** (mudah dibaca), **JavaScript** (untuk website), dan **Scratch** (berbasis balok, cocok untuk anak).', m: 'Tips belajar: mulai dari konsep dasar (variabel, percabangan if, perulangan, fungsi), langsung praktik membuat proyek kecil, dan biasakan membaca pesan error. Website seperti saya ini dibuat dengan HTML, CSS, dan JavaScript.' },
    { id: 'html', c: 'Teknologi', t: 'HTML, CSS, JavaScript', k: ['html', 'css', 'javascript'], a: 'Website dibangun dengan tiga bahasa utama:\n- **HTML**: kerangka dan isi halaman (judul, paragraf, gambar).\n- **CSS**: tampilan (warna, huruf, tata letak).\n- **JavaScript**: perilaku dan interaksi (tombol, perhitungan, animasi).\n\nSaya sendiri ditulis dengan ketiganya.' },
    { id: 'password', c: 'Teknologi', t: 'Kata sandi yang aman', k: ['password kuat', 'kata sandi aman', 'keamanan akun'], q: ['cara membuat password yang kuat', 'tips keamanan internet', 'cara agar akun tidak dibobol'],
      a: 'Tips kata sandi dan keamanan akun:\n- Pakai minimal 12 karakter, campuran huruf besar, kecil, angka, dan simbol, atau gabungan beberapa kata acak.\n- Jangan pakai tanggal lahir atau nama.\n- Gunakan kata sandi berbeda untuk tiap akun.\n- Aktifkan verifikasi dua langkah (2FA).\n- Jangan pernah memberikan kode OTP kepada siapa pun.' },
    { id: 'hoaks', c: 'Teknologi', t: 'Hoaks', k: ['hoaks', 'hoax', 'berita palsu'], q: ['cara mengenali hoaks', 'bagaimana cek berita bohong'], a: '**Hoaks** adalah informasi palsu yang disebarkan seolah-olah benar. Cara mengenalinya:\n- Judul provokatif atau terlalu heboh.\n- Sumber tidak jelas.\n- Cek ke situs berita resmi atau situs cek fakta.\n- Periksa tanggal dan keaslian foto.\n- Jangan langsung membagikan sebelum yakin.' },
    { id: 'biner', c: 'Teknologi', t: 'Bilangan biner', k: ['bilangan biner', 'sistem biner'], a: '**Bilangan biner** adalah sistem bilangan basis 2 yang hanya memakai angka 0 dan 1. Komputer memakai biner karena rangkaian listrik hanya punya dua keadaan: mati (0) dan hidup (1).', e: 'Desimal 5 = biner 101, karena 1×4 + 0×2 + 1×1 = 5. Coba ketik "13 ke biner" untuk mengonversi.' },

    // ======================= IPA — BIOLOGI =======================
    { id: 'fotosintesis', c: 'IPA · Biologi', t: 'Fotosintesis', k: ['fotosintesis'], q: ['bagaimana tumbuhan membuat makanan', 'proses tumbuhan memasak makanan', 'tumbuhan membuat makanan sendiri', 'reaksi fotosintesis', 'apa yang dibutuhkan tumbuhan untuk fotosintesis', 'hasil fotosintesis apa'],
      a: '**Fotosintesis** adalah proses tumbuhan hijau membuat makanan sendiri (glukosa) dengan bantuan cahaya matahari. Bahan yang dibutuhkan adalah **karbon dioksida (CO₂)** dan **air (H₂O)**. Hasilnya **glukosa** dan **oksigen (O₂)**. Proses ini terjadi di **kloroplas** yang mengandung zat hijau daun (**klorofil**).\n\nReaksinya:\n`6CO₂ + 6H₂O + cahaya → C₆H₁₂O₆ + 6O₂`',
      m: 'Fotosintesis berlangsung dalam dua tahap. **Reaksi terang** terjadi di membran tilakoid: energi cahaya memecah air sehingga oksigen dilepaskan dan terbentuk energi kimia (ATP dan NADPH). **Reaksi gelap (siklus Calvin)** terjadi di stroma: CO₂ diikat dan diubah menjadi glukosa memakai ATP dan NADPH. Faktor yang memengaruhi laju fotosintesis antara lain intensitas cahaya, kadar CO₂, suhu, dan ketersediaan air.',
      e: 'Percobaan Ingenhousz: tanaman air Hydrilla di bawah sinar matahari mengeluarkan gelembung gas oksigen. Percobaan Sachs: daun yang sebagian ditutup kertas lalu diuji dengan larutan iodin menunjukkan bagian terkena cahaya berwarna biru kehitaman karena mengandung amilum.' },
    { id: 'respirasi', c: 'IPA · Biologi', t: 'Respirasi sel', k: ['respirasi', 'respirasi sel', 'respirasi aerob', 'respirasi anaerob'], q: ['bagaimana sel menghasilkan energi', 'apa beda respirasi dan fotosintesis'],
      a: '**Respirasi sel** adalah proses pemecahan glukosa untuk menghasilkan energi (ATP). Respirasi aerob memerlukan oksigen dan terjadi di **mitokondria**:\n`C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energi`\n\nRespirasi anaerob (tanpa oksigen) menghasilkan energi lebih sedikit, misalnya fermentasi oleh ragi yang menghasilkan alkohol, atau di otot yang menghasilkan asam laktat (penyebab pegal).',
      m: 'Respirasi bisa dianggap kebalikan fotosintesis. Fotosintesis menyimpan energi cahaya dalam glukosa dan melepas oksigen. Respirasi membongkar glukosa memakai oksigen dan melepas energi. Tumbuhan melakukan keduanya, sedangkan hewan hanya respirasi.' },
    { id: 'sel', c: 'IPA · Biologi', t: 'Sel', k: ['sel', 'sel makhluk hidup'], q: ['unit terkecil makhluk hidup', 'bagian bagian sel', 'organel sel apa saja'],
      a: '**Sel** adalah unit struktural dan fungsional terkecil makhluk hidup. Bagian utama sel: **membran sel** (mengatur keluar-masuk zat), **sitoplasma** (cairan tempat organel), dan **nukleus/inti sel** (pusat pengendali yang berisi DNA). Organel lain: mitokondria, ribosom, retikulum endoplasma, badan Golgi, dan lisosom.',
      m: 'Berdasarkan ada tidaknya membran inti, sel dibagi menjadi **prokariotik** (tanpa membran inti, contoh bakteri) dan **eukariotik** (punya membran inti, contoh sel hewan, tumbuhan, dan jamur). Teori sel dikembangkan oleh Schleiden, Schwann, dan Virchow. Robert Hooke pertama kali melihat "sel" pada gabus tahun 1665.' },
    { id: 'sel_hewan_tumbuhan', c: 'IPA · Biologi', t: 'Sel hewan vs sel tumbuhan', k: ['sel hewan', 'sel tumbuhan'], q: ['perbedaan sel hewan dan sel tumbuhan', 'beda sel hewan dan tumbuhan'],
      a: 'Perbedaan sel hewan dan sel tumbuhan:\n\n| Ciri | Sel tumbuhan | Sel hewan |\n|---|---|---|\n| Dinding sel | Ada (selulosa) | Tidak ada |\n| Kloroplas | Ada | Tidak ada |\n| Vakuola | Besar, satu | Kecil atau tidak ada |\n| Sentriol | Umumnya tidak ada | Ada |\n| Bentuk | Tetap (kotak) | Tidak tetap (bulat) |\n| Cadangan makanan | Amilum | Glikogen |' },
    { id: 'mitokondria', c: 'IPA · Biologi', t: 'Mitokondria', k: ['mitokondria'], q: ['fungsi mitokondria', 'pembangkit tenaga sel'], a: '**Mitokondria** adalah organel tempat **respirasi sel** berlangsung untuk menghasilkan energi dalam bentuk ATP. Karena itu mitokondria sering disebut "pembangkit tenaga sel". Sel yang butuh banyak energi, seperti sel otot dan sel saraf, punya banyak mitokondria.' },
    { id: 'kloroplas', c: 'IPA · Biologi', t: 'Kloroplas', k: ['kloroplas', 'klorofil'], q: ['fungsi kloroplas', 'zat hijau daun'], a: '**Kloroplas** adalah organel sel tumbuhan tempat fotosintesis berlangsung. Kloroplas mengandung **klorofil**, pigmen hijau yang menyerap cahaya merah dan biru lalu memantulkan cahaya hijau. Itulah sebabnya daun tampak hijau.' },
    { id: 'nukleus', c: 'IPA · Biologi', t: 'Inti sel (nukleus)', k: ['nukleus', 'inti sel'], q: ['fungsi inti sel', 'fungsi nukleus'], a: '**Nukleus (inti sel)** adalah pusat pengendali seluruh kegiatan sel. Di dalamnya terdapat materi genetik (**DNA**) yang tersusun dalam kromosom, serta anak inti (nukleolus) tempat pembentukan ribosom.' },
    { id: 'ribosom', c: 'IPA · Biologi', t: 'Ribosom', k: ['ribosom'], a: '**Ribosom** adalah organel kecil tempat **sintesis protein**. Ribosom bisa melayang bebas di sitoplasma atau menempel pada retikulum endoplasma kasar.' },
    { id: 'ciri_mh', c: 'IPA · Biologi', t: 'Ciri-ciri makhluk hidup', k: ['ciri makhluk hidup', 'ciri ciri makhluk hidup'], q: ['apa saja ciri makhluk hidup', 'sebutkan ciri ciri makhluk hidup', 'bagaimana membedakan benda hidup dan benda mati'],
      a: 'Ciri-ciri makhluk hidup:\n1. Bernapas\n2. Bergerak\n3. Memerlukan makanan (nutrisi)\n4. Tumbuh dan berkembang\n5. Berkembang biak (reproduksi)\n6. Peka terhadap rangsang (iritabilitas)\n7. Mengeluarkan zat sisa (ekskresi)\n8. Beradaptasi dengan lingkungan', e: 'Tumbuhan putri malu menguncupkan daunnya saat disentuh. Itu contoh peka terhadap rangsang.' },
    { id: 'klasifikasi', c: 'IPA · Biologi', t: 'Klasifikasi makhluk hidup', k: ['klasifikasi makhluk hidup', 'taksonomi', 'takson', 'lima kingdom', 'kingdom'], q: ['urutan takson', 'tingkatan klasifikasi makhluk hidup', 'pengelompokan makhluk hidup'],
      a: '**Klasifikasi makhluk hidup** adalah pengelompokan makhluk hidup berdasarkan persamaan dan perbedaan cirinya. Ilmunya disebut **taksonomi**.\n\nUrutan takson dari tinggi ke rendah: **Kingdom → Filum/Divisi → Kelas → Ordo → Famili → Genus → Spesies**.\n\nSistem lima kingdom (Whittaker): **Monera, Protista, Fungi, Plantae, Animalia**.',
      m: 'Makin rendah tingkatan takson, makin banyak persamaan ciri anggotanya tetapi makin sedikit jumlah anggotanya. Penamaan ilmiah memakai **binomial nomenklatur** dari Carolus Linnaeus.' },
    { id: 'binomial', c: 'IPA · Biologi', t: 'Tata nama binomial', k: ['binomial nomenklatur', 'nama ilmiah', 'nama latin'], q: ['aturan penulisan nama ilmiah', 'nama latin padi', 'nama ilmiah manusia'],
      a: '**Binomial nomenklatur** adalah sistem penamaan ilmiah dua kata dari **Carolus Linnaeus**. Kata pertama nama **genus** (huruf awal kapital) dan kata kedua penunjuk **spesies** (huruf kecil). Nama ditulis miring atau digarisbawahi terpisah.', e: '- Padi: *Oryza sativa*\n- Manusia: *Homo sapiens*\n- Kucing: *Felis catus*\n- Mangga: *Mangifera indica*\n- Harimau: *Panthera tigris*\n- Jagung: *Zea mays*' },
    { id: 'pencernaan', c: 'IPA · Biologi', t: 'Sistem pencernaan manusia', k: ['sistem pencernaan', 'pencernaan', 'organ pencernaan'], q: ['urutan organ pencernaan', 'bagaimana makanan dicerna', 'saluran pencernaan manusia', 'enzim pencernaan'],
      a: 'Urutan saluran pencernaan manusia: **mulut → kerongkongan (esofagus) → lambung → usus halus → usus besar → rektum → anus**.\n\nKelenjar pencernaan yang membantu: kelenjar ludah, **hati** (menghasilkan empedu), dan **pankreas** (menghasilkan enzim).',
      m: '- **Mulut**: makanan dikunyah (pencernaan mekanis), enzim ptialin/amilase mengubah amilum menjadi gula.\n- **Kerongkongan**: mendorong makanan dengan gerak peristaltik.\n- **Lambung**: asam lambung (HCl) membunuh kuman, enzim pepsin memecah protein.\n- **Usus halus**: pencernaan dilanjutkan dan sari makanan diserap oleh vili (jonjot usus).\n- **Usus besar**: menyerap air dan membentuk feses, dibantu bakteri *E. coli*.',
      e: 'Contoh gangguan pencernaan: maag (luka lambung), diare (feses terlalu cair), sembelit (feses keras karena kurang serat dan air), dan usus buntu.' },
    { id: 'peredaran_darah', c: 'IPA · Biologi', t: 'Sistem peredaran darah', k: ['sistem peredaran darah', 'peredaran darah', 'sistem sirkulasi', 'jantung'], q: ['bagaimana jantung bekerja', 'ruang jantung ada berapa', 'peredaran darah besar dan kecil', 'fungsi jantung'],
      a: 'Sistem peredaran darah terdiri dari **jantung**, **pembuluh darah**, dan **darah**. Jantung manusia punya **4 ruang**: serambi (atrium) kanan, serambi kiri, bilik (ventrikel) kanan, dan bilik kiri.\n\n- **Peredaran darah kecil**: jantung → paru-paru → jantung (mengambil oksigen).\n- **Peredaran darah besar**: jantung → seluruh tubuh → jantung (mengedarkan oksigen dan sari makanan).',
      m: 'Pembuluh darah ada tiga: **arteri** (membawa darah keluar dari jantung, dinding tebal), **vena** (membawa darah kembali ke jantung, punya katup), dan **kapiler** (sangat kecil, tempat pertukaran zat). Darah terdiri dari plasma darah, sel darah merah (eritrosit, mengangkut oksigen dengan hemoglobin), sel darah putih (leukosit, melawan kuman), dan keping darah (trombosit, membantu pembekuan).' },
    { id: 'darah', c: 'IPA · Biologi', t: 'Darah', k: ['darah', 'sel darah merah', 'sel darah putih', 'trombosit', 'golongan darah'], q: ['komponen darah', 'fungsi sel darah merah'],
      a: 'Darah terdiri dari:\n- **Plasma darah** (sekitar 55%): cairan yang mengangkut sari makanan, hormon, dan zat sisa.\n- **Sel darah merah (eritrosit)**: mengangkut oksigen dengan **hemoglobin**.\n- **Sel darah putih (leukosit)**: melawan kuman penyakit.\n- **Keping darah (trombosit)**: membantu pembekuan darah saat luka.\n\nGolongan darah sistem ABO: A, B, AB, dan O.' },
    { id: 'pernapasan', c: 'IPA · Biologi', t: 'Sistem pernapasan manusia', k: ['sistem pernapasan', 'pernapasan', 'paru paru', 'alveolus'], q: ['urutan organ pernapasan', 'bagaimana manusia bernapas', 'jalannya udara pernapasan', 'pernapasan dada dan perut'],
      a: 'Urutan jalannya udara pernapasan: **hidung → faring → laring → trakea (batang tenggorok) → bronkus → bronkiolus → alveolus**. Di **alveolus** terjadi pertukaran gas: oksigen masuk ke darah dan karbon dioksida keluar dari darah.',
      m: 'Ada dua mekanisme bernapas. **Pernapasan dada** digerakkan otot antartulang rusuk. **Pernapasan perut** digerakkan otot diafragma. Saat inspirasi (menarik napas), rongga dada membesar sehingga udara masuk. Saat ekspirasi, rongga dada mengecil sehingga udara keluar. Gangguan pernapasan antara lain asma, bronkitis, pneumonia, dan TBC.' },
    { id: 'ekskresi', c: 'IPA · Biologi', t: 'Sistem ekskresi', k: ['sistem ekskresi', 'ekskresi', 'ginjal'], q: ['organ ekskresi manusia', 'fungsi ginjal', 'zat sisa yang dikeluarkan tubuh'],
      a: 'Organ ekskresi manusia dan zat sisa yang dikeluarkannya:\n- **Ginjal**: urine (air seni).\n- **Kulit**: keringat.\n- **Paru-paru**: karbon dioksida dan uap air.\n- **Hati**: empedu dan urea (dari perombakan protein).', m: 'Pembentukan urine di ginjal melalui tiga tahap: **filtrasi** (penyaringan darah di glomerulus), **reabsorpsi** (penyerapan kembali zat yang masih berguna), dan **augmentasi** (penambahan zat sisa). Minum air cukup membantu ginjal tetap sehat.' },
    { id: 'rangka', c: 'IPA · Biologi', t: 'Sistem gerak: rangka', k: ['rangka manusia', 'tulang', 'sistem gerak', 'sendi'], q: ['jumlah tulang manusia', 'fungsi rangka', 'jenis sendi', 'berapa tulang orang dewasa'],
      a: 'Rangka manusia dewasa terdiri dari sekitar **206 tulang**. Fungsi rangka: menopang tubuh, memberi bentuk, melindungi organ penting (tengkorak melindungi otak, rusuk melindungi jantung dan paru-paru), tempat melekatnya otot, tempat pembentukan sel darah (sumsum merah), dan penyimpan mineral seperti kalsium.',
      m: 'Sendi adalah hubungan antartulang:\n- **Sendi engsel**: gerak satu arah (siku, lutut).\n- **Sendi peluru**: gerak ke segala arah (bahu, pangkal paha).\n- **Sendi putar**: gerak memutar (leher dengan tengkorak).\n- **Sendi pelana**: dua arah (ibu jari).\n- **Sendi geser**: menggeser (tulang pergelangan).' },
    { id: 'otot', c: 'IPA · Biologi', t: 'Otot', k: ['otot', 'jenis otot'], q: ['macam macam otot', 'otot lurik otot polos otot jantung'], a: 'Ada tiga jenis otot:\n- **Otot rangka (lurik)**: melekat pada tulang, bekerja sesuai kehendak (sadar).\n- **Otot polos**: di organ dalam seperti usus dan pembuluh darah, bekerja tanpa disadari.\n- **Otot jantung**: hanya di jantung, lurik tetapi bekerja tanpa disadari dan tidak mudah lelah.\n\nOtot bekerja dengan cara berkontraksi (memendek) dan berelaksasi.' },
    { id: 'saraf', c: 'IPA · Biologi', t: 'Sistem saraf', k: ['sistem saraf', 'saraf', 'neuron', 'gerak refleks', 'otak'], q: ['bagian sel saraf', 'apa itu gerak refleks', 'fungsi otak'],
      a: 'Sistem saraf mengatur dan mengendalikan kegiatan tubuh. Terdiri dari **sistem saraf pusat** (otak dan sumsum tulang belakang) dan **sistem saraf tepi**. Sel saraf disebut **neuron**, terdiri dari dendrit (menerima rangsang), badan sel, dan akson/neurit (meneruskan rangsang).',
      m: '**Gerak refleks** adalah gerak cepat tanpa disadari karena impuls tidak melewati otak, misalnya menarik tangan saat menyentuh benda panas. Jalurnya: reseptor → saraf sensorik → sumsum tulang belakang → saraf motorik → efektor (otot).' },
    { id: 'reproduksi_tumbuhan', c: 'IPA · Biologi', t: 'Perkembangbiakan tumbuhan', k: ['perkembangbiakan tumbuhan', 'reproduksi tumbuhan', 'vegetatif', 'generatif', 'stek', 'cangkok'], q: ['cara tumbuhan berkembang biak', 'contoh perkembangbiakan vegetatif alami', 'vegetatif buatan'],
      a: 'Tumbuhan berkembang biak dengan dua cara:\n- **Generatif (kawin)**: melalui penyerbukan dan pembuahan yang menghasilkan biji.\n- **Vegetatif (tak kawin)**:\n  - Alami: umbi lapis (bawang), umbi batang (kentang), geragih/stolon (stroberi), tunas (pisang), rizoma (jahe), tunas adventif (cocor bebek).\n  - Buatan: stek (singkong), cangkok (mangga), okulasi/menempel, merunduk, sambung (enten).' },
    { id: 'bunga', c: 'IPA · Biologi', t: 'Bagian bunga', k: ['bagian bunga', 'benang sari', 'putik', 'penyerbukan'], q: ['alat kelamin bunga', 'fungsi benang sari dan putik', 'macam macam penyerbukan'],
      a: 'Bagian bunga lengkap: **tangkai**, **dasar bunga**, **kelopak** (melindungi kuncup), **mahkota** (menarik serangga), **benang sari** (alat kelamin jantan, menghasilkan serbuk sari), dan **putik** (alat kelamin betina, terdiri dari kepala putik, tangkai putik, dan bakal buah).',
      m: '**Penyerbukan** adalah jatuhnya serbuk sari ke kepala putik. Berdasarkan perantaranya ada penyerbukan oleh angin (anemogami), serangga (entomogami), air (hidrogami), burung (ornitogami), dan manusia (antropogami, contohnya pada vanili).' },
    { id: 'xilem_floem', c: 'IPA · Biologi', t: 'Xilem dan floem', k: ['xilem', 'floem', 'pembuluh kayu', 'pembuluh tapis'], q: ['fungsi xilem dan floem', 'pengangkutan air pada tumbuhan'], a: '**Xilem (pembuluh kayu)** mengangkut air dan mineral dari akar ke daun. **Floem (pembuluh tapis)** mengangkut hasil fotosintesis dari daun ke seluruh bagian tumbuhan.' },
    { id: 'ekosistem', c: 'IPA · Biologi', t: 'Ekosistem', k: ['ekosistem', 'komponen biotik', 'komponen abiotik'], q: ['komponen ekosistem', 'contoh ekosistem'],
      a: '**Ekosistem** adalah hubungan timbal balik antara makhluk hidup dengan lingkungannya. Komponennya:\n- **Biotik**: makhluk hidup (produsen, konsumen, pengurai).\n- **Abiotik**: benda tak hidup (air, tanah, udara, cahaya, suhu).\n\nTingkatan organisasi: individu → populasi → komunitas → ekosistem → bioma → biosfer.', e: 'Contoh ekosistem alami: hutan, laut, sungai, danau, padang rumput. Contoh ekosistem buatan: sawah, kolam ikan, akuarium, kebun.' },
    { id: 'rantai_makanan', c: 'IPA · Biologi', t: 'Rantai makanan', k: ['rantai makanan', 'jaring jaring makanan', 'produsen', 'konsumen', 'pengurai', 'piramida makanan'], q: ['contoh rantai makanan', 'contoh rantai makanan di sawah'],
      a: '**Rantai makanan** adalah peristiwa makan dan dimakan dengan urutan tertentu. Urutannya: **produsen** (tumbuhan hijau) → **konsumen I** (herbivora) → **konsumen II** → **konsumen III** → **pengurai** (bakteri, jamur). Gabungan beberapa rantai makanan yang saling berhubungan disebut **jaring-jaring makanan**.', e: 'Contoh di sawah: padi → tikus → ular → elang. Contoh di laut: fitoplankton → zooplankton → ikan kecil → ikan besar.' },
    { id: 'simbiosis', c: 'IPA · Biologi', t: 'Simbiosis', k: ['simbiosis', 'mutualisme', 'komensalisme', 'parasitisme'], q: ['macam macam simbiosis', 'contoh simbiosis mutualisme', 'contoh simbiosis parasitisme', 'contoh simbiosis komensalisme'],
      a: '**Simbiosis** adalah hubungan erat antara dua makhluk hidup yang berbeda jenis:\n- **Mutualisme**: keduanya untung. Contoh: lebah dan bunga.\n- **Komensalisme**: satu untung, yang lain tidak untung dan tidak rugi. Contoh: anggrek yang menempel di pohon.\n- **Parasitisme**: satu untung, yang lain rugi. Contoh: benalu dan pohon inangnya, nyamuk dan manusia.', e: 'Contoh lain mutualisme: bakteri *Rhizobium* di bintil akar kacang-kacangan. Komensalisme: ikan remora dan hiu. Parasitisme: cacing pita di usus.' },
    { id: 'virus', c: 'IPA · Biologi', t: 'Virus', k: ['virus'], q: ['apakah virus makhluk hidup', 'ciri virus', 'penyakit karena virus'], a: '**Virus** adalah parasit sangat kecil (hanya terlihat dengan mikroskop elektron) yang terdiri dari materi genetik (DNA atau RNA) yang dibungkus selubung protein (**kapsid**). Virus tidak punya sel dan hanya bisa berkembang biak di dalam sel hidup. Karena itu virus dianggap berada di perbatasan antara benda hidup dan benda mati.', e: 'Penyakit karena virus: flu, COVID-19, campak, cacar air, polio, demam berdarah (virus dengue, dibawa nyamuk *Aedes aegypti*). Vaksin membantu tubuh membentuk kekebalan terhadap virus.' },
    { id: 'bakteri', c: 'IPA · Biologi', t: 'Bakteri', k: ['bakteri'], q: ['bakteri yang menguntungkan', 'contoh bakteri merugikan'], a: '**Bakteri** adalah makhluk hidup bersel satu yang **prokariotik** (tidak punya membran inti). Bakteri ada di mana-mana: tanah, air, udara, dan tubuh kita.', e: '- Menguntungkan: *Lactobacillus* (yoghurt), *Acetobacter xylinum* (nata de coco), *Rhizobium* (menyuburkan tanah), *Escherichia coli* di usus besar (membantu pembusukan sisa makanan).\n- Merugikan: *Mycobacterium tuberculosis* (TBC), *Salmonella typhi* (tifus), *Vibrio cholerae* (kolera).' },
    { id: 'jamur', c: 'IPA · Biologi', t: 'Jamur', k: ['jamur', 'fungi'], q: ['jamur untuk membuat tempe', 'manfaat jamur'], a: '**Jamur (fungi)** adalah makhluk hidup eukariotik yang tidak punya klorofil sehingga tidak bisa berfotosintesis. Jamur mendapat makanan dengan menyerap zat organik dari lingkungannya (heterotrof). Jamur berkembang biak dengan spora.', e: '- *Rhizopus oligosporus*: membuat tempe.\n- *Saccharomyces cerevisiae* (ragi): membuat roti dan tapai.\n- *Penicillium*: menghasilkan antibiotik penisilin.\n- Jamur tiram dan jamur merang: bahan makanan.\n- Merugikan: jamur panu dan kutu air.' },
    { id: 'dna', c: 'IPA · Biologi', t: 'DNA dan kromosom', k: ['dna', 'kromosom', 'gen'], q: ['jumlah kromosom manusia', 'fungsi dna'], a: '**DNA (asam deoksiribonukleat)** adalah materi genetik yang menyimpan informasi pewarisan sifat. Bentuknya **double helix** (tangga berpilin), dijelaskan oleh Watson dan Crick tahun 1953. DNA tersusun dalam **kromosom**. Manusia punya **46 kromosom (23 pasang)**. Bagian DNA yang membawa sifat tertentu disebut **gen**.' },
    { id: 'pewarisan', c: 'IPA · Biologi', t: 'Pewarisan sifat (genetika)', k: ['pewarisan sifat', 'genetika', 'hukum mendel', 'persilangan', 'dominan', 'resesif', 'monohibrid'], q: ['siapa bapak genetika', 'rasio persilangan monohibrid', 'perbandingan fenotip f2', 'contoh soal persilangan'],
      a: '**Pewarisan sifat** adalah penurunan sifat dari induk ke keturunannya melalui gen. Bapak genetika adalah **Gregor Mendel**, yang meneliti kacang ercis.\n\n- **Dominan**: sifat yang menutupi (huruf besar, misalnya M).\n- **Resesif**: sifat yang tertutupi (huruf kecil, misalnya m).\n- **Genotipe**: susunan gen (MM, Mm, mm). **Fenotipe**: sifat yang tampak.',
      m: 'Persilangan **monohibrid** (satu sifat beda) MM × mm menghasilkan F1 semua Mm. F1 disilangkan sesamanya (Mm × Mm) menghasilkan F2 dengan rasio **genotipe 1 MM : 2 Mm : 1 mm** dan rasio **fenotipe 3 : 1**. Persilangan **dihibrid** (dua sifat beda) menghasilkan rasio fenotipe F2 **9 : 3 : 3 : 1**.',
      e: 'Bunga merah (MM, dominan) disilangkan dengan bunga putih (mm). F1: semua Mm (merah). F2: 1 MM, 2 Mm, 1 mm. Artinya 75% merah dan 25% putih.' },
    { id: 'bioteknologi', c: 'IPA · Biologi', t: 'Bioteknologi', k: ['bioteknologi', 'rekayasa genetika', 'kultur jaringan', 'fermentasi'], q: ['contoh bioteknologi konvensional', 'contoh bioteknologi modern'],
      a: '**Bioteknologi** adalah pemanfaatan makhluk hidup (terutama mikroorganisme) untuk menghasilkan produk yang berguna bagi manusia.\n- **Konvensional**: tempe (*Rhizopus*), tapai (ragi), yoghurt (*Lactobacillus*), kecap, roti, nata de coco.\n- **Modern**: rekayasa genetika (tanaman tahan hama), kultur jaringan (bibit anggrek), kloning, dan produksi insulin oleh bakteri.' },
    { id: 'pemanasan_global', c: 'IPA · Lingkungan', t: 'Pemanasan global', k: ['pemanasan global', 'global warming', 'perubahan iklim'], q: ['penyebab pemanasan global', 'dampak pemanasan global', 'cara mencegah pemanasan global', 'kenapa bumi makin panas'],
      a: '**Pemanasan global** adalah meningkatnya suhu rata-rata permukaan bumi akibat bertambahnya **gas rumah kaca** (karbon dioksida, metana, dinitrogen oksida) di atmosfer.\n\n**Penyebab**: pembakaran bahan bakar fosil (kendaraan, pabrik, pembangkit listrik), penebangan hutan, dan sampah yang membusuk.\n**Dampak**: es di kutub mencair, permukaan laut naik, cuaca ekstrem, dan terganggunya ekosistem.',
      m: 'Cara mengurangi pemanasan global: hemat listrik, memakai transportasi umum atau bersepeda, menanam pohon, mengurangi sampah plastik, mendaur ulang, dan beralih ke energi terbarukan seperti tenaga surya.' },
    { id: 'efek_rumah_kaca', c: 'IPA · Lingkungan', t: 'Efek rumah kaca', k: ['efek rumah kaca', 'gas rumah kaca'], a: '**Efek rumah kaca** adalah peristiwa terperangkapnya panas matahari di atmosfer bumi oleh gas rumah kaca (CO₂, metana, uap air, N₂O). Secara alami, efek ini penting agar bumi tetap hangat. Namun jika gas rumah kaca berlebihan, panas yang terperangkap makin banyak sehingga terjadi **pemanasan global**.' },
    { id: 'pencemaran', c: 'IPA · Lingkungan', t: 'Pencemaran lingkungan', k: ['pencemaran', 'polusi', 'pencemaran air', 'pencemaran udara', 'pencemaran tanah'], q: ['macam macam pencemaran', 'cara mencegah pencemaran', 'penyebab pencemaran air'],
