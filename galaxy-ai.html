        }
        const direct = inf ? NaN : f(c);
        const nice = (v) => (Number.isFinite(v) ? (S.toFraction(round(v, 5), 1000) ? new Q(round(v, 5)).toString() : fmtN(round(v, 5))) : v > 0 ? '∞' : v < 0 ? '−∞' : 'tidak ada');
        const lines = [`**lim ${x}→${inf ? '∞' : fmtN(c)} ${show(e)}**`, ''];
        if (!inf && Number.isFinite(direct)) lines.push(`Substitusi langsung: f(${fmtN(c)}) = ${nice(direct)}.`);
        else if (!inf) lines.push(`Substitusi langsung menghasilkan bentuk tak tentu (misalnya 0/0), jadi nilai didekati dari kiri dan kanan.`);
        lines.push(`Dari kiri: ${fmtN(round(vL, 6))} · dari kanan: ${fmtN(round(vR, 6))}`, '', `**Nilai limit = ${nice(Number.isFinite(direct) && !inf ? direct : val)}**`);
        return { badge: 'Limit', text: lines.join('\n') };
      }
      // matriks
      const mx = matrix(raw, t);
      if (mx) return mx;
      // SPL 3+ variabel
      const sys = bigSystem(raw);
      if (sys) return sys;
      // kombinasi & permutasi
      m = t.match(/\b(kombinasi|permutasi)\s*(?:dari\s*)?(\d+)\s*(?:dari|,|dan|unsur dari|objek dari)\s*(\d+)/) || t.match(/\b(\d+)\s*([cp])\s*(\d+)\b/);
      if (m) {
        let kind, n, r;
        if (m[1] === 'kombinasi' || m[1] === 'permutasi') {
          kind = m[1];
          let a = Number(m[2]), b = Number(m[3]);
          // "kombinasi 3 dari 10" -> r=3,n=10 ; "kombinasi 10, 3" -> n=10,r=3
          if (/\bdari\b/.test(t.slice(t.indexOf(m[2]) + m[2].length, t.indexOf(m[2]) + m[2].length + 8))) [r, n] = [a, b];
          else [n, r] = a >= b ? [a, b] : [b, a];
        } else {
          kind = m[2] === 'c' ? 'kombinasi' : 'permutasi';
          n = Number(m[1]);
          r = Number(m[3]);
        }
        if (n > 5000) return null;
        const res = kind === 'kombinasi' ? nCr(n, r) : nPr(n, r);
        return { badge: 'Kombinatorika', text: kind === 'kombinasi' ? `**C(${n}, ${r}) = ${groupBig(res.toString())}**\n\nRumus kombinasi: C(n, r) = n! / (r! × (n − r)!). Urutan **tidak** diperhatikan, misalnya memilih ${r} siswa dari ${n} siswa.` : `**P(${n}, ${r}) = ${groupBig(res.toString())}**\n\nRumus permutasi: P(n, r) = n! / (n − r)!. Urutan **diperhatikan**, misalnya menyusun ketua, wakil, dan sekretaris.` };
      }
      // logaritma berbasis
      m = t.match(/\blog(?:aritma)?\s*(?:basis|bilangan pokok|base|_)\s*(\d+(?:[.,]\d+)?)\s*(?:dari\s*)?(\d+(?:[.,]\d+)?)/) || raw.match(/([²³⁴⁵⁶⁷⁸⁹])\s*log\s*(\d+(?:[.,]\d+)?)/i);
      if (m) {
        const b = /[²³⁴⁵⁶⁷⁸⁹]/.test(m[1]) ? '⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(m[1]) : parseNumber(m[1]);
        const v = parseNumber(m[2]);
        const r = Math.log(v) / Math.log(b);
        return { badge: 'Logaritma', text: `**ᵇlog a: log basis ${fmtN(b)} dari ${fmtN(v)} = ${fmtN(round(r, 10))}**\n\nArtinya ${fmtN(b)} dipangkatkan ${fmtN(round(r, 6))} menghasilkan ${fmtN(v)}. Rumus ganti basis: ᵇlog a = log a / log b.` };
      }
      // regresi linear
      if (/\bregresi\b|\bkorelasi\b|garis tren/.test(t)) {
        const mx2 = raw.match(/x\s*[:=]\s*([-\d.,\s;]+?)(?=\s*y\s*[:=])/i);
        const my = raw.match(/y\s*[:=]\s*([-\d.,\s;]+)/i);
        if (mx2 && my) {

  // ===================================================== INTERPRETER
  function interpret(prog) {

  function parseExpr(src) {

    const PREC = [['||'], ['&&'], ['==', '!='], ['<', '<=', '>', '>='], ['+', '-'], ['*', '/', '%']];
    function bin(level) {

    function unary() {

    function post() {

      this.entries.forEach((e, y) => {
        const pats = this.patternsOf(e);
        for (const p of pats) {
          samples.push({ x: featurize(p, DIM), y });
          this.tfidf.add(p, y);
        }
        const body = [e.t, ...(Array.isArray(e.a) ? e.a : [e.a]), e.m || '', e.e || ''].join(' ');
        this.ansIdx.add(body, y);
        const es = new Set();
        for (const w of contentTokens(pats.join(' ') + ' ' + body + ' ' + (e.k || []).join(' '))) {
          const st = stem(w);
          es.add(st);
          this.vocab.add(st);
        }
        this.entryStems[y] = es;
        for (const k of [...(e.k || []), ...(e.kw || [])]) {
          const toks = tokenize(k).map(stem);
          if (toks.length) this.keyIndex.push({ y, toks, len: toks.length });
        }
      });
      this.tfidf.finalize();
      this.ansIdx.finalize();
      this.samples = samples;
      this.dataSig = N.nlp.hash(JSON.stringify([this.entries.map((e) => [e.id, e.q, e.k, e.t]), this.extra])) + ':' + samples.length;
    }

    /** Pelatihan diantrekan: bila data berubah saat otak sedang belajar (sinkron akun, diajari),
     *  pelatihan berikutnya menunggu yang sedang berjalan, sehingga jaringan lama tidak menimpa yang baru. */
    train(onProgress, force = false, reason = 'awal') {
      const run = () => this.trainNow(onProgress, force, reason);
      this._trainQ = (this._trainQ || Promise.resolve()).then(run, run);
      return this._trainQ;
    }

    async trainNow(onProgress, force = false, reason = 'awal') {
      this.ready = false;
      this.prepare();
      this.nets = {};
      this.netStats = this.netStats || {};
      const types = ['seimbang', ...[...(this.wantNets || [])].filter((t) => t !== 'seimbang')];
      for (const t of types) await this.trainNet(t, onProgress, force, reason);
      this.stats = this.netStats.seimbang;
      this.indexDocs();
      this.ready = true;
      this.emit({ type: 'ready', stats: this.stats });
      return this.stats;
    }

    /** Pastikan jaringan untuk model tertentu sudah siap (dilatih bila belum). */
    async ensureNet(type, onProgress) {
      this.wantNets = this.wantNets || new Set();
      this.wantNets.add(type);
      const run = () => {
        if (!this.samples || (this.nets && this.nets[type])) return this.netStats && this.netStats[type];
        return this.trainNet(type, onProgress, false, 'model ' + type);
      };
      this._trainQ = (this._trainQ || Promise.resolve()).then(run, run);
      return this._trainQ;
    }

    async trainNet(type, onProgress, force, reason) {
      const cfg = (N.models && N.models.NETS[type]) || { hidden: HIDDEN, epochs: 14, seed: 1234, lr: 0.15 };
      const t0 = Date.now();
      const net = new N.nn.IntentNet(DIM, cfg.hidden, this.entries.length, cfg.seed);
      const key = type === 'seimbang' ? 'model' : 'model_' + type;
      const sig = MODEL_VERSION + ':' + type + ':' + cfg.hidden + ':' + this.dataSig;
      const cached = !force && store.get(key, null);
      let st;
      if (cached && cached.sig === sig && net.import(cached.w)) {
        st = { ...cached.stats, ms: Date.now() - t0, fromCache: true, type };
      } else {
        const epochs = this.samples.length > 6000 ? Math.max(6, cfg.epochs - 4) : cfg.epochs;
        const res = await net.train(this.samples, {
          epochs,
          lr: cfg.lr,
          dropout: 0.1,
          onProgress: (p) => {
            onProgress && onProgress({ ...p, net: type });
            this.emit({ type: 'progress', ...p, net: type });
          },
        });
        st = { type, topics: this.entries.length, learned: this.learned.length, samples: this.samples.length, params: net.params, vocab: this.vocab.size, accuracy: res.accuracy, loss: res.loss, ms: Date.now() - t0, epochs, at: Date.now(), reason, hidden: cfg.hidden };
        store.set(key, { sig, w: net.export(), stats: st });
        if (N.mem) {
          const log = N.mem.get('trainLog', []);
          log.push({ kind: 'otak', net: type, at: st.at, reason, topics: st.topics, samples: st.samples, accuracy: res.accuracy, loss: res.loss, ms: st.ms, epochs });
          N.mem.set('trainLog', log.slice(-150));
        }
      }
      this.nets = this.nets || {};
      this.nets[type] = net;
      this.netStats = this.netStats || {};
      this.netStats[type] = st;
      if (type === 'seimbang') this.net = net;
      return st;
    }

    // ------------------------------------------------------------------ docs
    indexDocs() {
      this.bm = new BM25();
      this.docSentences = [];
      for (const d of this.docs) {
        const sents = splitSentences(d.text);
        sents.forEach((s, i) => {
          const ref = this.docSentences.length;
          this.docSentences.push({ doc: d, i, s });
          // jendela 2 kalimat agar konteks tidak terputus
          this.bm.add(s + ' ' + (sents[i + 1] || ''), ref);
        });
      }
      this.bm.finalize();
    }
    saveDocs() {
      const ok = store.set('docs', this.docs);
      this.indexDocs();
      return ok;
    }
    addDoc(title, text) {
      const d = { id: 'd' + Date.now().toString(36), title: title || 'Dokumen', text: String(text), added: Date.now() };
      this.docs.push(d);
      if (!this.saveDocs()) {
        this.docs.pop();
        this.indexDocs();
        throw new Error('Penyimpanan browser penuh. Hapus dokumen lama atau gunakan teks yang lebih pendek.');
      }
      return d;
    }
    removeDoc(id) {
      this.docs = this.docs.filter((d) => d.id !== id);
      this.saveDocs();
    }
    setUseDocs(v) {
      this.useDocs = !!v;
      store.set('useDocs', this.useDocs);
    }

    summarize(doc, n = 5) {
      const sents = splitSentences(doc.text);
      if (sents.length <= n) return { sents, keywords: this.keywords(doc.text) };
      const tf = new Map();
      for (const s of sents) for (const w of contentTokens(s).map(stem)) if (w.length > 2) tf.set(w, (tf.get(w) || 0) + 1);
      const scored = sents.map((s, i) => {
        const ws = contentTokens(s).map(stem).filter((w) => w.length > 2);
        let sc = 0;
        for (const w of ws) sc += Math.log(1 + (tf.get(w) || 0));
        sc /= Math.sqrt(ws.length + 1);
        if (i === 0) sc *= 1.35;
        if (s.length < 25) sc *= 0.5;
        return { s, i, sc };
      });
      const top = [...scored].sort((a, b) => b.sc - a.sc).slice(0, n).sort((a, b) => a.i - b.i);
      return { sents: top.map((x) => x.s), keywords: this.keywords(doc.text) };
    }
    keywords(text, n = 8) {
      const tf = new Map();
      const surface = new Map();
      for (const w of contentTokens(text)) {
        if (w.length < 4 || /^\d+$/.test(w)) continue;
        const s = stem(w);
        tf.set(s, (tf.get(s) || 0) + 1);
        if (!surface.has(s)) surface.set(s, w);
      }
      return [...tf].sort((a, b) => b[1] - a[1]).slice(0, n).map(([s]) => surface.get(s));
    }
    searchDocs(q) {
      if (!this.docs.length || !this.bm) return [];
      return this.bm.search(q, 3).map((r) => ({ ...r, ...this.docSentences[r.ref] }));
    }

    // ---------------------------------------------------------------- learning
    teach(questions, answer, title) {
      const qs = (Array.isArray(questions) ? questions : String(questions).split('\n')).map((s) => s.trim()).filter(Boolean);
      if (!qs.length || !String(answer).trim()) throw new Error('Pertanyaan dan jawaban wajib diisi.');
      const entry = { id: 'u' + Date.now().toString(36) + Math.floor(Math.random() * 1e4), c: 'Diajarkan pengguna', t: title || capitalize(qs[0]).slice(0, 80), q: qs, a: String(answer).trim(), added: Date.now() };
      this.learned.push(entry);
      store.set('learned', this.learned);
      return entry;
    }
    updateLearned(id, patch) {
      const e = this.learned.find((x) => x.id === id);
      if (!e) return;
      Object.assign(e, patch);
      store.set('learned', this.learned);
    }
    forget(id) {
      this.learned = this.learned.filter((e) => e.id !== id);
      store.set('learned', this.learned);
    }
    /** Umpan balik positif: frasa pengguna ditambahkan sebagai contoh latih baru untuk topik itu. */
    reinforce(id, question) {
      const q = normalize(question);
      if (!q || !this.byId.has(id)) return false;
      const list = (this.extra[id] = this.extra[id] || []);
      if (list.includes(q) || this.patternsOf(this.entries[this.byId.get(id)]).includes(q)) return false;
      list.push(q);
      store.set('extra', this.extra);
      return true;
    }
    resetAll() {
      for (const k of ['memory', 'learned', 'docs', 'extra', 'model', 'chats', 'settings', 'useDocs', 'context', 'trainLog', 'lab']) store.set(k, null);
      this.lastEntry = null;
      this.reload();
    }
    saveMemory() {
      store.set('memory', this.memory);
    }
    addFact(key, value, text, single) {
      const facts = this.memory.facts;
      const norm = (x) => normalize(x);
      if (single) this.memory.facts = facts.filter((f) => f.key !== key);
      else if (facts.some((f) => f.key === key && norm(f.value) === norm(value))) return this.memory.facts.find((f) => f.key === key && norm(f.value) === norm(value));
      const f = { id: 'f' + Date.now().toString(36) + Math.floor(Math.random() * 1000), key, value, text, at: Date.now() };
      this.memory.facts.push(f);
      this.saveMemory();
      return f;
    }
    removeFact(id) {
      this.memory.facts = this.memory.facts.filter((f) => f.id !== id);
      this.saveMemory();
    }

    /** Menangkap fakta pribadi dari kalimat seperti "aku suka sepak bola" atau "hobiku membaca". */
    captureFact(raw) {
      let t = raw.replace(/([A-Za-z])-(?=[A-Za-z])/g, '$1 ').replace(/\s+/g, ' ').trim().replace(/[.!?]+$/, '');
      t = t.replace(/^(?:tolong\s+)?(?:ingat(?:lah|kan)?|catat(?:lah)?)(?:\s+ya)?,?\s*(?:bahwa\s+|kalau\s+)?/i, '');
      let m = t.match(FACT_RE);
      if (m) {
        const verb = m[1].toLowerCase();
        const value = m[2].trim();
        if (/^(kamu|nalar|kau|dirimu|kamu sih)$/i.test(value) || !value) return null;
        if (/^(apa|berapa|di ?mana|kapan|siapa|mana|bagaimana|gimana)\b/i.test(value) || /\?\s*$/.test(raw)) return null;
        for (const [re, key, single, say] of FACT_VERBS) {
          if (!re.test(verb)) continue;
          const text = say ? say(value) : `${verb} ${value}`;
          return this.addFact(key, value, text, single);
        }
      }
      m = t.match(FAV_RE);
      if (m) {
        const k = m[1].toLowerCase();
        const value = m[2].trim();
        if (/^(apa|berapa|di ?mana|kapan|siapa|mana)\b/i.test(value) || /\?\s*$/.test(raw)) return null;
        const key = ASK_KEY[k] || k;
        const text = /favorit/.test(k) ? `${k}mu ${value}` : key === 'umur' ? `berumur ${value}` : key === 'kelas' ? `kelas ${value}` : key === 'sekolah' ? `bersekolah di ${value}` : key === 'cita-cita' ? `bercita-cita menjadi ${value}` : `${k}mu ${value}`;
        return this.addFact(key, value, text, key !== 'hobi');
      }
      return null;
    }

    aboutUser() {
      const lines = [];
      if (this.memory.name) lines.push(`- Namamu **${this.memory.name}**.`);
      for (const f of this.memory.facts) lines.push(`- Kamu ${f.text}. _(diingat ${when(f.at)})_`);
      return lines;
    }

    /** Mencari obrolan lama yang membahas suatu topik. */
    searchChats(topic, excludeId) {
      const chats = store.get('chats', []).filter((c) => c.id !== excludeId && c.msgs && c.msgs.length);
      if (!chats.length) return [];
      const bm = new BM25();
      chats.forEach((c, i) => bm.add(c.title + ' ' + c.msgs.filter((m) => m.r === 'u').map((m) => m.t).join(' ') + ' ' + c.msgs.filter((m) => m.r === 'a').map((m) => m.t.slice(0, 160)).join(' '), i));
      bm.finalize();
      return bm.search(topic, 4).filter((r) => r.hits >= Math.min(1, r.qlen)).map((r) => chats[r.ref]);
    }
    setName(name) {
      this.memory.name = name;
      store.set('memory', this.memory);
    }

    // ----------------------------------------------------------------- answer
    fill(text) {
      const h = new Date().getHours();
      const sapa = h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam';
      const name = this.memory.name ? ', ' + this.memory.name : '';
      return text.replace(/\{sapa\}/g, sapa).replace(/\{nama\}/g, name);
    }
    pick(a) {
      return Array.isArray(a) ? a[Math.floor(Math.random() * a.length)] : a;
    }

    classify(text, netType) {
      const x = featurize(text, DIM);
      const nets = this.nets || { seimbang: this.net };
      const main = (netType && nets[netType]) || this.net;
      const pr = main.predict(x, 8);
      let probs = Float32Array.from(main._p);
      if (netType === 'cermat' && nets.cermat && nets.seimbang && nets.seimbang !== main) {
        // ensembel: rata-rata dua jaringan
        nets.seimbang.forward(x);
        const p2 = nets.seimbang._p;
        for (let i = 0; i < probs.length; i++) probs[i] = (probs[i] + p2[i]) / 2;
        const idx = Array.from(probs.keys()).sort((a, b) => probs[b] - probs[a]).slice(0, 8);
        pr.top = idx.map((i) => ({ i, p: probs[i] }));
      }
      const tf = this.tfidf.query(text);
      const cos = new Map();
      for (const r of tf.slice(0, 40)) if (!cos.has(r.ref)) cos.set(r.ref, r.score);
      // kecocokan kata kunci (frasa terpanjang diutamakan)
      const qStems = tokenize(text).map(stem);
      const qContent = contentTokens(text).length || 1;
      const kw = new Map();
      const qs = ' ' + qStems.join(' ') + ' ';
      for (const k of this.keyIndex) {
        if (qs.includes(' ' + k.toks.join(' ') + ' ')) {
          const sc = Math.min(1, (k.len + 0.5) / (qContent + 0.5));
          if (sc > (kw.get(k.y) || 0)) kw.set(k.y, sc);
        }
      }
      const ans = new Map();
      for (const r of this.ansIdx.query(text).slice(0, 10)) ans.set(r.ref, r.score);
      // cakupan: berapa banyak kata isi yang pernah dipelajari
      const cTok = contentTokens(text).map(stem);
      const known = cTok.filter((w) => this.vocab.has(w)).length;
      const coverage = cTok.length ? known / cTok.length : 1;
      const cand = new Set([...pr.top.map((t) => t.i), ...[...cos.keys()].slice(0, 8), ...kw.keys(), ...[...ans.keys()].slice(0, 4)]);
      const scored = [...cand].map((y) => {
        const p = probs[y];
        const c = cos.get(y) || 0;
        const k = kw.get(y) || 0;
        const a = ans.get(y) || 0;
        const raw = 0.45 * p + 0.25 * c + 0.15 * k + 0.15 * a + (k > 0.6 && c > 0.3 ? 0.08 : 0);
        // berapa banyak kata isi pertanyaan yang "dijelaskan" oleh topik ini
        const es = this.entryStems[y];
        const ex = cTok.length ? cTok.filter((w) => es.has(w)).length / cTok.length : 1;
        return { y, p, c, k, a, ex, score: raw * (0.3 + 0.7 * ex) };
      });
      scored.sort((a, b) => b.score - a.score);
      return { scored, hidden: pr.hidden, coverage };
    }

    entryAnswer(e) {
      return this.fill(this.pick(e.a));
    }

    respond(input, ctx = {}) {
      const raw = String(input || '').trim();
      const think = [];
      const t = N.skills.lite(raw);
      const norm = normalize(raw);
      think.push({ k: 'Normalisasi', v: norm ? `"${norm}"` : '(kosong)' });
      if (!norm && !/\d/.test(raw)) return { text: 'Silakan ketik pertanyaan atau perintah.', badge: 'Galaxy', think };

      // 0) chatbot buatan pengguna
      if (ctx.bot && N.bots) {
        const ans = N.bots.answerSync(ctx.bot);
        const r = ans && ans(raw);
        if (r) {
          think.push({ k: 'Chatbot', v: `${ctx.bot.name} menemukan jawaban (yakin ${(r.conf * 100).toFixed(0)}%)` });
          return { text: r.text, badge: ctx.bot.name, think, skill: 'bot', confidence: Math.min(0.99, r.conf + 0.2) };
        }
        think.push({ k: 'Chatbot', v: `${ctx.bot.name} tidak menemukan jawaban di daftar tanya-jawabnya` });
        if (!ctx.bot.useKB) {
          if (ctx.bot.useSkills) {
            const t2 = N.skills.lite(raw);
            for (const sk of N.skills.list) {
              let rr = null;
              try {
                rr = sk.run(raw, t2);
              } catch (e) {}
              if (rr) return { text: rr.text, badge: rr.badge || sk.name, think, skill: sk.id };
            }
          }
          return { text: ctx.bot.fallback || 'Maaf, saya belum tahu jawabannya.', badge: ctx.bot.name, think, unknown: true, botFallback: true };
        }
      }

      // 1) perintah ingatan
      let m = raw.match(/(?:^|[\s,.!])(?:nama\s*(?:ku|saya|aku|gue|gw)\s*(?:adalah|ialah)?|panggil\s*(?:aku|saya)|perkenalkan,?\s*(?:aku|saya))\s+([A-Za-zÀ-ÿ']{2,20}(?:\s+[A-Za-zÀ-ÿ']{2,20}){0,2})/i);
      if (m && !/\b(siapa|apa)\b.*\bnama/i.test(raw) && !/^(siapa|apa|kamu|nalar)$/i.test(m[1])) {
        const stopAt = /^(dan|dari|kelas|umur|usia|aku|saya|mau|ingin|tinggal|sekolah|di|yang)$/i;
        const parts = [];
        for (const w of m[1].split(/\s+/)) {
          if (stopAt.test(w)) break;
          parts.push(capitalize(w.toLowerCase()));
        }
        const name = parts.join(' ');
        if (name) {
          this.setName(name);
          think.push({ k: 'Ingatan', v: `Menyimpan nama pengguna: ${name}` });
          const greet = /\b(halo|hai|hi|hello|assalamualaikum|selamat)\b/i.test(raw) ? this.fill('{sapa}, ') : '';
          return { text: `${greet}${greet ? '' : 'Senang berkenalan, '}**${name}**! ${greet ? 'Senang berkenalan. ' : ''}Saya akan mengingat namamu di perangkat ini. Ada yang ingin kamu pelajari?`, badge: 'Ingatan', think };
        }
      }
      if (/\b(siapa nama(ku| saya| aku)|kamu ingat nama(ku| saya)|tahu nama(ku| saya))\b/.test(norm)) {
        think.push({ k: 'Ingatan', v: 'Membaca nama pengguna' });
        return { text: this.memory.name ? `Namamu **${this.memory.name}**. 😊` : 'Saya belum tahu namamu. Ketik misalnya "nama saya Rina".', badge: 'Ingatan', think };
      }
      const fact = this.captureFact(raw);
      if (fact) {
        think.push({ k: 'Ingatan', v: `Fakta pribadi disimpan permanen: "${fact.text}"` });
        return { text: `Oke, saya ingat: kamu **${fact.text}**. 📝\n\nIngatan ini tersimpan permanen. Kamu bisa melihat atau menghapusnya di menu **Memori**.`, badge: 'Ingatan', think };
      }
      m = raw.match(/^(?:tolong\s+)?(?:ingat(?:lah|kan)?|catat(?:lah)?|pelajari)\s*(?:bahwa|kalau|:)?\s*(.+?)\s+(adalah|ialah|merupakan|yaitu|itu|=)\s+(.+)$/i);
      if (m) {
        const subj = m[1].replace(/[:"']/g, '').trim();
        const ans = m[3].trim().replace(/[.!]+$/, '');
        const qs = [subj, `apa ${subj}`, `apa itu ${subj}`, `${subj} apa`, `siapa ${subj}`, `${subj} itu apa`];
        const entry = this.teach(qs, `${capitalize(subj)} ${m[2] === '=' ? 'adalah' : m[2].toLowerCase()} ${ans}.`, capitalize(subj));
        think.push({ k: 'Belajar', v: `Pengetahuan baru disimpan: "${subj}"` });
        return { text: `Siap, saya sudah mencatat: **${capitalize(subj)} ${m[2] === '=' ? 'adalah' : m[2].toLowerCase()} ${ans}.**\n\nSaya sedang melatih ulang jaringan saraf agar bisa menjawabnya nanti.`, badge: 'Belajar', think, retrain: true, learnedId: entry.id };
      }
      if (/^(lupakan|hapus) (semua )?(namaku|nama saya)/.test(norm)) {
        this.setName('');
        return { text: 'Baik, saya sudah melupakan namamu.', badge: 'Ingatan', think };
      }
      const mem = this.memoryIntent(raw, norm, think, ctx);
      if (mem) return mem;

      // 2) lanjutan konteks
      if (this.lastEntry && /^(jelaskan )?(lebih (lanjut|detail|lengkap|dalam)|selengkapnya|detailnya|lanjutkan|lanjut|terus|jelaskan lagi|penjelasan lebih lanjut)$/.test(norm)) {
        const e = this.lastEntry;
        think.push({ k: 'Konteks', v: `Melanjutkan topik sebelumnya: ${e.t}` });
        if (e.m) return { text: this.fill(e.m), badge: e.c, think, chips: e.e ? ['Beri contoh'] : [], entry: e };
        return { text: `Itu sudah penjelasan terlengkap yang saya punya tentang **${e.t}**. Kamu bisa menambah pengetahuan saya lewat menu **Ajari**.`, badge: e.c, think };
      }
      if (this.lastEntry && /^(beri |berikan |kasih |ada )?(contoh|contohnya|contoh nya|misalnya|contoh soal)( dong| nya| ya)?$/.test(norm)) {
        const e = this.lastEntry;
        think.push({ k: 'Konteks', v: `Contoh untuk topik: ${e.t}` });
        if (e.e) return { text: this.fill(e.e), badge: e.c, think, chips: e.m ? ['Jelaskan lebih lanjut'] : [], entry: e };
        return { text: `Saya belum punya contoh untuk **${e.t}**.`, badge: e.c, think };
      }

      // 3) dokumen: perintah ringkas
      if (this.docs.length && /\b(ringkas|rangkum|ringkasan|rangkuman|intisari|kesimpulan|summary)\b/.test(norm) && /\b(dokumen|teks|bacaan|file|materi|artikel|itu|ini)\b/.test(norm)) {
        const doc = this.findDoc(norm) || this.docs[this.docs.length - 1];
        const sm = this.summarize(doc, 5);
        think.push({ k: 'Dokumen', v: `Meringkas "${doc.title}" dengan pemeringkatan kalimat (TF + posisi)` });
        return { text: `**Ringkasan "${doc.title}"**\n\n${sm.sents.map((s) => '- ' + s).join('\n')}\n\n**Kata kunci:** ${sm.keywords.join(', ')}`, badge: 'Dokumen', think };
      }

      // 3b) kreasi, tugas terjadwal, chatbot
      const created = this.createIntent(raw, ctx, think);
      if (created) return created;

      // 4) modul nalar
      for (const sk of N.skills.list) {
        let r = null;
        try {
          r = sk.run(raw, t);
        } catch (err) {
          think.push({ k: sk.name, v: 'Galat: ' + err.message });
        }
        if (r) {
          think.push({ k: 'Modul nalar', v: `${sk.name} mengenali pertanyaan ini` });
          for (const s of r.steps || []) think.push({ k: sk.name, v: s });
          return { text: r.text, badge: r.badge || sk.name, think, skill: sk.id };
        }
      }
      think.push({ k: 'Modul nalar', v: 'Tidak ada modul hitung yang cocok' });

      if (!this.ready) return { text: 'Sebentar, saya masih belajar. Coba lagi beberapa detik lagi.', badge: 'Galaxy', think };

      // 5) jaringan saraf + TF-IDF
      const model = N.models ? N.models.get(ctx.model) : { id: 'seimbang', net: 'seimbang' };
      const cl = this.classify(raw, model.net);
      think.push({ k: 'Model', v: `${model.name || 'nova-pro'} (${model.level || 'Tier 2'}): jaringan ${model.net}${model.net === 'cermat' && this.nets && this.nets.cermat ? ' (ensembel 2 jaringan)' : ''}` });
      const best = cl.scored[0];
      const top3 = cl.scored.slice(0, 3).map((s) => ({ t: this.entries[s.y].t, score: s.score, p: s.p, c: s.c, k: s.k, a: s.a }));
      think.push({ k: 'Jaringan saraf', v: top3.map((s) => `${s.t} ${(s.p * 100).toFixed(1)}%`).join(' · ') });
      think.push({ k: 'TF-IDF & kata kunci', v: top3.map((s) => `${s.t}: pola ${s.c.toFixed(2)}, isi ${s.a.toFixed(2)}, kunci ${s.k.toFixed(2)}`).join(' · ') });
      think.push({ k: 'Cakupan kosakata', v: `${(cl.coverage * 100).toFixed(0)}% kata isi pernah dipelajari` });

      // 6) dokumen relevan
      let docHit = null;
      if (this.useDocs && this.docs.length) {
        const hits = this.searchDocs(raw);
        if (hits.length) {
          const h = hits[0];
          const conf = h.wcov * (h.hits >= 2 || h.qlen <= 2 ? 1 : 0.6);
          docHit = { hits, conf };
          think.push({ k: 'Dokumen', v: `Kalimat terdekat di "${h.doc.title}" (skor BM25 ${h.score.toFixed(2)}, ${h.hits} dari ${h.qlen} kata kunci cocok, cakupan berbobot ${(h.wcov * 100).toFixed(0)}%)` });
        }
      }

      const conf = best ? best.score : 0;
      const entry = best ? this.entries[best.y] : null;
      const strong = conf >= 0.36 || (best && best.p > 0.5 && best.c > 0.3 && conf >= 0.3);
      // dokumen menang bila ia mencakup kata penting yang tidak dijelaskan topik pengetahuan terbaik
      const docExtra = docHit && entry ? docHit.hits[0].terms.some((w) => !this.entryStems[best.y].has(w)) : !!docHit;
      if (docHit && docHit.conf >= 0.5 && (!strong || docHit.conf >= conf + 0.05 || (docExtra && docHit.conf >= 0.6))) {
        const h = docHit.hits[0];
        const sents = splitSentences(h.doc.text);
        const ctx = [sents[h.i], sents[h.i + 1]].filter(Boolean).join(' ');
        const others = docHit.hits.slice(1).filter((x) => x.doc.id === h.doc.id && Math.abs(x.i - h.i) > 1).slice(0, 1);
        let text = `Menurut dokumen **"${h.doc.title}"**:\n\n> ${ctx}`;
        if (others.length) text += `\n\n> ${others[0].s}`;
        think.push({ k: 'Keputusan', v: `Jawab dari dokumen (yakin ${(docHit.conf * 100).toFixed(0)}%)` });
        return { text, badge: 'Dokumen', think, confidence: docHit.conf, hidden: cl.hidden };
      }
      if (entry && strong) {
        this.lastEntry = entry;
        const chips = [];
        if (entry.m) chips.push('Jelaskan lebih lanjut');
        if (entry.e) chips.push('Beri contoh');
        think.push({ k: 'Keputusan', v: `Jawab dari pengetahuan: ${entry.t} (yakin ${(conf * 100).toFixed(0)}%)` });
        const styled = N.models ? N.models.styleAnswer(model.id, entry, this.entryAnswer(entry), this) : this.entryAnswer(entry);
        // model Cermat/Hitung sudah menyertakan penjelasan lanjutan (dan contoh) di jawabannya
        const shown = model.tier >= 3 ? ['Jelaskan lebih lanjut', 'Beri contoh'] : model.tier === 2 ? ['Jelaskan lebih lanjut'] : [];
        const chips2 = chips.filter((c) => !shown.includes(c));
        return { text: styled, badge: entry.c, think, confidence: Math.min(0.99, conf + 0.25), hidden: cl.hidden, chips: chips2, entry, top: top3 };
      }
      if (entry && conf >= 0.22) {
        const alts = cl.scored.slice(0, 3).filter((s) => s.score >= 0.18).map((s) => this.entries[s.y]);
        this.lastEntry = entry;
        think.push({ k: 'Keputusan', v: `Kurang yakin (${(conf * 100).toFixed(0)}%), menawarkan beberapa kemungkinan` });
        const chips = alts.slice(1).map((e) => e.t);
        return {
          text: `Saya kurang yakin, tetapi mungkin maksudmu **${entry.t}**:\n\n${this.entryAnswer(entry)}`,
          badge: entry.c,
          think,
          confidence: conf,
          hidden: cl.hidden,
          chips,
          entry,
          unsure: true,
          top: top3,
        };
      }
      think.push({ k: 'Keputusan', v: `Tidak ada topik yang cukup cocok (skor tertinggi ${(conf * 100).toFixed(0)}%)` });
      const sugg = cl.scored.slice(0, 3).filter((s) => s.score > 0.15 && s.ex > 0).map((s) => this.entries[s.y].t);
      let text = 'Maaf, saya **belum tahu** jawabannya. Pengetahuan saya terbatas karena saya AI mandiri yang tidak terhubung ke internet.\n\n';
      text += 'Kamu bisa **mengajari saya**: tekan tombol **Ajari** di bawah, atau ketik "ingat bahwa ... adalah ...".';
      if (this.docs.length && !this.useDocs) text += '\n\nPencarian di dokumen sedang dimatikan. Nyalakan di menu **Dokumen**.';
      return { text, badge: 'Belum tahu', think, unknown: true, chips: sugg, hidden: cl.hidden, confidence: conf };
    }

    memoryIntent(raw, norm, think, ctx) {
      const t = N.skills.lite(raw).replace(/[?.!]+$/, '');
      // lupakan fakta
      let m = t.match(/^(?:tolong )?lupakan (?:semua|semuanya) (?:tentang|soal) (?:aku|saya|diriku)$/);
      if (m) {
        this.memory.facts = [];
        this.memory.name = '';
        this.saveMemory();
        think.push({ k: 'Ingatan', v: 'Semua fakta pribadi dihapus' });
        return { text: 'Baik, semua yang saya ingat tentang dirimu sudah saya hapus.', badge: 'Ingatan', think };
      }
      m = t.match(/^(?:tolong )?(?:lupakan|hapus ingatan) (?:bahwa |kalau )?(?:aku|saya) (.+)$/);
      if (m) {
        const q = normalize(m[1]);
        const hit = this.memory.facts.filter((f) => normalize(f.text).includes(q) || q.includes(normalize(f.value)));
        if (!hit.length) return { text: 'Saya tidak menemukan ingatan itu tentang dirimu.', badge: 'Ingatan', think };
        hit.forEach((f) => this.removeFact(f.id));
        return { text: `Baik, saya sudah melupakan bahwa kamu ${hit.map((f) => f.text).join(' dan ')}.`, badge: 'Ingatan', think };
      }
      // pertanyaan tentang diri pengguna
      const askKey = t.match(/\b(?:apa|berapa|di ?mana|kapan|siapa)\s+(hobi|cita cita|kelas|sekolah|umur|usia|(?:makanan|minuman|warna|pelajaran|mapel|olahraga|hewan|lagu|film|buku|tim|guru|tokoh) favorit)\s*(?:ku|saya|aku)\b/) ||
        t.match(/\b(hobi|cita cita|kelas|sekolah|umur|usia|(?:makanan|minuman|warna|pelajaran|mapel|olahraga|hewan|lagu|film|buku|tim|guru|tokoh) favorit)\s*(?:ku|saya|aku)\s+(?:apa|berapa|di ?mana|kapan|siapa)\b/) ||
        t.match(/^(?:aku|saya)\s+(suka|kelas|sekolah|tinggal|lahir|alergi)\s+(?:apa|berapa|di ?mana|kapan)(?:\s+(?:saja|aja|sih|ya))?$/) ||
        t.match(/^apa (?:saja |aja )?yang (?:aku|saya) (suka)$/);
      if (askKey) {
        const k0 = askKey[1];
        const key = ASK_KEY[k0] || k0;
        const fs = this.memory.facts.filter((f) => f.key === key);
        think.push({ k: 'Ingatan', v: `Mencari fakta pribadi: ${key}` });
        if (!fs.length) return { text: `Kamu belum pernah memberi tahu saya soal itu. Ceritakan saja, misalnya "${key === 'suka' ? 'aku suka membaca' : key === 'kelas' ? 'aku kelas 8' : key === 'hobi' ? 'hobiku menggambar' : 'aku ' + key + ' ...'}", nanti saya ingat selamanya.`, badge: 'Ingatan', think };
        return { text: fs.length === 1 ? `Kamu ${fs[0].text}. Kamu memberi tahu saya ${when(fs[0].at)}.` : `Yang saya ingat:\n${fs.map((f) => `- Kamu ${f.text}`).join('\n')}`, badge: 'Ingatan', think };
      }
      if (/\b(?:apa (?:saja |aja )?yang (?:kamu|nalar|kau) (?:ingat|tahu|ketahui|kenal) (?:tentang|soal|dari) (?:aku|saya|diriku)|kamu (?:ingat|kenal) (?:aku|saya)|ceritakan tentang (?:aku|saya|diriku)|siapa (?:aku|saya) (?:menurutmu|bagimu))\b|^siapa (?:aku|saya)$|^(?:kamu|nalar) ingat apa(?: saja| aja)?$|^apa (?:saja |aja )?yang kamu ingat$/.test(t)) {
        const lines = this.aboutUser();
        const chats = store.get('chats', []);
        const learned = this.learned.length;
        think.push({ k: 'Ingatan', v: `Membaca memori permanen: ${lines.length} fakta, ${chats.length} obrolan` });
        let text = lines.length ? `Ini yang saya ingat tentang dirimu:\n\n${lines.join('\n')}` : 'Saya belum tahu banyak tentang dirimu. Ceritakan saja, misalnya "nama saya Rina", "aku kelas 8", atau "aku suka sepak bola". Semuanya saya simpan permanen.';
        text += `\n\nSelain itu saya menyimpan **${chats.length} obrolan** kita${learned ? ` dan **${learned} hal** yang kamu ajarkan` : ''}. Lihat semuanya di menu **Memori**.`;
        return { text, badge: 'Ingatan', think };
      }
      // ingatan obrolan lama
      let topic = null;
      m = t.match(/\b(?:pernah|sudah|kapan)\s+(?:kita\s+|aku\s+|saya\s+|kamu\s+)?(?:bahas|membahas|tanya|bertanya|tanyakan|menanyakan|bicarakan|membicarakan|ngobrol(?:in)?|mengobrol|belajar|mempelajari)\s+(?:tentang\s+|soal\s+|mengenai\s+)?(.+?)(?:\s+(?:ya|kah|tidak|belum|gak|nggak|sebelumnya|dulu|ga))?$/);
      if (m && !/^(apa|apa saja|apa aja|sebelumnya|kemarin|tadi|dulu|belum|apa saja sebelumnya)$/.test(m[1])) topic = m[1];
      const listAsk = /\b(?:apa|topik apa|materi apa)\s+(?:saja\s+|aja\s+)?yang\s+(?:sudah\s+|pernah\s+|tadi\s+|kemarin\s+)?(?:kita|aku|saya)\s+(?:bahas|bicarakan|obrolkan|tanyakan|pelajari)|\b(?:obrolan|percakapan|chat)\s+(?:kita\s+)?(?:sebelumnya|terakhir|kemarin|yang lalu)|\b(?:kemarin|sebelumnya|tadi|dulu)\s+(?:kita|aku|saya)\s+(?:bahas|membahas|ngobrol|bicara|tanya|belajar)|\bkamu ingat obrolan/.test(t);
      if (!topic && listAsk) {
        const mt = t.match(/\b(?:tentang|soal|mengenai)\s+(.+)$/);
        if (mt) topic = mt[1];
      }
      if (topic) {
        const hits = this.searchChats(topic, ctx.chatId);
        think.push({ k: 'Ingatan obrolan', v: `Mencari "${topic}" di ${store.get('chats', []).length} obrolan tersimpan (BM25)` });
        if (!hits.length) return { text: `Saya tidak menemukan obrolan lama tentang **${topic}**. Mau membahasnya sekarang?`, badge: 'Ingatan', think, chips: [topic] };
        return {
          text: `Ya, kita pernah membahas **${topic}**:\n\n${hits.map((c) => `- **${c.title}**, ${when(c.updated)}`).join('\n')}`,
          badge: 'Ingatan', think, links: hits.map((c) => ({ id: c.id, title: c.title })),
        };
      }
      if (listAsk) {
        const chats = store.get('chats', []).filter((c) => c.id !== ctx.chatId && c.msgs && c.msgs.length).slice(0, 6);
        think.push({ k: 'Ingatan obrolan', v: `Membaca ${chats.length} obrolan terakhir dari memori` });
        if (!chats.length) return { text: 'Ini obrolan pertama kita yang tersimpan. Mulai sekarang semua obrolan saya ingat.', badge: 'Ingatan', think };
        return { text: `Obrolan kita sebelumnya:\n\n${chats.map((c) => `- **${c.title}**, ${when(c.updated)}`).join('\n')}`, badge: 'Ingatan', think, links: chats.map((c) => ({ id: c.id, title: c.title })) };
      }
      return null;
    }

    /** Permintaan membuat sesuatu: tugas terjadwal, gambar, animasi, video, presentasi, Word, Excel, kode, kuis, cerita. */
    createIntent(raw, ctx, think) {
      const L = N.skills.lite(raw);
      const model = N.models ? N.models.get(ctx.model) : { id: 'seimbang' };
      const make = /\b(buat|buatkan|bikin|bikinkan|bikinin|tulis|tuliskan|susun|susunkan|rancang|hasilkan|generate|gambarkan|lukis|lukiskan|rekam|jadikan|ciptakan|minta)\b/.test(L);
      const topicOf = (s) => {
        const m = s.match(/\b(?:tentang|mengenai|materi|topik|bertema|soal|untuk materi)\s+(.+?)(?:\s+(?:dalam|di|ke|sebanyak|dengan|berisi|warna|tema|format)\b.*)?$/i);
        if (m) return m[1].replace(/[.?!]+$/, '').trim();
        return s.replace(/\b(tolong|buat|buatkan|bikin|bikinkan|bikinin|susun|susunkan|rancang|hasilkan|sebuah|satu|file|berkas|presentasi|slide|salindia|powerpoint|pptx?|dokumen|word|docx|docs|excel|xlsx|video|dalam|format|untuk|saya|aku|dong|ya)\b/gi, ' ').replace(/\d+\s*(slide|halaman|detik)/gi, ' ').replace(/\s+/g, ' ').trim();
      };
      const art = (kind, spec, text, badge) => {
        think.push({ k: 'Kreasi', v: `Membuat ${badge.toLowerCase()} dengan pembangkit milik Galaxy sendiri` });
        return { text, badge, think, art: { kind, spec }, skill: 'kreasi' };
      };
      // tugas terjadwal
      if (N.tasks) {
        const tp = N.tasks.parse(raw);
        if (tp) {
          think.push({ k: 'Penjadwal', v: tp.error ? 'Waktu belum jelas' : `Jadwal dikenali: ${N.tasks.describe(tp.schedule)}` });
          if (tp.error) return { text: tp.error, badge: 'Tugas terjadwal', think, skill: 'tugas' };
          const task = N.tasks.makeTask(tp);
          return { text: `Siap! Tugas **${task.title}** dijadwalkan **${N.tasks.describe(task.schedule)}**.\n\nBerikutnya: **${N.tasks.fmtWhen(task.next)}**. Saya akan memberi notifikasi saat waktunya tiba. Jika Galaxy sedang ditutup, tugas dijalankan begitu Galaxy dibuka lagi (atau oleh mesin latar bila aktif).`, badge: 'Tugas terjadwal', think, skill: 'tugas', newTask: task, chips: ['Lihat semua tugas'] };
        }
      }
      if (/\b(chatbot|chat bot)\b/.test(L) && (make || /\bchatbot\b/.test(L))) {
        return { text: 'Kamu bisa membuat chatbot sendiri, misalnya **Bot Info Sekolah** yang menjawab pertanyaan tentang jadwal, PPDB, atau ekstrakurikuler. Isi pertanyaan dan jawabannya, coba langsung, lalu pasang di website sekolah. Saya bukakan menu **Chatbot**.', badge: 'Chatbot', think, skill: 'chatbot', openView: 'chatbot' };
      }
      if (!N.studio || !N.content || !N.codegen || !N.models) return null;
      // video
      if (/\bvideo\b/.test(L) && (make || /^video\b/.test(L))) {
        const v = N.studio.parseVideo(raw);
        if (v.source === 'slides') {
          const pres = N.content.presentation(this, v.topic, { max: 8 });
          v.slides = pres.slides;
          v.theme = pres.theme;
          v.title = 'Video: ' + pres.title;
        }
        return art('video', v, `Video **${v.title.replace(/^Video:?\s*/, '')}** berdurasi **${v.seconds} detik** siap direkam. Tekan **Rekam video** untuk membuat berkas WEBM, lalu unduh.${v.source === 'slides' ? ' Isinya diambil dari pengetahuan saya tentang topik itu.' : ''}`, 'Video');
      }
      // presentasi
      if (/\b(presentasi|slide|salindia|ppt|pptx|powerpoint)\b/.test(L) && (make || /^(presentasi|slide)\b/.test(L))) {
        const topic = topicOf(raw);
        const max = Number((L.match(/(\d+)\s*slide/) || [])[1] || 12);
        const theme = /biru/.test(L) ? 'biru' : /jingga|oranye/.test(L) ? 'jingga' : /ungu/.test(L) ? 'ungu' : /gelap|hitam/.test(L) ? 'gelap' : 'hijau';
        const spec = N.content.presentation(this, topic, { max: max + 1, theme });
        return art('pptx', spec, `Presentasi **${spec.title}** berisi **${spec.slides.length} slide**${spec.known ? ', disusun dari pengetahuan saya' : '. Saya belum punya materi tentang topik ini, jadi isinya berupa kerangka yang bisa kamu lengkapi'}. Geser untuk melihat setiap slide, lalu unduh sebagai PowerPoint (.pptx).`, 'Presentasi');
      }
      // excel
      const xlsxWords = /\b(excel|xlsx|spreadsheet|lembar kerja|google sheets?)\b/.test(L);
      if (xlsxWords || (make && /\b(tabel perkalian|daftar nilai|daftar hadir|absensi|presensi|catatan keuangan|buku kas|jadwal pelajaran|tabel periodik|data planet|tabel konversi suhu)\b/.test(L))) {
        const kind = /perkalian/.test(L) ? 'perkalian' : /nilai|rapor|raport/.test(L) ? 'nilai' : /hadir|absen|presensi/.test(L) ? 'absensi' : /periodik|unsur/.test(L) ? 'periodik' : /suhu/.test(L) ? 'suhu' : /jadwal/.test(L) ? 'jadwal' : /keuangan|kas|uang|tabungan|anggaran/.test(L) ? 'keuangan' : /planet|tata surya/.test(L) ? 'planet' : /\d[\d.,]*\s*,\s*\d/.test(raw) ? 'data' : 'nilai';
        const n = Number((L.match(/(\d+)\s*(?:siswa|orang|murid|anak|baris)/) || L.match(/perkalian\s*(?:1\s*(?:sampai|hingga|-)\s*)?(\d+)/) || [])[1] || 0) || undefined;
        const data = kind === 'data' ? (raw.match(/-?\d+(?:[.,]\d+)?/g) || []).map(N.nlp.parseNumber) : undefined;
        const spec = N.content.excel(this, kind, { n, data });
        return art('xlsx', spec, `Lembar kerja **${spec.title}** siap${/nilai|absensi|keuangan|suhu|perkalian|data/.test(kind) ? ', lengkap dengan rumus otomatis' : ''}. Unduh sebagai Excel (.xlsx) atau CSV.`, 'Excel');
      }
      // word
      if ((/\b(word|docx|docs|google docs|dokumen word)\b/.test(L) && make) || (make && /\b(makalah|laporan praktikum|laporan|surat izin|surat|modul ajar|rpp|lembar soal|lembar kerja siswa|lks|rangkuman|ringkasan materi|artikel)\b/.test(L) && !/\bringkas(kan)? dokumen\b/.test(L))) {
        const kind = /surat/.test(L) ? 'surat' : /laporan/.test(L) ? 'laporan' : /modul ajar|rpp/.test(L) ? 'rpp' : /soal|kuis|ujian|ulangan|lks/.test(L) ? 'soal' : 'materi';
        let topic = topicOf(raw).replace(/\b(makalah|laporan praktikum|laporan|surat izin|surat|modul ajar|rpp|lembar soal|soal|lks|rangkuman|ringkasan materi|artikel)\b/gi, '').trim();
        if (kind === 'surat') topic = (raw.match(/\bkarena\s+(.+?)[.!?]?$/i) || [])[1] || '';
        const spec = N.content.documentSpec(this, kind, topic);
        const what = { surat: 'Surat izin', laporan: 'Laporan praktikum', rpp: 'Modul ajar', soal: 'Lembar soal', materi: 'Dokumen materi' }[kind];
        return art('docx', spec, `${spec.title.toLowerCase().startsWith(what.toLowerCase()) ? '' : what + ' '}**${spec.title}** siap${spec.known ? '' : ' (berupa kerangka yang bisa kamu lengkapi)'}. Unduh sebagai Word (.docx).`, 'Word');
      }
      // kuis di obrolan
      let m = L.match(/\b(?:buat|buatkan|berikan|beri|kasih|bikin|bikinkan)\s+(?:aku\s+|saya\s+)?(\d+)?\s*(?:buah\s+)?(?:soal|kuis|pertanyaan latihan|latihan soal)\b(?:\s+(?:tentang|mengenai|materi|soal)?\s*(.+))?/);
      if (m) {
        const qz = N.content.quiz(this, m[2] || '', Math.min(15, Number(m[1] || 5)), Date.now() % 1000);
        think.push({ k: 'Kuis', v: `${qz.questions.length} soal dibuat dari kalimat definisi di pengetahuan` });
        if (!qz.questions.length) return { text: N.content.quizMarkdown(qz), badge: 'Kuis', think, skill: 'kuis', quizTopic: m[2] || '', quizN: Math.min(15, Number(m[1] || 5)) };
        return { text: `Ini **${qz.questions.length} soal** ${m[2] ? 'tentang **' + m[2] + '**' : 'latihan'}. Jawab langsung di kartu, jadikan game kuis, unduh sebagai Word, atau ekspor ke Quizlet.`, badge: 'Kuis', think, skill: 'kuis', art: { kind: 'quiz', spec: qz }, quizTopic: m[2] || '', quizN: Math.min(15, Number(m[1] || 5)) };
      }
      // animasi

  // -------------------------------------------------------------------- word
  function docxHTML(spec) {
    const r = (t) => esc(String(t || '')).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    let html = '';
    let list = null;
    const close = () => {
      if (list) html += `</${list}>`;
      list = null;
    };
    for (const b of spec.blocks) {
      if (b.t === 'li' || b.t === 'oli') {
        const want = b.t === 'li' ? 'ul' : 'ol';
        if (list !== want) {
          close();
          html += `<${want}>`;
          list = want;
        }
        html += `<li>${r(b.text)}</li>`;
        continue;
      }
      close();
      if (b.t === 'title') html += `<h1>${r(b.text)}</h1>`;
      else if (b.t === 'subtitle') html += `<p class="sub">${r(b.text)}</p>`;
      else if (b.t === 'h1') html += `<h2>${r(b.text)}</h2>`;
      else if (b.t === 'h2') html += `<h3>${r(b.text)}</h3>`;
      else if (b.t === 'quote') html += `<blockquote>${r(b.text)}</blockquote>`;
      else if (b.t === 'line') html += `<p class="line">${r(b.text)} ____________________</p>`;
      else if (b.t === 'pagebreak') html += '<hr>';
      else if (b.t === 'table') html += `<div class="table-wrap"><table>${b.rows.map((row, i) => `<tr>${row.map((c) => (i ? `<td>${r(c)}</td>` : `<th>${r(c)}</th>`)).join('')}</tr>`).join('')}</table></div>`;
      else html += `<p>${r(b.text)}</p>`;
    }
    close();
    return html;
  }
  function docx(spec) {
    const el = shell('docx', spec.title, `<div class="paper content">${docxHTML(spec)}</div>`, `<button class="btn small primary" data-a="dl">${icon('download')}${t('Unduh Word (.docx)')}</button><button class="btn small" data-a="copy">${icon('copy')}${t('Salin teks')}</button>${gBtn('googledocs', t('Kirim ke Google Docs'))}`);
    el.addEventListener('click', (e) => {
      const a = e.target.closest('[data-a]');
      if (!a) return;
      if (a.dataset.a === 'dl') dl(slug(spec.title) + '.docx', N.office.docx(spec), 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
      if (a.dataset.a === 'copy') N.app.copyText($('.paper', el).innerText);
      if (a.dataset.a === 'gsend') sendGoogle(a, 'googledocs', 'createDoc', { title: spec.title, blocks: spec.blocks });
    });
    return el;
  }

  // ------------------------------------------------------------------- excel
  function xlsx(spec) {
    const tabs = spec.sheets.length > 1 ? `<div class="filters">${spec.sheets.map((s, i) => `<button class="filter" type="button" data-sheet="${i}" aria-pressed="${i === 0}">${esc(s.name)}</button>`).join('')}</div>` : '';
    const el = shell('xlsx', spec.title, `${tabs}<div class="sheet"></div>`, `<button class="btn small primary" data-a="dl">${icon('download')}${t('Unduh Excel (.xlsx)')}</button><button class="btn small" data-a="csv">${t('Unduh CSV')}</button>${gBtn('googlesheets', t('Kirim ke Google Sheets'))}`);
    const show = (k) => {
      const sh = spec.sheets[k];
      const rows = sh.rows.slice(0, 40);
      const cols = Math.min(14, Math.max(...rows.map((r) => r.length)));
      const val = (c) => (c && typeof c === 'object' ? (c.f ? (c.v !== undefined ? fmtCell(c.v) : '=' + c.f) : fmtCell(c.v)) : fmtCell(c));
      $('.sheet', el).innerHTML = `<div class="table-wrap"><table class="xl"><thead><tr><th></th>${Array.from({ length: cols }, (_, j) => `<th>${N.office.colName(j)}</th>`).join('')}</tr></thead><tbody>${rows.map((r, i) => `<tr><th>${i + 1}</th>${Array.from({ length: cols }, (_, j) => `<td class="${i === 0 && sh.header !== false ? 'h' : ''}${r[j] && r[j].f ? ' f' : ''}" title="${r[j] && r[j].f ? '=' + esc(r[j].f) : ''}">${esc(String(val(r[j]) ?? ''))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${sh.rows.length > 40 ? `<p class="note">${t('Menampilkan 40 dari {n} baris. Berkas Excel berisi semuanya.', { n: sh.rows.length })}</p>` : ''}<p class="note">${t('Sel berwarna berisi rumus yang dihitung otomatis di Excel.')}</p>`;
    };
    const fmtCell = (v) => (typeof v === 'number' ? (Number.isInteger(v) ? v : Math.round(v * 100) / 100).toLocaleString('id-ID') : v ?? '');
    show(0);
    el.addEventListener('click', (e) => {
      const t = e.target.closest('[data-sheet]');
      if (t) {
        $$('[data-sheet]', el).forEach((b) => b.setAttribute('aria-pressed', b === t));
        return show(+t.dataset.sheet);
      }
      const a = e.target.closest('[data-a]');
      if (!a) return;
      if (a.dataset.a === 'dl') dl(slug(spec.title) + '.xlsx', N.office.xlsx(spec), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      if (a.dataset.a === 'gsend') sendGoogle(a, 'googlesheets', 'createSheet', { title: spec.title, sheets: spec.sheets });
      if (a.dataset.a === 'csv') dl(slug(spec.title) + '.csv', '﻿' + N.office.csv(spec.sheets[0].rows.map((r) => r.map((c) => (c && typeof c === 'object' ? c.v ?? (c.f ? '=' + c.f : '') : c)))), 'text/csv');
    });
    return el;
  }

  // -------------------------------------------------------------------- kode
  function code(g) {
    const runnable = g.kind === 'web' || g.lang === 'js';
    const el = shell('code', `${g.title} · ${g.langName}`, `<pre class="code"><code>${esc(g.code)}</code></pre>${g.output ? `<details class="think"><summary>${t('Contoh keluaran (dengan masukan contoh)')}</summary><pre class="code out"><code>${esc(g.output)}</code></pre></details>` : ''}<div class="run-out" hidden></div>`, `${runnable ? `<button class="btn small primary" data-a="run">${icon('play')}${t('Jalankan')}</button>` : ''}<button class="btn small" data-a="copy">${icon('copy')}${t('Salin kode')}</button><button class="btn small" data-a="dl">${icon('download')}${t('Unduh')} ${esc(g.file)}</button>${g.kind === 'web' ? `<button class="btn small" data-a="full" hidden>${t('Layar penuh')}</button>` : ''}`);
    el.addEventListener('click', async (e) => {
      const a = e.target.closest('[data-a]');
      if (!a) return;
      if (a.dataset.a === 'copy') N.app.copyText(g.code);
      if (a.dataset.a === 'dl') {
        const okExt = /\.(html|txt|json|md|csv)$/.test(g.file);
        const inArtifact = window.claude && typeof window.claude.use === 'function' && (await window.claude.use('downloads'));
        if (inArtifact && !okExt) dl(g.file.replace(/\.\w+$/, '') + '.zip', N.office.zip([{ name: g.file, data: g.code }]), 'application/zip');
        else dl(g.file, g.code, 'text/plain');
      }
      if (a.dataset.a === 'run') run(el, g);
      if (a.dataset.a === 'full') {
        const f = $('iframe.run-web', el);
        if (f && f.requestFullscreen) f.requestFullscreen().catch(() => {});
      }
    });
    return el;
  }
  /** Jalankan program di kotak pasir terpisah (/sandbox.html, tanpa akses ke akun pengguna). */
  function run(el, g) {
    const out = $('.run-out', el);
    out.hidden = false;
    out.innerHTML = '';
    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts allow-modals allow-popups allow-popups-to-escape-sandbox allow-forms');
    frame.setAttribute('allow', 'fullscreen');
    frame.allowFullscreen = true;
    frame.title = t('Hasil program');
    // kotak pasir: halaman /sandbox.html dari server Galaxy; tanpa server, dokumen srcdoc ber-sandbox (asal terpisah)
    if (N.net && N.net.mode === 'direct' && window.GALAXY_SANDBOX_HTML) frame.srcdoc = window.GALAXY_SANDBOX_HTML;
    else frame.src = N.net ? N.net.url('/sandbox.html') || '/sandbox.html' : '/sandbox.html';
    const id = 'r' + Math.random().toString(36).slice(2);
    let pre = null;
    const lines = [];
    const onMsg = (e) => {
      if (e.source !== frame.contentWindow || !e.data) return;
      if (e.data.galaxy === 'ready') {
        frame.contentWindow.postMessage({ galaxy: 'run', id, mode: g.kind === 'web' ? 'html' : 'js', code: g.code }, '*');
        if (g.kind === 'web') {
          const fb = $('[data-a="full"]', el);
          if (fb) fb.hidden = false;
          window.removeEventListener('message', onMsg);
        }
        return;
      }
      if (e.data.galaxy !== 'out' || e.data.id !== id) return;
      if (e.data.t === 'log') lines.push(e.data.s);
      if (e.data.t === 'err') lines.push(t('Galat') + ': ' + e.data.s);
      pre.textContent = lines.join('\n') || t('(tidak ada keluaran)');
      if (e.data.t === 'done') window.removeEventListener('message', onMsg);
    };
    window.addEventListener('message', onMsg);
    if (g.kind === 'web') {
      frame.className = 'run-web';
    } else {
      pre = document.createElement('pre');
      pre.className = 'code out';
      pre.textContent = t('Menjalankan…');
      out.appendChild(pre);
      frame.hidden = true;
    }
    out.appendChild(frame);
  }

  // ------------------------------------------------------------- Google
  function gBtn(app, label) {
    const st = N.app && N.app.appStatus ? N.app.appStatus(app) : null;
    return st && st.configured ? `<button class="btn small" data-a="gsend">${icon('link')}${esc(label)}</button>` : '';
  }
  async function sendGoogle(btn, app, action, payload) {
    const st = N.app.appStatus(app);
    if (!st || !st.connected) {
      toast(t('Sambungkan {a} dulu di menu Koneksi.', { a: st ? st.name : app }));
      return N.app.go('koneksi');
    }
    btn.disabled = true;
    const old = btn.innerHTML;
    btn.textContent = t('Mengirim…');
    try {
      const r = await N.net.connect.act(app, action, payload);
      toast(t('Berhasil dibuat di {a}.', { a: st.name }));
      if (r && r.url) {
        const a = document.createElement('a');
        a.href = r.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.className = 'btn small';
        a.textContent = t('Buka di {a}', { a: st.name });
        btn.after(a);
      }
    } catch (e) {
      toast(e.message);
    }
    btn.disabled = false;
    btn.innerHTML = old;
  }

  // ---------------------------------------------------------------- kuis
  function quiz(spec) {
    const L = ['A', 'B', 'C', 'D'];
    const el = shell('quiz', spec.title, `<div class="quiz">${spec.questions.map((q, i) => `<div class="qz" data-i="${i}"><p><b>${i + 1}.</b> ${esc(q.q)}</p>${q.options.map((o, j) => `<button class="qopt" type="button" data-j="${j}">${L[j]}. ${esc(o)}</button>`).join('')}</div>`).join('')}<p class="note qscore"></p></div>`,
      `<button class="btn small primary" data-a="game">${icon('play')}${t('Jadikan game kuis')}</button><button class="btn small" data-a="docx">${icon('download')}${t('Unduh Word')}</button><button class="btn small" data-a="quizlet">${t('Ekspor ke Quizlet')}</button>`);
    let right = 0, done = 0;
    el.addEventListener('click', (e) => {
      const b = e.target.closest('.qopt');
      if (b) {
        const box = b.closest('.qz');
        if (box.dataset.done) return;
        box.dataset.done = '1';
        const q = spec.questions[+box.dataset.i];
        const j = +b.dataset.j;
        [...box.querySelectorAll('.qopt')].forEach((x, k) => k === q.answer && x.classList.add('ok'));
        if (j === q.answer) right++;
        else b.classList.add('no');
        done++;
        $('.qscore', el).textContent = t('Skor: {a} dari {b}', { a: right, b: done });
        return;
      }
      const a = e.target.closest('[data-a]');
      if (!a) return;
      if (a.dataset.a === 'game') {
        const g = N.apps.generate({ kind: 'game', id: 'quiz', name: spec.title, topic: '' }, { questions: spec.questions });
        el.after(code(g));
      }
      if (a.dataset.a === 'docx') {
        const blocks = [{ t: 'title', text: spec.title }];
        spec.questions.forEach((q, i) => {
          blocks.push({ t: 'p', text: `**${i + 1}.** ${q.q}` });
          q.options.forEach((o, j) => blocks.push({ t: 'p', text: `      ${L[j]}. ${o}` }));
        });
        blocks.push({ t: 'pagebreak' }, { t: 'h1', text: t('Kunci jawaban') }, { t: 'p', text: spec.questions.map((q, i) => `${i + 1}${L[q.answer]}`).join(', ') });
        dl(slug(spec.title) + '.docx', N.office.docx({ title: spec.title, blocks }), 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
      }
      if (a.dataset.a === 'quizlet') {
        const txt = spec.questions.map((q) => `${q.q.replace(/[\t\n]+/g, ' ')}\t${q.options[q.answer]}`).join('\n');
        N.app.modal(`<h2>${t('Ekspor ke Quizlet')}</h2><ol class="steps"><li>${t('Salin teks di bawah.')}</li><li>${t('Di Quizlet, buat set baru lalu pilih Impor.')}</li><li>${t('Tempel teksnya. Pemisah istilah & definisi: Tab. Pemisah kartu: Baris baru.')}</li></ol><textarea class="textarea" rows="8" readonly id="qlx">${esc(txt)}</textarea><div class="row-end"><button class="btn" type="button" id="qlc">${t('Salin')}</button><a class="btn primary" href="https://quizlet.com/create-set" target="_blank" rel="noopener">${t('Buka Quizlet')}</a></div>`, (m) => {
          $('#qlc', m).onclick = () => N.app.copyText($('#qlx', m).value, $('#qlx', m));
        });
      }
    });
    return el;
  }

  function render(art) {
    const f = { image, anim, video, pptx, docx, xlsx, code, quiz }[art.kind];
    try {
      return f ? f(art.spec) : document.createTextNode('');
    } catch (e) {
      const d = document.createElement('p');
      d.className = 'note';
      d.textContent = t('Kreasi ini tidak bisa ditampilkan: {e}', { e: e.message });
      return d;
    }
  }
  N.cards = { render, docxHTML };
})();

  function renderStudio() {

  // ============================================================ TUGAS & NOTIF
  let scheduler = null;
  function notify(n) {
    mem.set('notifs', N.tasks.pushNotif(mem.get('notifs', []), n));
    updateBell();
    A().toast('🔔 ' + n.title);
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        const nn = new Notification(n.title, { body: N.md.plain(n.body || '').slice(0, 180), tag: n.taskId || undefined });
        nn.onclick = () => {
          window.focus();
          openBell();
        };
      }
    } catch (e) {}
    if (location.hash.startsWith('#tugas')) renderTasks();
  }
  async function runAction(task) {
    const a = task.action || { type: 'ingat' };
    if (a.type === 'ingat') return t('Waktunya: **{x}**', { x: task.title });
    if (a.type === 'perintah') {
      const r = await A().ask(a.text);
      if (r.art) {
        saveCreation(r.art);
        return `${r.text}\n\n_${t('Hasilnya tersimpan di galeri Studio.')}_`;
      }
      return r.text;
    }
    if (a.type === 'perbarui') {
      const n = await N.research.refreshOld(5);
      return t('{n} pengetahuan dari internet diperbarui.', { n });
    }
    if (a.type === 'cadangan') {
      await mem.flush();
      return mem.status.sync === 'on' ? t('Memori tersimpan di perangkat dan akun Google.') : t('Memori tersimpan di perangkat ini.');
    }
    return t('Selesai.');
  }
  function startScheduler() {
    scheduler = new N.tasks.Scheduler({ getTasks: () => mem.get('tasks', []), setTasks: (x) => mem.set('tasks', x), run: runAction, notify });
    const go = () => {
      scheduler.start(15000);
      document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && scheduler.tick());
    };
    if (navigator.locks && navigator.locks.request) navigator.locks.request('galaxy-penjadwal', () => new Promise(() => go())).catch(go);
    else go();
  }
  function addTask(task) {
    const list = mem.get('tasks', []);
    list.push(task);
    mem.set('tasks', list);
    if (scheduler) setTimeout(() => scheduler.tick(), 500);
  }
  const ACT = () => ({ ingat: t('Pengingat'), perintah: t('Perintah Galaxy'), perbarui: t('Perbarui pengetahuan'), cadangan: t('Simpan memori') });
  function renderTasks() {
    const el = $('#view-tugas .page-in');
    const tasks = mem.get('tasks', []);
    const notifs = mem.get('notifs', []);
    const perm = 'Notification' in window ? Notification.permission : 'unsupported';
    el.innerHTML = `<div class="page-head"><div class="grow"><h1>${t('Tugas & notifikasi')}</h1><p>${t('Atur tugas yang dijalankan Galaxy pada waktu tertentu: pengingat, berita atau cuaca harian, perintah apa pun, atau memperbarui pengetahuan. Tugas yang terlewat saat Galaxy ditutup dijalankan begitu dibuka lagi.')}</p></div></div>
      <form class="composer studio-form" id="taskForm"><label class="sr-only" for="taskIn">${t('Tugas baru')}</label><input id="taskIn" class="studio-in" placeholder="${esc(t('ingatkan aku belajar IPA setiap hari jam 19.00'))}" autocomplete="off"><button class="btn primary" type="submit">${t('Jadwalkan')}</button></form>
      <div class="chips">${[t('ingatkan aku minum air setiap 2 jam'), t('setiap hari jam 06.30 kirim cuaca jakarta'), t('setiap pagi jam 7 kirim berita tentang teknologi'), t('setiap senin dan rabu jam 7 pagi kirim kata motivasi'), t('10 menit lagi ingatkan aku angkat jemuran'), t('setiap minggu jam 20.00 perbarui pengetahuan')].map((x) => `<button class="chip" type="button" data-tex="${esc(x)}">${esc(x)}</button>`).join('')}</div>
      <div class="cols">
        <div class="panel"><h2>${t('Tugas terjadwal ({n} aktif)', { n: tasks.filter((x) => x.enabled).length })}</h2>
          <div class="k-list">${tasks.length ? tasks.slice().sort((a, b) => b.enabled - a.enabled || (a.next || 9e15) - (b.next || 9e15)).map((x) => `<div class="task-item ${x.enabled ? '' : 'off'}"><div class="ti"><b>${esc(x.title)}</b><span>${esc(ACT()[x.action.type] || '')} · ${esc(N.tasks.describe(x.schedule))}</span><span class="dm">${x.enabled && x.next ? t('Berikutnya: {w}', { w: esc(N.tasks.fmtWhen(x.next)) }) : x.runs ? t('Selesai') : t('Nonaktif')}${x.runs ? ' · ' + t('dijalankan {n}×', { n: x.runs }) : ''}</span></div><div class="toolbar"><label class="switch" title="${esc(t('Aktif'))}"><input type="checkbox" data-tg="${x.id}" ${x.enabled ? 'checked' : ''}><span class="sr-only">${t('Aktif')}</span></label><button class="btn small" type="button" data-trun="${x.id}">${t('Jalankan')}</button><button class="btn small danger" type="button" data-tdel="${x.id}" aria-label="${esc(t('Hapus'))}">${icon('trash')}</button></div></div>`).join('') : `<div class="empty">${t('Belum ada tugas. Tulis kalimat di atas, misalnya "ingatkan aku belajar setiap hari jam 19.00".')}</div>`}</div>
        </div>
        <div class="panel"><h2>${t('Notifikasi')}</h2>
          <div class="toolbar">${perm === 'granted' ? `<span class="tag skill">${t('Notifikasi sistem aktif')}</span>` : perm === 'denied' ? `<span class="tag">${t('Notifikasi sistem diblokir peramban')}</span>` : perm === 'unsupported' ? '' : `<button class="btn small" type="button" id="permBtn">${t('Aktifkan notifikasi sistem')}</button>`}<button class="btn small" type="button" id="readAll">${t('Tandai sudah dibaca')}</button><button class="btn small danger" type="button" id="clearN">${t('Hapus semua')}</button></div>
          <div class="notif-list">${notifList(notifs.slice(0, 40))}</div>
        </div>
      </div>`;
    const create = (text) => {
      const p = N.tasks.parse(text);
      if (!p) return A().toast(t('Kalimat belum dikenali sebagai jadwal. Contoh: "ingatkan aku belajar setiap hari jam 19.00".'));
      if (p.error) return A().toast(p.error);
      const task = N.tasks.makeTask(p);
      addTask(task);
      A().toast(t('Dijadwalkan: {x}, {w}.', { x: task.title, w: N.tasks.describe(task.schedule) }));
      renderTasks();
    };
    $('#taskForm').onsubmit = (e) => {
      e.preventDefault();
      create($('#taskIn').value);
    };
    $$('[data-tex]', el).forEach((b) => (b.onclick = () => create(b.dataset.tex)));
    $$('[data-tg]', el).forEach((c) => (c.onchange = () => {
      const list = mem.get('tasks', []);
      const x = list.find((y) => y.id === c.dataset.tg);
      x.enabled = c.checked;
      if (x.enabled && x.schedule.type === 'sekali' && x.runs) x.runs = 0;
      x.next = N.tasks.nextRun(x);
      mem.set('tasks', list);
      renderTasks();
    }));
    $$('[data-trun]', el).forEach((b) => (b.onclick = async () => {
      const x = mem.get('tasks', []).find((y) => y.id === b.dataset.trun);
      b.disabled = true;
      notify({ title: x.title, body: await runAction(x), kind: x.action.type, taskId: x.id });
    }));
    $$('[data-tdel]', el).forEach((b) => (b.onclick = () => {
      mem.set('tasks', mem.get('tasks', []).filter((x) => x.id !== b.dataset.tdel));
      renderTasks();
    }));
    const pb = $('#permBtn');
    if (pb) pb.onclick = async () => {
      try {
        await Notification.requestPermission();
      } catch (e) {}
      renderTasks();
    };
    $('#readAll').onclick = () => {
      mem.set('notifs', mem.get('notifs', []).map((n) => Object.assign({}, n, { read: true })));
      updateBell();
      renderTasks();
    };
    $('#clearN').onclick = () => {
      mem.set('notifs', []);
      updateBell();
      renderTasks();
    };
  }
  function notifList(list) {
